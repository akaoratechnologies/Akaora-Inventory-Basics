 const root=document.createElement('section');root.className='v19-variation-editor full';root.innerHTML=`<h4>Product variations & pricing</h4><label for="v19Mode">How will this product be sold?</label>
 <select id="v19Mode" aria-label="Variation type"><option value="none" ${selected==='none'?'selected':''}>Standard product / piece</option><option value="weight" ${selected==='weight'?'selected':''}>⚖ By weight (sweets, dry fruits, groceries)</option><option value="size" ${selected==='size'?'selected':''}>👕 Garment size (S, M, L, XL...)</option><option value="bangle" ${selected==='bangle'?'selected':''}>◯ Bangles size (Kids 0, 2-0, 2-2, 2-4...)</option></select>
 <div id="v19WeightFields" class="v19-variant-fields" ${selected==='weight'?'':'hidden'}><div><label for="v19Minimum">Minimum order (grams)</label><input id="v19Minimum" type="number" min="1" max="50000" step="1" value="${Number(p.minWeightGrams)||50}"></div><div><label for="v19WeightPresets">Preset weights (grams)</label><input id="v19WeightPresets" placeholder="50,100,250,500,750,1000" value="${safe(weightPresets)}"></div><p class="muted tiny full">Selling price and purchase cost above are per 1 kg. Current stock and low-stock threshold above are in kg. 125g is charged at 0.125 × per-kg price.</p></div>
 <div id="v19SizeFields" ${selected==='size'?'':'hidden'}><p class="muted tiny">Set individual prices for each garment size, or leave blank to use the standard selling price. Current stock above is shared across sizes.</p><div class="v19-size-fields">${sizes.map(s=>`<div><label for="v19Price${s}">${s} price (₹)</label><input id="v19Price${s}" type="number" min="0" step="0.01" placeholder="Base price" value="${Object.hasOwn(sizePrices,s)?safe(sizePrices[s]):''}"></div>`).join('')}</div></div>
 <div id="v21BangleFields" ${selected==='bangle'?'':'hidden'}><p class="muted tiny">Select the Indian bangle size (Kids 0, 2-0 to 2-12). Set an optional price per size; blank uses the standard selling price. Stock is shared across sizes.</p><div class="v19-size-fields">${bangleSizes.map((s,i)=>`<div><label for="v21BanglePrice${i}">${s==='0'?'0 (Kids)':s} price (₹)</label><input id="v21BanglePrice${i}" type="number" min="0" step="0.01" placeholder="Base price" value="${Object.hasOwn(banglePrices,s)?safe(banglePrices[s]):''}"></div>`).join('')}</div></div>`;
 form.appendChild(root);
 const mode=root.querySelector('#v19Mode');
 mode.onchange=()=>{root.querySelector('#v19WeightFields').hidden=mode.value!=='weight';root.querySelector('#v19SizeFields').hidden=mode.value!=='size';root.querySelector('#v21BangleFields').hidden=mode.value!=='bangle';if(mode.value==='weight'){const u=document.getElementById('punit');if(u)u.value='kg'}else if(mode.value==='bangle'){const u=document.getElementById('punit');if(u)u.value='piece'}};
 const originalSubmit=submit.onclick;
 submit.onclick=function(e){
  const type=mode.value,min=Number(root.querySelector('#v19Minimum').value),raw=root.querySelector('#v19WeightPresets').value;
  let presets=raw.split(',').map(x=>Number(x.trim())).filter(x=>Number.isInteger(x)&&x>=1&&x<=50000);
  presets=[...new Set(presets)].sort((a,b)=>a-b);
  if(type==='weight'&&(!Number.isInteger(min)||min<1||min>50000))return toast('Minimum weight must be between 1 and 50000 grams');
  if(type==='weight'&&!presets.length)return toast('Enter at least one preset weight');
  const prices={};
  for(const size of sizes){const val=root.querySelector('#v19Price'+size).value.trim();if(val!==''){const n=Number(val);if(!Number.isFinite(n)||n<0)return toast('Invalid price for '+size);prices[size]=cents(n)}}
  const bPrices={};
  for(const [i,bSize] of bangleSizes.entries()){const val=root.querySelector('#v21BanglePrice'+i).value.trim();if(val!==''){const n=Number(val);if(!Number.isFinite(n)||n<0)return toast('Invalid bangle price for '+bSize);bPrices[bSize]=cents(n)}}
  const before=new Set(products.map(x=>x.id)),oldName=document.getElementById('pn')?.value.trim();
  if(type==='weight'){const u=document.getElementById('punit');if(u)u.value='kg'}
  originalSubmit?.call(submit,e);
  const saved=id?pby(id):products.find(x=>!before.has(x.id)&&x.name===oldName);
  if(!saved||document.getElementById('modalback')?.style.display!=='none')return;
  saved.variationMode=type;
  if(type==='weight'){saved.minWeightGrams=min;saved.weightPresets=presets;saved.unit='kg';}
  if(type==='size')saved.sizePrices=prices;
  if(type==='bangle')saved.banglePrices=bPrices;
  save();pageRender();
 };
};

// Modal selection is used in BOTH Fast and Standard catalogues because both call addCart(id).
let currentWeight=0,currentSize='';
function openVariant(id){
 const p=pby(id);if(!p)return;
 if(kind(p)==='weight')showWeightPicker(p);else if(kind(p)==='size')showSizePicker(p);else if(kind(p)==='bangle')showBanglePicker(p);
}
function modalHeader(p){return `<div class="v19-picker-head">${p.image?`<img src="${safe(p.image)}" alt="">`:''}<div><h3 style="margin:0">${safe(p.name)}</h3><span class="v19-product-chip">${safe(offerLabels[kind(p)]||'Variation')}</span><p class="muted tiny" style="margin:5px 0">Available: ${stockRound(p.qty)} ${kind(p)==='weight'?'kg':'pieces'}</p></div></div>`}
function validWeight(g,p){return Number.isInteger(g)&&g>=Math.max(1,Number(p.minWeightGrams)||50)&&g<=50000&&g/1000<=Number(p.qty)+0.000001}
function weightPrice(p,g){return cents(Number(p.price||0)*g/1000)}
function showWeightPicker(p){
 currentWeight=Math.max(50,Number(p.minWeightGrams)||50);
 const presets=(Array.isArray(p.weightPresets)&&p.weightPresets.length?p.weightPresets:defaultWeights).filter(n=>n>=Math.max(1,Number(p.minWeightGrams)||50));
 const body=modalHeader(p)+`<p class="muted">Choose a weight, or enter exact grams. Price updates automatically from ${money(p.price)} / kg.</p><div class="v19-presets">${presets.map(n=>`<button class="v19-preset" type="button" onclick="AkaoraVariations.setWeight(${n})" data-grams="${n}" aria-pressed="false">${n>=1000?Number(n/1000).toLocaleString('en-IN')+' kg':n+'g'}</button>`).join('')}</div><div><label for="v19Grams">Custom weight in grams</label><input type="number" id="v19Grams" min="${Math.max(1,Number(p.minWeightGrams)||50)}" step="1" inputmode="numeric" value="${currentWeight}" oninput="AkaoraVariations.previewWeight()"></div><div id="v19WeightPrice" class="v19-preview"></div><p class="v19-warning" id="v19WeightError"></p>`;
 openModal('Select weight — '+p.name,body,'Add to bill',()=>{
  const grams=Number(document.getElementById('v19Grams')?.value);if(!validWeight(grams,p))return toast('Minimum '+(p.minWeightGrams||50)+'g; available '+stockRound(Number(p.qty)*1000)+'g');
  addVariantToCart(p,grams+'g',weightPrice(p,grams),cents(Number(p.cost||0)*grams/1000),{weightGrams:grams});
 });
 V19.previewWeight();
}
function showSizePicker(p){
 currentSize='';const ps=p.sizePrices||{};
 const body=modalHeader(p)+`<p class="muted">Select the garment size. Each size can have a different price.</p><div class="v19-presets">${sizes.map(s=>`<button class="v19-preset" type="button" onclick="AkaoraVariations.setSize('${s}')" data-size="${s}" aria-pressed="false">${s}<br><small>${money(Object.hasOwn(ps,s)?ps[s]:p.price)}</small></button>`).join('')}</div><div id="v19SizePrice" class="v19-preview">Choose a size above.</div>`;
 openModal('Select size — '+p.name,body,'Add to bill',()=>{
  if(!currentSize)return toast('Select a garment size first');
  addVariantToCart(p,currentSize,cents(Object.hasOwn(ps,currentSize)?ps[currentSize]:p.price),Number(p.cost||0),{sizeLabel:currentSize});
 });
}
function showBanglePicker(p){
 currentSize='';const ps=p.banglePrices||{};
 const body=modalHeader(p)+`<p class="muted">Select the bangle size. Each size may have its own price, or use the standard product price.</p><div class="v19-presets v21-bangle-presets">${bangleSizes.map(s=>`<button class="v19-preset" type="button" onclick="AkaoraVariations.setSize('${s}')" data-size="${s}" aria-pressed="false">${s==='0'?'0 · Kids':s}<br><small>${money(Object.hasOwn(ps,s)?ps[s]:p.price)}</small></button>`).join('')}</div><div id="v19SizePrice" class="v19-preview">Choose a bangle size above.</div>`;
 openModal('Select bangle size — '+p.name,body,'Add to bill',()=>{
  if(!currentSize)return toast('Select a bangle size first');
  addVariantToCart(p,currentSize,cents(Object.hasOwn(ps,currentSize)?ps[currentSize]:p.price),Number(p.cost||0),{sizeLabel:currentSize,bangleSize:currentSize});
 });
}
function addVariantToCart(p,label,price,cost,meta){
 const current=quickItems.find(x=>x.variantSourceId===p.id&&x.name===p.name+' '+label&&Number(x.price)===price);
 const id=current?.id||'variant_'+uid();
 const record=current||{id,name:p.name+' '+label,variantLabel:label,variantSourceId:p.id,price,cost,sku:p.sku,barcode:p.barcode||'',unit:kind(p)==='weight'?'pack':'piece',image:p.image,quick:true,...meta};
 const next={...cart,[id]:(Number(cart[id])||0)+1};
 if(!current)quickItems.push(record);
 const required=window.AkaoraOfferEngine?.requiredStock(next)||{};
 const blocked=Object.entries(required).find(([id,units])=>Number(units)>Number(pby(id)?.qty||0)+0.000001);
 if(blocked){if(!current)quickItems=quickItems.filter(x=>x.id!==id);return toast('Not enough stock for '+(pby(blocked[0])?.name||'product')+': need '+blocked[1]+', available '+(pby(blocked[0])?.qty||0))}
 cart=next;billDraft.paid=null;closeModal();pageRender();toast(record.name+' added to bill');
 if(window.akaoraPendingBillProduct===p.id){window.akaoraPendingBillProduct=null;go('billing');}
}
const priorAddCart=addCart;
addCart=function(id){const p=pby(id);if(p&&kind(p)!=='none')return openVariant(id);return priorAddCart(id)};

// The V12 offer engine consults these hooks without changing its existing calculations.
function paidQuantities(fromCart){const totals={};for(const [id,qty] of Object.entries(fromCart)){
 const product=pby(originOf(id));if(product&&Number(qty)>0)totals[product.id]=(totals[product.id]||0)+Number(qty);
 }return totals;}
function stockAdditions(fromCart){const stock={};for(const [id,qty] of Object.entries(fromCart)){
 const q=quickItems.find(x=>x.id===id);if(!q?.variantSourceId)continue;
 const units=q.weightGrams?Number(q.weightGrams)/1000:1;
 stock[q.variantSourceId]=stockRound((stock[q.variantSourceId]||0)+units*Number(qty));
 }return stock;}
window.AkaoraVariantBridge={paidQuantities,stockAdditions};
// One gift per set is still tracked independently of the variation's base stock.
const oldFinalize=finalize;
finalize=function(){
 const variantLines=quickItems.filter(q=>q.variantSourceId).map(q=>({...q}));const count=invoices.length;
 oldFinalize();
 if(invoices.length!==count+1)return;
 const invoice=invoices[invoices.length-1];
 for(const line of invoice.items||[]){if(!line.quick)continue;
  const q=variantLines.find(v=>v.name===line.name&&cents(v.price)===cents(line.price));if(!q)continue;
  line.id=q.variantSourceId;line.quick=false;line.variation={type:q.weightGrams?'weight':q.bangleSize?'bangle':'size',grams:q.weightGrams||null,size:q.sizeLabel||null};
  line.unit=q.weightGrams?'pack':'piece';line.stockUnits=q.weightGrams?stockRound(q.weightGrams/1000):1;
 }
 save();
};
// The original scanner appends to cart directly, so scanned variant products must
// also open the selection screen instead of creating an incorrect base-priced line.
const scanHandler=window.AkaoraBillingScanReceive;
if(typeof scanHandler==='function')window.AkaoraBillingScanReceive=function(raw,scanner){
 const match=products.find(x=>String(x.barcode||'').trim().toLowerCase()===String(raw||'').trim().toLowerCase());
 if(match&&kind(match)!=='none'){
   scanner?.close?.();openVariant(match.id);return;
 }
 return scanHandler(raw,scanner);
};
V19.setWeight=function(n){const input=document.getElementById('v19Grams');if(input)input.value=String(n);V19.previewWeight()};
V19.previewWeight=function(){const input=document.getElementById('v19Grams');if(!input)return;
 const p=products.find(x=>document.getElementById('modalTitle')?.textContent?.endsWith('— '+x.name));if(!p)return;
 const g=Number(input.value),valid=validWeight(g,p),target=document.getElementById('v19WeightPrice');
 if(target)target.innerHTML=`<span><small>Selected weight</small><br><b>${Number.isFinite(g)?g:0} grams</b><br><small>${money(p.price)}/kg · Minimum ${p.minWeightGrams||50}g</small></span><strong>${valid?money(weightPrice(p,g)):'—'}</strong>`;
 document.querySelectorAll('.v19-preset[data-grams]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.grams)===g)));
 const error=document.getElementById('v19WeightError');if(error)error.textContent=valid?'':(g<Number(p.minWeightGrams||50)?'Minimum order: '+(p.minWeightGrams||50)+'g':'Weight must be a whole number and cannot exceed available stock.');
 const saveBtn=document.getElementById('modalSave');if(saveBtn)saveBtn.disabled=!valid;
};
V19.setSize=function(s){currentSize=s;const p=products.find(x=>document.getElementById('modalTitle')?.textContent?.endsWith('— '+x.name));if(!p)return;
 document.querySelectorAll('.v19-preset[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.size===s)));
 const priceMap=kind(p)==='bangle'?(p.banglePrices||{}):(p.sizePrices||{});
 const price=Object.hasOwn(priceMap,s)?priceMap[s]:p.price;
 const target=document.getElementById('v19SizePrice');if(target)target.innerHTML=`<span><small>Selected variation</small><br><b>${safe(p.name)} · ${safe(s)}</b></span><strong>${money(price)}</strong>`;
};
window.AkaoraVariations=V19;
})();

<script id="akaora-v20-print-responsive">
/* v20 — real BLE print routing, restaurant sequence, accessible mobile controls */
(function(){'use strict';
const safeV=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let printBusy=false;const foldState={};
const getPrinter=()=>window.AkaoraThermal;
function printerState(){try{return getPrinter()?.status?.()||{connected:false,name:''}}catch(e){return {connected:false,name:''}}}
function navbarPrinter(){
 const actions=document.querySelector('header.topbar .top-actions');if(!actions)return;
 if(!document.getElementById('v20PrinterHub')){
  const hub=document.createElement('div');hub.id='v20PrinterHub';hub.className='v20-print-hub';
  hub.innerHTML='<span id="v20PrinterPill" class="v20-printer-pill" role="status" title="Bluetooth printer status"><span class="v20-led"></span><span class="v20-printer-name">Disconnected</span></span><button type="button" id="v20PrinterAction" class="v20-printer-action secondary" title="Connect or disconnect Bluetooth printer">Connect</button>';
  const notify=actions.querySelector('#akaoraNotifyButton');if(notify)notify.before(hub);else actions.prepend(hub);
  hub.querySelector('button').addEventListener('click',toggleConnection);
 }
 refreshPrinter();
}
function refreshPrinter(){
 const status=printerState(),pill=document.getElementById('v20PrinterPill'),button=document.getElementById('v20PrinterAction');
 if(pill){pill.classList.toggle('connected',!!status.connected);const label=status.connected?(status.name||'BLE printer'):(window.innerWidth<=740?'Offline':'Disconnected');pill.querySelector('.v20-printer-name').textContent=label;pill.title=status.connected?'Connected: '+label:'Bluetooth printer disconnected';}
 if(button){button.textContent=status.connected?'Disconnect':'Connect';button.disabled=printBusy||!!status.running;}
 const badge=document.getElementById('tpStatus');if(badge){badge.textContent=status.connected?'● Connected: '+(status.name||'BLE printer'):'○ Not connected';badge.classList.toggle('connected',!!status.connected);}
}
async function toggleConnection(){try{if(printerState().connected){getPrinter().disconnect();toast('Printer disconnected');}else{await getPrinter().connect();toast('Printer connected. Run a test print to verify the paper output.');}}catch(e){toast('Bluetooth connection failed: '+String(e.message||e));}finally{refreshPrinter();}}
// Do not replace Print Studio's listener: forward its notifications and repaint the navbar.
const previousOnStatus=getPrinter()?.onStatus?.bind(getPrinter());
if(previousOnStatus){getPrinter().onStatus=function(fn){return previousOnStatus(e=>{try{fn?.(e)}finally{refreshPrinter()}})};getPrinter().onStatus(refreshPrinter);}
function configure(){const cfg=settings||{};getPrinter().configure({width:Number(cfg.blePaper||58),chunkSize:Number(cfg.bleChunk||100),delay:Number(cfg.bleDelay??12),darkness:Number(cfg.bleDark||180),command:cfg.bleCommand||'raster'});}
async function ensureConnected(){if(!printerState().connected)await getPrinter().connect();configure();}
async function compactLogo(){
 if(settings.billLogoEnabled===false||settings.v20ReceiptMode==='ultra')return null;
 const imgSrc=settings.shopLogo||window.AKAORA_BRAND_THERMAL_DATA||window.AKAORA_BRAND_LOGO_DATA;
 if(!imgSrc)return null;
 const img=new Image();img.src=imgSrc;
 try{await img.decode()}catch(e){return null}
 const width=getPrinter().dimensions(),h=width===384?80:104,c=document.createElement('canvas');c.width=width;c.height=h+6;
 const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
 const scale=Math.min(1,h/(img.naturalHeight||1),width*.5/(img.naturalWidth||1));
 const w=Math.max(1,Math.round((img.naturalWidth||1)*scale)),ih=Math.max(1,Math.round((img.naturalHeight||1)*scale));ctx.drawImage(img,Math.round((width-w)/2),Math.round((h-ih)/2),w,ih);return c;
}
async function doBill(inv){
 const kind=settings.v20ReceiptMode||'fast',text=window.AkaoraFastPrinter?.receiptText?.(inv)||'';
 const nativeText=kind!=='raster'&&/^[\x09\x0a\x0d\x20-\x7e]*$/.test(text);
 if(nativeText){
  await getPrinter().printNativeText(text,'Fast bill '+inv.no,await compactLogo());
  if(inv.method==='UPI'){
   const payload=inv.upiUri||window.AkaoraV12?.upiUri?.(inv.total,inv.no);
   if(payload&&window.AkaoraV12?.qrCanvas){const width=getPrinter().dimensions(),q=window.AkaoraV12.qrCanvas(payload,Math.min(230,width-30)),c=document.createElement('canvas');c.width=width;c.height=q.height+54;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#000';ctx.font='bold 18px Arial';ctx.textAlign='center';ctx.fillText('SCAN TO PAY UPI',width/2,6);ctx.drawImage(q,Math.floor((width-q.width)/2),28);await getPrinter().printCanvas(c,'UPI QR '+inv.no);}
  }
 }else{
  await getPrinter().printCanvas(await window.akaoraReceiptWithLogo(inv),'Compatible image bill '+inv.no);
 }
 inv.billPrintRequestedAt=Date.now();save();
}
async function doKOT(inv){
 const text=window.AkaoraFastPrinter?.kotText?.(inv)||'';
 if(settings.v20ReceiptMode!=='raster'&&/^[\x09\x0a\x0d\x20-\x7e]*$/.test(text))await getPrinter().printNativeText(text,'Fast KOT '+inv.no);
 else await getPrinter().printCanvas(kotCanvas(inv),'KOT '+inv.no);
 inv.kotPrintedAt=Date.now();save();
}
async function withPrint(id,action){
 const inv=invoices.find(x=>x.id===id);if(!inv)return toast('Invoice not found');
 if(printBusy)return toast('A print job is already running');
 printBusy=true;refreshPrinter();
 try{await ensureConnected();await action(inv);toast('Data sent to '+(printerState().name||'printer')+'. Please check actual paper output.');if(document.getElementById('modalback')?.style.display!=='none')viewInvoice(id);}
 catch(e){toast('Printing failed: '+String(e.message||e));}
 finally{printBusy=false;refreshPrinter();}
}
function printBill(id){return withPrint(id,doBill)}
function printKitchen(id){const inv=invoices.find(x=>x.id===id);if(!inv?.restaurantOrder)return toast('KOT is only for restaurant orders');if(!settings.kotBeforeBill&&!inv.billPrintRequestedAt)return toast('Print the bill first, or enable KOT before bill in Settings');if(inv.kotPrintedAt&&!confirm('KOT already sent. Print again?'))return;return withPrint(id,doKOT);}
function printCombo(id,order='bill-first'){
 const inv=invoices.find(x=>x.id===id);if(!inv?.restaurantOrder)return toast('Bill + KOT is available for restaurant orders only');
 if(order==='kot-first'&&!settings.kotBeforeBill)return toast('Enable KOT before bill in Settings');
 return withPrint(id,async i=>{if(order==='kot-first'){await doKOT(i);await doBill(i)}else{await doBill(i);await doKOT(i)}});
}
function setKOTFirst(value){settings.kotBeforeBill=!!value;save();toast(value?'KOT-first printing enabled':'Bill-first printing enabled');}
function setReceiptMode(mode){if(!['fast','ultra','raster'].includes(mode))return;settings.v20ReceiptMode=mode;settings.bleNative=mode!=='raster';save();toast('Thermal receipt mode: '+mode);}
const beforeSettings=settingsPage;
settingsPage=function(){return beforeSettings()+`<div class="grid settings-layout"><section class="card v20-settings-extra"><h3>🧾 Restaurant print workflow</h3><label class="v20-check"><input type="checkbox" id="v20KOTFirst" ${settings.kotBeforeBill?'checked':''} onchange="AkaoraV20.setKOTFirst(this.checked)"> Enable KOT before bill</label><p class="muted tiny">OFF: bill must be transmitted before separate KOT. ON: owner can print the KOT first. Combined Bill + KOT prints both sequentially with one click. BLE acknowledgments cannot verify paper output.</p><div class="line"></div><h3>⚡ Thermal invoice speed</h3><label for="v20ReceiptMode">Printing strategy</label><select id="v20ReceiptMode" onchange="AkaoraV20.setReceiptMode(this.value)"><option value="fast" ${!settings.v20ReceiptMode||settings.v20ReceiptMode==='fast'?'selected':''}>Fast · native text + compact logo</option><option value="ultra" ${settings.v20ReceiptMode==='ultra'?'selected':''}>Ultra-fast · text only, skip logo</option><option value="raster" ${settings.v20ReceiptMode==='raster'?'selected':''}>Compatible · full raster image</option></select><p class="muted tiny">Hindi and unsupported glyphs automatically use image fallback. UPI QR prints as a separate bitmap segment in native text modes. Printing speed depends on your printer.</p></section></div>`;};
// Route every Bluetooth invoice action through the same printing method, including Studio.
sendBillBluetooth=printBill;
printKOT=printKitchen;
window.printBluetoothBill=printBill;
const oldViewInvoice=viewInvoice;
viewInvoice=function(id){oldViewInvoice(id);const inv=invoices.find(x=>x.id===id),foot=document.getElementById('modalFoot');if(!foot||!inv)return;
 // Existing v5 BLE button is an old raster path: reroute to the v20 engine.
 const bill=Array.from(foot.querySelectorAll('button')).find(x=>x.getAttribute('onclick')?.includes('sendBillBluetooth'));
 if(bill){bill.setAttribute('onclick',`AkaoraV20.printBill('${safeV(inv.id)}')`);bill.textContent='⚡ Bluetooth bill';}
 const kitchen=Array.from(foot.querySelectorAll('button')).find(x=>x.getAttribute('onclick')?.includes('printKOT('));
 if(kitchen){kitchen.removeAttribute('disabled');kitchen.setAttribute('onclick',`AkaoraV20.printKOT('${safeV(inv.id)}')`);kitchen.disabled=!settings.kotBeforeBill&&!inv.billPrintRequestedAt;kitchen.title=kitchen.disabled?'Bill must be sent first or enable KOT before bill in Settings':'';}
 if(inv.restaurantOrder){
  const combined=document.createElement('button');combined.type='button';combined.className='amber';combined.textContent='🧾 Bill + KOT';combined.onclick=()=>printCombo(inv.id,'bill-first');foot.insertBefore(combined,foot.firstChild);
  if(settings.kotBeforeBill){const first=document.createElement('button');first.type='button';first.className='secondary';first.textContent='🍳 KOT → Bill';first.onclick=()=>printCombo(inv.id,'kot-first');foot.insertBefore(first,combined.nextSibling);}
  const note=document.querySelector('.kot-state p');if(note)note.textContent='KOT never includes prices. Choose Bill + KOT for one-click sequential printing. A successful BLE write does not confirm a physical print.';
 }
};
const oldPrintStudio=window.bindPrintStudio;
if(oldPrintStudio)window.bindPrintStudio=function(){oldPrintStudio();const b=document.getElementById('tpInvoicePrint');if(b){const replacement=b.cloneNode(true);b.replaceWith(replacement);replacement.addEventListener('click',()=>{const invoice=document.getElementById('tpInvoice')?.value;if(!invoice)toast('Select an invoice first');else printBill(invoice)});
 const combo=document.createElement('button');combo.type='button';combo.id='v20StudioCombo';combo.className='amber';combo.textContent='🧾 Bill + KOT';combo.style.margin='8px 0';combo.addEventListener('click',()=>{const id=document.getElementById('tpInvoice')?.value;if(!id)return toast('Select an invoice first');printCombo(id)});replacement.after(combo);
}refreshPrinter()};
function organizeBarcodes(){
 if(page!=='barcodes')return;
 const panels=document.querySelectorAll('.bcs-layout .bcs-card'),preview=panels[1];
 if(preview&&!preview.querySelector('.v20-a4-detail')){
  const line=preview.querySelector(':scope > .line');
  if(line){const box=document.createElement('details');box.className='v20-detail-toggle v20-a4-detail';
   box.open=!!foldState.barcodeA4;
   box.innerHTML='<summary>A4 sticker sheet settings <small class="muted">48 labels / page</small></summary><div class="v20-detail-body"></div>';
   const content=box.querySelector('.v20-detail-body');
   let pointer=line.nextSibling;
   while(pointer){const next=pointer.nextSibling;if(!(pointer.nodeType===1&&pointer.classList?.contains('bcs-muted-box')))content.append(pointer);pointer=next;}
   line.replaceWith(box);box.addEventListener('toggle',()=>{foldState.barcodeA4=box.open});
  }
 }
 const custom=Array.from(document.querySelectorAll('#content > .card')).find(c=>c.querySelector('h3')?.textContent.trim().toLowerCase()==='custom label designer');
 if(custom&&!custom.classList.contains('v20-custom-collapse')){
  const heading=custom.querySelector('h3');const details=document.createElement('details');details.className='v20-detail-toggle v20-custom-collapse';details.open=!!foldState.barcodeCustom;
  details.innerHTML='<summary>Customize barcode label <small class="muted">Paper size · scale · shop name</small></summary><div class="v20-detail-body"></div>';
  const content=details.querySelector('.v20-detail-body');[...custom.childNodes].forEach(child=>{if(child!==heading)content.append(child)});
  custom.replaceChildren(details);details.addEventListener('toggle',()=>{foldState.barcodeCustom=details.open});
 }
}
function organizeBilling(){
 if(page!=='billing')return;const checkout=document.querySelector('.bill-checkout');if(!checkout)return;
 const blocks=[...checkout.querySelectorAll('.bill-form-block')];
 for(const [index,block] of blocks.entries()){
  if(block.classList.contains('v20-block'))continue;
  const h=block.querySelector(':scope > h4');if(!h)continue;
  const name=h.textContent.trim(),key=/customer/i.test(name)?'customer':/restaurant|order/i.test(name)?'restaurant':/payment|total/i.test(name)?'payment':String(index);
  const body=document.createElement('div');body.className='v20-block-body';
  [...block.children].forEach(c=>{if(c!==h)body.appendChild(c)});
  const toggle=document.createElement('button');toggle.className='v20-block-toggle';toggle.type='button';toggle.setAttribute('aria-expanded',String(foldState[key]!==false));toggle.innerHTML=`<span>${safeV(name)}</span><span class="v20-block-chevron" aria-hidden="true">⌄</span>`;
  h.replaceWith(toggle);block.appendChild(body);block.classList.add('v20-block');
  if(foldState[key]===false)block.classList.add('is-closed');
  toggle.addEventListener('click',()=>{const closed=block.classList.toggle('is-closed');foldState[key]=!closed;toggle.setAttribute('aria-expanded',String(!closed))});
 }
}
const priorPageRender=pageRender;
pageRender=function(){priorPageRender();organizeBilling();organizeBarcodes();navbarPrinter()};
const priorAppShell=appShell;
appShell=function(){priorAppShell();navbarPrinter()};
// Legacy print Studio can be opened from the sidebar; shorten the obsolete version label.
const oldStudioPage=window.printStudioPage;
if(oldStudioPage)window.printStudioPage=function(){return oldStudioPage().replace('Bluetooth Print Studio · Faster v7','Bluetooth Print Studio').replace('Fast native text for invoices and KOT','Fast text invoices and KOT')};
window.AkaoraV20={printBill,printKOT:printKitchen,printCombo,setKOTFirst,setReceiptMode,toggleConnection,refreshPrinter,organizeBilling,doBill,doKOT};
if(profile&&document.querySelector('header.topbar')){navbarPrinter();if(page==='billing')organizeBilling();if(page==='barcodes')organizeBarcodes();}
})();

<script id="akaora-dashboard-interaction-v1">
(function(){
 'use strict';
 const keys={
   "today's profit":'today-profit',"today's loss":'today-profit',
   "total profit":'total-profit',"total loss":'total-profit',
   'today gross profit':'gross-profit','today gross loss':'gross-profit',
   'today expenses':'today-expenses',"today's sales":'today-sales',
   'stock valuation':'stock-value',products:'products','low stock':'low-stock'
 };
 let activeDrill='';
 const localDay=()=>new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
 const greeting=()=>{
    const h=new Date().getHours();
    return h>=5&&h<12?'Good Morning':h>=12&&h<17?'Good Afternoon':h>=17&&h<21?'Good Evening':'Good Night';
 };
 function greetingTitle(){
   const name=(typeof profile==='object'&&profile?.owner)?String(profile.owner).trim():'';
   return greeting()+(name?', '+(typeof esc==='function'?esc(name):name):'')+'!';
 }
 const earlierHome=homePage;
 homePage=function(...args){
   let html=earlierHome.apply(this,args);
   // Replace only the home-page greeting, preserving the owner's name and all cards.
   html=html.replace(/(<div class="heading"><div><h1>)[\s\S]*?(<\/h1>)/,(_,a,b)=>a+'<span id="akaora-dashboard-greeting">'+greetingTitle()+'</span>'+b);
   return html;
 };
 function refreshGreeting(){
   if(typeof page!=='undefined'&&page!=='home')return;
   let title=document.getElementById('akaora-dashboard-greeting');
   if(!title){
     // The app's initial render may precede this extension script.
     const heading=document.querySelector('#content .heading h1');
     if(heading){heading.innerHTML='<span id="akaora-dashboard-greeting">'+greetingTitle()+'</span>';title=heading.firstElementChild;}
   }
   if(title){const greetingText=greetingTitle();if(title.innerHTML!==greetingText)title.innerHTML=greetingText;}
 }
 // Keep the day-part greeting accurate even when the dashboard remains open.
 window.setInterval(refreshGreeting,60000);
 function moneyVal(v){return typeof money==='function'?money(v):'₹'+Number(v||0).toFixed(2)}
 function box(label,value,color=''){
   return '<div class="akaora-detail-item"><small>'+label+'</small><strong class="'+color+'">'+value+'</strong></div>';
 }
 function detail(title,subtitle,blocks,actions=''){
   return '<section id="akaora-dashboard-detail" class="card akaora-detail" aria-label="'+title+'"><h2>'+title+'</h2><p>'+subtitle+'</p><div class="akaora-detail-grid">'+blocks.join('')+'</div>'+actions+'</section>';
 }
 function timeTotals(){
   const today=typeof dayKey==='function'?dayKey(Date.now()):new Date().toISOString().slice(0,10);
   const one=typeof dailyProfit==='function'?dailyProfit(today):{sales:0,cogs:0,expenses:0,gross:0,net:0};
   const all=typeof profitTotals==='function'?profitTotals(invoices,expenses):one;
   return {today,one,all};
 }
 function insertDrill(){
   if(!activeDrill||!['reports','bills','expenses'].includes(page))return;
   const content=document.getElementById('content');if(!content)return;
   content.querySelector('#akaora-dashboard-detail')?.remove();
   const {today,one,all}=timeTotals();
   const isoDate=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
   let html='';
   switch(activeDrill){
     case 'today-profit':
       html=detail('Today’s net profit · '+isoDate,'Revenue after product costs and recorded expenses.',[
         box('Sales excluding tax',moneyVal(one.sales),'sales'),box('Product costs',moneyVal(one.cogs)),
         box('Expenses',moneyVal(one.expenses),'negative'),box(one.net<0?'Net loss':'Net profit',moneyVal(one.net),one.net<0?'negative':'positive')]);break;
     case 'total-profit':
       html=detail('All-time profit','Estimated across all saved invoices and expenses.',[
         box('Sales excluding tax',moneyVal(all.sales),'sales'),box('Product costs',moneyVal(all.cogs)),box('Expenses',moneyVal(all.expenses),'negative'),
         box(all.net<0?'Total loss':'Total profit',moneyVal(all.net),all.net<0?'negative':'positive')]);break;
     case 'gross-profit':
       html=detail('Today’s gross profit · '+isoDate,'Revenue excluding tax minus cost of sold products; expenses are not yet deducted.',[
         box('Sales excluding tax',moneyVal(one.sales),'sales'),box('Cost of goods',moneyVal(one.cogs)),box(one.gross<0?'Gross loss':'Gross profit',moneyVal(one.gross),one.gross<0?'negative':'positive')]);break;
     case 'today-sales':{
       const todayInvoices=invoices.filter(i=>typeof dayKey==='function'&&dayKey(i.date)===today);
       html=detail('Today’s invoices · '+isoDate,'Bills recorded today, with the full invoice register below.',[
         box('Invoices today',String(todayInvoices.length)),box('Today’s invoiced total',moneyVal(todayInvoices.reduce((a,i)=>a+Number(i.total||0),0)),'sales')]);break;
     }
     case 'today-expenses':{
       const todayExpenses=expenses.filter(e=>typeof dayKey==='function'&&dayKey(e.date)===today);
       html=detail('Today’s expenses · '+isoDate,'Expense entries recorded today; full expense register appears below.',[
         box('Entries today',String(todayExpenses.length)),box('Amount recorded',moneyVal(todayExpenses.reduce((a,e)=>a+Number(e.amount||0),0)),'negative')]);break;
     }
     case 'stock-value':{
       const stockVal=products.reduce((a,p)=>a+Number(p.qty||0)*Number(p.cost||0),0);
       html=detail('Stock valuation','Estimated value of available products at their recorded purchase cost.',[
         box('Stock value',moneyVal(stockVal)),box('Products',String(products.length)),box('Low stock',String(products.filter(p=>Number(p.qty)<=Number(p.threshold)).length),'negative')]);break;
     }
   }
   if(!html)return;
   const heading=content.querySelector('.heading');
   if(heading)heading.insertAdjacentHTML('afterend',html);
   else content.insertAdjacentHTML('afterbegin',html);
 }
 const originalPageRender=pageRender;
 pageRender=function(...args){const result=originalPageRender.apply(this,args);if(typeof page==='string'&&page==='home'){decorateKpis();refreshGreeting();}insertDrill();return result;};
 function decorateKpis(){
   // Dashboard KPI cards only; metrics on other pages retain their normal behavior.
   const cards=document.querySelectorAll('#content .metrics .metric');
   for(const card of cards){
     const text=card.querySelector('.metric-label')?.textContent.trim().toLowerCase();
     const key=keys[text];if(!key)continue;
     card.classList.add('akaora-kpi-link');card.setAttribute('role','button');card.setAttribute('tabindex','0');
     card.setAttribute('aria-label',card.querySelector('.metric-label').textContent.trim()+': '+(card.querySelector('.metric-value')?.textContent||'')+'. Open details');
     card.dataset.kpi=key;
   }
 }
 function visitKpi(key){
   const route={'today-profit':'reports','total-profit':'reports','gross-profit':'reports','today-sales':'bills','today-expenses':'expenses','stock-value':'reports','products':'products','low-stock':'products'}[key];
   if(!route)return;
   activeDrill=['today-profit','total-profit','gross-profit','today-sales','today-expenses','stock-value'].includes(key)?key:'';
   if(typeof search!=='undefined' && (key==='products'||key==='low-stock'))search='';
   go(route);  // Retain existing admin protection and navigation wrappers.
   if(route==='products'){
     // The product filter is maintained by its own module closure, so use its public UI event.
     const filter=document.getElementById('stockFilter');
     if(filter){filter.value=key==='low-stock'?'low':'all';filter.dispatchEvent(new Event('change',{bubbles:true}));}
   }
   if(activeDrill){
     // The existing app preserves scroll across navigation; focus only when opening an explicit KPI detail.
     requestAnimationFrame(()=>document.getElementById('akaora-dashboard-detail')?.scrollIntoView({block:'start',behavior:'instant'}));
   }
 }
 // Event delegation survives the app's full page re-renders.
 document.addEventListener('click',event=>{
   const card=event.target.closest?.('#content .akaora-kpi-link');
   if(card&&typeof page==='string'&&page==='home')visitKpi(card.dataset.kpi);
 });
 document.addEventListener('keydown',event=>{
   if(event.key!=='Enter'&&event.key!==' ')return;
   const card=event.target.closest?.('#content .akaora-kpi-link');
   if(card&&typeof page==='string'&&page==='home'){event.preventDefault();visitKpi(card.dataset.kpi);}
 });
 if(typeof page!=='undefined'&&page==='home'){decorateKpis();refreshGreeting();}
 window.AkaoraDashboard={visitKpi,refreshGreeting,greeting};
})();
</script>
<script id="akaora-v24-profit-calendar">
/* Monthly P&L: two views over the SAME stored invoices/expenses; day details are read-only. */
(function(){
'use strict';
const KEY='akaora_basics_profit_view_v1';
let view='calendar';
try{const v=localStorage.getItem(KEY);if(v==='table'||v==='calendar')view=v}catch(e){}
const H=s=>esc(String(s??''));
const moneyClass=n=>n<-.0001?'ap24-neg':n>.0001?'ap24-pos':'ap24-muted';
const amounts=n=>Number(n||0);
const stats=(label,value,cl='')=>`<div class="ap24-stat"><span class="lab">${H(label)}</span><strong class="${cl}">${money(value)}</strong></div>`;
function compute(){
 const [year,month]=String(profitMonth).split('-').map(Number);
 if(!year||month<1||month>12||year>9999)return null;
 const days=new Date(year,month,0).getDate();
 const rows=Array.from({length:days},(_,j)=>{
  const day=String(profitMonth)+'-'+String(j+1).padStart(2,'0');
  return {day,dayNum:j+1,...dailyProfit(day)};
 });
 const summary=profitTotals(invoices.filter(i=>monthKey(i.date)===profitMonth),expenses.filter(e=>monthKey(e.date)===profitMonth));
 return {year,month,days,rows,summary};
}
function calHTML(x){
 const firstDow=new Date(x.year,x.month-1,1).getDay();
 const blanks=Array.from({length:firstDow},()=>'<div class="ap24-pad" aria-hidden="true"></div>').join('');
 const week=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(w=>`<div class="ap24-weekday">${w}</div>`).join('');
 const today=dayKey(Date.now());
 const cells=x.rows.map(d=>{
  const hasActivity=d.count>0||Math.abs(d.expenses)>.001;
  const type=moneyClass(d.net);
  const sub=d.count?`${d.count} bill${d.count>1?'s':''}`:d.expenses?'Expense':'No activity';
  return `<button type="button" class="ap24-day ${d.day===today?'is-today':''} ${!hasActivity?'no-records':''}" onclick="AkaoraProfitUI.showDay('${d.day}')" aria-label="${H(d.day)}: ${d.count} invoices, ${H(money(d.net))} net profit. Open day overview">
  <span class="ap24-date">${d.dayNum}</span><span class="ap24-figure ${type}">${hasActivity?H(money(d.net)):'—'}</span><span class="ap24-day-sub">${sub}</span></button>`;
 }).join('');
 const tail=(7-(firstDow+x.days)%7)%7;
 return `<div class="ap24-calendar" role="group" aria-label="Monthly profit calendar">${week}${blanks}${cells}${Array.from({length:tail},()=>'<div class="ap24-pad" aria-hidden="true"></div>').join('')}</div>
 <div class="ap24-calendar-footer"><span><i class="ap24-dot ap24-pos"></i>Profit</span><span><i class="ap24-dot ap24-neg"></i>Loss</span><span>— No recorded activity</span><span>Tap a date for the full breakdown</span></div>`;
}
function tableHTML(x){
 return `<div class="tablewrap" role="region" aria-label="Daily profit records" tabindex="0"><table class="ap24-tablestyle profit-table">
 <thead><tr><th>Date</th><th>Invoices</th><th>Sales excl. tax</th><th>Item cost</th><th>Expenses</th><th>Net profit</th></tr></thead>
 <tbody>${x.rows.map(d=>`<tr class="${d.day===dayKey(Date.now())?'today-row':''}"><td><button type="button" class="ap24-table-day" onclick="AkaoraProfitUI.showDay('${d.day}')" aria-label="View overview for ${d.day}">${String(d.dayNum).padStart(2,'0')} ${new Date(x.year,x.month-1,d.dayNum).toLocaleDateString('en-IN',{weekday:'short'})} ↗</button></td><td>${d.count}</td><td>${money(d.sales)}</td><td>${money(d.cogs)}</td><td>${money(d.expenses)}</td><td class="${moneyClass(d.net)}"><b>${money(d.net)}</b></td></tr>`).join('')}</tbody>
 <tfoot><tr><th>MONTH TOTAL</th><th>${x.summary.count}</th><th>${money(x.summary.sales)}</th><th>${money(x.summary.cogs)}</th><th>${money(x.summary.expenses)}</th><th class="${moneyClass(x.summary.net)}">${money(x.summary.net)}</th></tr></tfoot></table></div>`;
}
function ledger(){
 const x=compute();if(!x)return '<p>Invalid month</p>';
 const heading=new Date(x.year,x.month-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
 return `<section class="ap24-ledger" id="akaora-profit-report"><div class="ap24-toolbar"><div><h3>Daily profit & loss</h3><p class="muted tiny">${heading} · Click any day for its sales, item costs, expenses and invoice details.</p></div>
 <div class="ap24-tools"><div class="ap24-segments" role="group" aria-label="Profit report view">
 <button type="button" aria-pressed="${view==='calendar'}" onclick="AkaoraProfitUI.setView('calendar')">▦ Calendar</button>
 <button type="button" aria-pressed="${view==='table'}" onclick="AkaoraProfitUI.setView('table')">☷ Standard</button></div>
 <button class="ap24-small-nav" type="button" onclick="AkaoraProfitUI.shiftMonth(-1)" aria-label="Previous month">‹</button>
 <input class="ap24-month-pick" aria-label="Select month" type="month" value="${H(profitMonth)}" onchange="AkaoraProfitUI.setMonth(this.value)">
 <button class="ap24-small-nav" type="button" onclick="AkaoraProfitUI.shiftMonth(1)" aria-label="Next month">›</button></div></div>
 <div class="ap24-statline">${stats('Sales excluding tax',x.summary.sales,'ap24-sales')}${stats('Item cost',x.summary.cogs)}${stats('Expenses',x.summary.expenses,'ap24-neg')}${stats(x.summary.net<0?'Net loss':'Net profit',x.summary.net,moneyClass(x.summary.net))}</div>
 ${view==='calendar'?calHTML(x):tableHTML(x)}
 <p class="muted tiny" style="margin-top:12px">Estimates are based on recorded invoices and expenses, excluding tax; unrecorded costs or refunds can change actual profit.</p></section>`;
}
function repaint(){
 const old=document.getElementById('akaora-profit-report');
 if(old){old.outerHTML=ledger();}else if(typeof pageRender==='function'&&page==='reports')pageRender();
}
function dayOverview(day){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||!Number.isFinite(new Date(day+'T12:00:00').getTime()))return;
 const chosen=invoices.filter(i=>dayKey(i.date)===day).sort((a,b)=>Number(b.date)-Number(a.date));
 const dayExpenses=expenses.filter(e=>dayKey(e.date)===day).sort((a,b)=>Number(b.date)-Number(a.date));
 const d=profitTotals(chosen,dayExpenses);
 const label=new Date(day+'T12:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const paid=chosen.reduce((n,i)=>n+amounts(i.paid),0);
 const invoiceRows=chosen.map(i=>{
  const cost=(i.items||[]).reduce((n,item)=>n+Math.max(0,amounts(item.cost))*amounts(item.qty),0);
  const sale=Math.max(0,amounts(i.subtotal)-amounts(i.discount));
  return `<tr><td><button class="ap24-table-day" type="button" onclick="viewInvoice('${H(i.id)}')">${H(i.no||i.id)} ↗</button></td><td>${H(i.customer||i.customerName||'Walk-in')}</td><td>${money(sale)}</td><td>${money(cost)}</td></tr>`;
 }).join('');
 const expenseRows=dayExpenses.map(e=>`<tr><td>${H(e.category||'Other')}</td><td>${H(e.desc||'—')}</td><td>${money(e.amount)}</td></tr>`).join('');
 const body=`<div class="muted tiny">Read-only overview · ${H(label)}</div>
 <div class="ap24-detail-summary"><div><small>Sales excl. tax</small><strong class="ap24-sales">${money(d.sales)}</strong></div>
 <div><small>Cost of goods</small><strong>${money(d.cogs)}</strong></div><div><small>Gross profit</small><strong class="${moneyClass(d.gross)}">${money(d.gross)}</strong></div>
 <div><small>Expenses</small><strong class="ap24-neg">${money(d.expenses)}</strong></div><div><small>${d.net<0?'Net loss':'Net profit'}</small><strong class="${moneyClass(d.net)}">${money(d.net)}</strong></div>
 <div><small>Invoices · recorded payments</small><strong>${d.count} · ${money(paid)}</strong></div></div>
 <div class="ap24-detail-section"><h4>Invoices (${chosen.length})</h4>${chosen.length?`<div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Sales excl. tax</th><th>Item cost</th></tr></thead><tbody>${invoiceRows}</tbody></table></div>`:'<div class="ap24-empty">No invoices recorded for this date.</div>'}</div>
 <div class="ap24-detail-section"><h4>Expenses (${dayExpenses.length})</h4>${dayExpenses.length?`<div class="tablewrap"><table><thead><tr><th>Category</th><th>Description</th><th>Amount</th></tr></thead><tbody>${expenseRows}</tbody></table></div>`:'<div class="ap24-empty">No expenses recorded for this date.</div>'}</div>
 <p class="muted tiny" style="margin-top:15px">Profit = sales excluding tax − recorded item costs − recorded expenses. Recorded payments are shown separately, not added to sales.</p>`;
 openModal('Day overview',body,'Close',closeModal);
}
window.AkaoraProfitUI={setView(next){if(next!=='calendar'&&next!=='table')return;view=next;try{localStorage.setItem(KEY,view)}catch(e){}repaint()},setMonth(value){if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(value))return;profitMonth=value;repaint()},shiftMonth(offset){const [y,m]=String(profitMonth).split('-').map(Number);const d=new Date(y,m-1+Number(offset),1);profitMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');repaint()},showDay:dayOverview};
profitMonthHTML=ledger;
// Put the monthly calendar near the top of Reports instead of burying it after tables.
const reportPageRender=pageRender;
pageRender=function(){
 reportPageRender();
 if(page==='reports'){
  const panel=document.getElementById('akaora-profit-report');
  const summary=document.querySelector('#content > .grid.metrics');
  if(panel&&summary)summary.insertAdjacentElement('afterend',panel);
 }
};
if(typeof page!=='undefined'&&page==='reports')pageRender();
})();
</script>

<script id="akaora-v101-product-checkout">
/* Uses the EXISTING addCart/offer/variation engine. A bag is the unsaved billing cart. */
window.AkaoraProductCheckout = function(productId, action){
  const p=products.find(v=>String(v.id)===String(productId));
  if(!p)return toast('Product is unavailable');
  if(action!=='bill'&&action!=='bag')return;
  window.akaoraPendingBillProduct=null;
  const hasVariant=['weight','size','bangle'].includes(p.variationMode);
  const before=Object.values(cart).reduce((s,n)=>s+Number(n||0),0);
  closeModal();
  if(hasVariant){
    if(action==='bill')window.akaoraPendingBillProduct=p.id;
    addCart(p.id); // opens the original weight/size/bangle picker
    return;
  }
  addCart(p.id); // handles automatic free gifts, discounts and stock validation
  const after=Object.values(cart).reduce((s,n)=>s+Number(n||0),0);
  if(after<=before)return; // e.g. insufficient stock
  if(action==='bill')go('billing');
  else toast(p.name+' added to Bag. Open Fast billing to review.');
};
</script>

<script id="akaora-android-file-export">
// Save user-generated .akaora Blob downloads with Android's system document picker.
(function(){
if(!window.AndroidBridge)return;
document.addEventListener('click',function(e){
  const a=e.target.closest?.('a[download]');
  if(!a || !a.href || !a.href.startsWith('blob:'))return;
  e.preventDefault();
  fetch(a.href).then(response=>response.blob()).then(blob=>{
    const reader=new FileReader();
    reader.onload=()=>window.AndroidBridge.saveFile(a.getAttribute('download')||'inventory-backup.akaora',String(reader.result).split(',')[1]);
    reader.readAsDataURL(blob);
  }).catch(err=>alert('Export failed: '+err.message));
},true);
})();
</script>

<style id="akaora-basics-style">
/* Basics: a lighter operational workspace, without premium cross-selling. */
.v15-coupon-checkout,.v18-coupon-panel,.v18-live-offers,.akaora-gifts,.akaora-discount-offers,.akaora-discount-total,

<script id="akaora-basics-edition">
(function(){
 'use strict';
 const restricted=new Set(['staff','offers','coupons','customers']);
 for(let i=navs.length-1;i>=0;i--){if(restricted.has(navs[i][0]))navs.splice(i,1)}
 let contactsTab='Customer',contactTerm='';
 const norm=(x)=>String(x||'').replace(/\D/g,'').slice(-10);
 const contact=(id)=>parties.find(p=>p.id===id&&(p.type==='Customer'||p.type==='Supplier'));
 const cnt=(type)=>parties.filter(p=>p.type===type).length;
 const totals=(p)=>{const arr=invoices.filter(i=>i.customerId===p.id||(p.phone&&norm(i.customerPhone)===norm(p.phone)&&norm(p.phone).length===10));return {orders:arr.length,spent:arr.reduce((n,i)=>n+Number(i.total||0),0)};};
 function listContacts(){
  const list=parties.filter(p=>p.type===contactsTab).filter(p=>[p.name,p.phone,p.email].some(v=>String(v||'').toLowerCase().includes(contactTerm.toLowerCase())));
  return `<div class="ab-contacts">${head('Parties','Simple customer and supplier contacts.',`<button class="amber" type="button" onclick="AkaoraBasics.edit()">+ Add ${contactsTab.toLowerCase()}</button>`)}
    <div class="ab-sections" role="tablist" aria-label="Parties sections"><button type="button" role="tab" aria-selected="${contactsTab==='Customer'}" onclick="AkaoraBasics.tab('Customer')">Customers · ${cnt('Customer')}</button><button type="button" role="tab" aria-selected="${contactsTab==='Supplier'}" onclick="AkaoraBasics.tab('Supplier')">Suppliers · ${cnt('Supplier')}</button></div>
    <div class="ab-toolbar"><input id="abContactSearch" type="search" aria-label="Search contacts" placeholder="Search name, mobile or email" value="${esc(contactTerm)}" oninput="AkaoraBasics.search(this.value)"><span class="ab-edition-note">Essential contacts only</span></div>
    <div class="tablewrap"><table class="ab-table"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>${contactsTab==='Customer'?'Purchases':'Type'}</th><th>Actions</th></tr></thead><tbody>
      ${list.map(p=>{const t=totals(p);return `<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.phone||'—')}</td><td>${esc(p.email||'—')}</td><td>${contactsTab==='Customer'?`${t.orders} orders`:'Supplier'}</td><td><div class="ab-actions"><button class="secondary" type="button" onclick="AkaoraBasics.view('${esc(p.id)}')">View</button><button class="secondary" type="button" onclick="AkaoraBasics.edit('${esc(p.id)}')">Edit</button></div></td></tr>`}).join('')||`<tr><td colspan="5">No ${contactsTab.toLowerCase()} contacts yet.</td></tr>`}
    </tbody></table></div><p class="muted tiny" style="margin-top:12px">Basics includes name, phone and email. Loyalty coupons and detailed CRM are available only in the Pro edition.</p></div>`;
 }
 function edit(id){
   const p=contact(id);const type=p?.type||contactsTab;
   openModal((p?'Edit ':'Add ')+type.toLowerCase(),`<div class="fieldgrid">${field('Name','abName',p?.name||'','text',true)}${field('Phone (optional)','abPhone',p?.phone||'','tel')}${field('Email (optional)','abEmail',p?.email||'','email')}</div><p class="muted tiny">Only essential contact details are stored in Akaora Inventory Basics.</p>`,'Save contact',()=>{
    const name=document.getElementById('abName')?.value.trim()||'', phone=document.getElementById('abPhone')?.value.trim()||'',email=document.getElementById('abEmail')?.value.trim()||'';
    if(!name)return toast('Enter a contact name');if(phone&&norm(phone).length!==10)return toast('Enter a valid 10-digit number');
    if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Enter a valid email');
    if(type==='Customer'&&phone&&parties.some(x=>x.type==='Customer'&&x.id!==id&&norm(x.phone)===norm(phone)))return toast('Customer mobile already exists');
    const rec={...(p||{}),id:p?.id||uid(),type,name,phone,email};
    if(type==='Customer'&&!rec.customerCode)rec.customerCode='CUS-'+rec.id.replace(/[^a-z\d]/gi,'').slice(-8).toUpperCase();
    if(p)parties[parties.findIndex(x=>x.id===id)]=rec;else parties.push(rec);
    save();closeModal();pageRender();toast('Contact saved');
   });
 }
 function view(id){const p=contact(id);if(!p)return;const t=totals(p);
    const body=`<div style="display:grid;gap:9px"><p><b>Name:</b> ${esc(p.name)}</p><p><b>Phone:</b> ${esc(p.phone||'—')}</p><p><b>Email:</b> ${esc(p.email||'—')}</p>${p.type==='Customer'?`<p><b>Purchases:</b> ${t.orders}</p><p><b>Total billed:</b> ${money(t.spent)}</p>`:''}</div>`;
    openModal('Contact details',body,'Close',closeModal);
 }
 function editSearch(value){contactTerm=value;const root=document.getElementById('content');if(!root)return;const focus=document.activeElement;const selection=focus?.selectionStart;root.innerHTML=listContacts();const el=document.getElementById('abContactSearch');el?.focus();if(el&&selection!==null&&selection!==undefined)el.setSelectionRange(selection,selection)}
 window.AkaoraBasics={tab(type){if(!['Customer','Supplier'].includes(type))return;contactsTab=type;contactTerm='';pageRender()},search:editSearch,edit,view};
 // Hide all premium pages, even when an old sidebar, notification or legacy onclick references them.
 const originalGo=go;
 go=function(target){if(restricted.has(target)){toast('This feature is not included in Akaora Inventory Basics');return}return originalGo(target)};
 const originalBilling=billingPage;
 billingPage=function(){if(billDraft)billDraft.couponCode='';return originalBilling()};
 const originalParties=partiesPage;
 partiesPage=listContacts;
 const originalPageRender=pageRender;
 pageRender=function(){if(restricted.has(page))page='home';const r=originalPageRender();
  if(page==='billing')document.querySelectorAll('.v15-coupon-checkout,.v18-coupon-panel,.v18-live-offers,.akaora-gifts,.akaora-discount-offers').forEach(e=>e.remove());
  if(page==='settings')document.querySelectorAll('.v15-settings-group').forEach(e=>{if(/staff|attendance|payroll|coupon|offers/i.test(e.querySelector('summary')?.textContent||''))e.remove()});
  const nav=document.querySelector('#v15MobileMoreMenu');nav?.querySelectorAll('[data-v15-mobile]').forEach(e=>{if(restricted.has(e.dataset.v15Mobile))e.remove()});
  return r};
 const originalAppShell=appShell;
 appShell=function(){const r=originalAppShell();
    document.querySelectorAll('.nav[data-p]').forEach(x=>{if(restricted.has(x.dataset.p))x.remove()});
    const panel=document.getElementById('v15MobileMoreMenu');panel?.querySelectorAll('[data-v15-mobile]').forEach(e=>{if(restricted.has(e.dataset.v15Mobile))e.remove()});return r;
 };
 // Backups exported by Basics omit unsupported records; this also avoids leaking staff records to Basics recipients.
 const oldDownload=downloadFile;
 downloadFile=function(name,data,type){if(/\.akaora$/i.test(name)){
   try{let obj=JSON.parse(data);if(obj?.format==='AKAORA'){
      for(const key of ['staff','attendance','advances','attendanceLogs','salaryPayments','staffDocuments','offers','coupons'])delete obj[key];
      if(Array.isArray(obj.notifications))obj.notifications=obj.notifications.filter(n=>n?.destination!=='staff'&&!/(attendance|staff|payroll|salary)/i.test(n?.message||''));
      obj.edition='Basics';data=JSON.stringify(obj);
   }}catch(err){console.warn('Could not filter backup',err)}
  }return oldDownload(name,data,type)};
 // Import compatible backups but strip unsupported premium features BEFORE legacy importer receives them.
 const previousImport=importData;
 importData=function(file){if(!file)return;const read=new FileReader();read.onload=()=>{
  try{const d=JSON.parse(read.result);if(!['AKAORA','APORA'].includes(d.format))throw Error('Invalid backup');
   for(const key of ['staff','attendance','advances','attendanceLogs','salaryPayments','staffDocuments','offers','coupons'])delete d[key];
   if(Array.isArray(d.notifications))d.notifications=d.notifications.filter(n=>n?.destination!=='staff');
   previousImport(new File([JSON.stringify(d)],file.name,{type:'application/json'}));
  }catch(e){toast('Invalid backup file')}};read.readAsText(file)};
 // Edition identity. The original Firebase login / verification gate is preserved.
 if(typeof page!=='undefined'&&restricted.has(page))page='home';
 if(profile&&window.AkaoraEmailGate?.canAccess()){appShell();pageRender()}
})();
</script>
<script type="module" id="akaora-email-only-firebase">
let initializeApp,getAuth,browserLocalPersistence,setPersistence,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendEmailVerification,sendPasswordResetEmail,signOut;

const firebaseConfig={
 apiKey:'AIzaSyCl23NTYFPdZc_D53LsOVdxcIPfgXkHNbA',
 authDomain:'akaora-inventory.firebaseapp.com',
 databaseURL:'https://akaora-inventory-default-rtdb.firebaseio.com',
 projectId:'akaora-inventory',
 storageBucket:'akaora-inventory.firebasestorage.app',
 messagingSenderId:'358771288523',
 appId:'1:358771288523:web:292d5718192dfdd75aee4e',
 measurementId:'G-R6C4JC5SQT'
};
const $ag=(id)=>document.getElementById(id);
const ownerStorageKey='akaora_basics_owner_uid_v1';
let auth=null,person=null,authorized=false,mode='signin',busy=false,lastError='';
function canAccess(){return authorized && !!person && person.emailVerified && (!localStorage.getItem(ownerStorageKey)||localStorage.getItem(ownerStorageKey)===person.uid)}
window.AkaoraEmailGate={canAccess,block:()=>showGate('signin')};
function message(text,isError=false){const el=$ag('agMessage');el.textContent=text||'';el.classList.toggle('ag-error',!!isError);lastError=isError?text:''}
function showGate(next=mode){authorized=false;mode=next;document.body.classList.add('akaora-email-locked');$ag('akaoraEmailGate').hidden=false;draw();}
function unlock(){
 if(!person||!person.emailVerified)return;
 const bound=localStorage.getItem(ownerStorageKey);
 if(bound && bound!==person.uid){showGate('wrong-account');return}
 if(!bound)localStorage.setItem(ownerStorageKey,person.uid);
 authorized=true;$ag('akaoraEmailGate').hidden=true;document.body.classList.remove('akaora-email-locked');
 if(typeof render==='function')render();
 else{message('Application failed to initialize.',true);showGate('failed')}
 queueMicrotask(refreshUI);
}
function refreshUI(){
 const email=person?.email||'';
 const el=document.getElementById('akaoraAccountLabel');if(el)el.textContent=email||'Account';
 const side=document.getElementById('akaoraAuthStatusSide');if(side)side.textContent=email?'Signed in: '+email:'Sign in required';
 const avatar=document.getElementById('akaoraAccountAvatar');if(avatar)avatar.textContent=(email[0]||'A').toUpperCase();
 if(authorized){let shopEmail=document.getElementById('semail');if(shopEmail&&!shopEmail.value)shopEmail.value=email}
}
function draw(){
 const title=$ag('agTitle'),desc=$ag('agDescription'),form=$ag('agForm'),links=$ag('agLinks'),pw=$ag('agPasswordBlock'),button=$ag('agSubmit');
 links.replaceChildren();let make=(label,fn)=>{const el=document.createElement('button');el.type='button';el.textContent=label;el.onclick=fn;links.appendChild(el)};
 const heading={signin:'Email sign in',register:'Create your account',reset:'Reset password',verify:'Verify your email',account:'My account','wrong-account':'Account does not match',loading:'Connecting securely...',failed:'Unable to connect'};
 title.textContent=heading[mode]||heading.signin;
 desc.textContent= mode==='signin'?'Sign in before creating a shop or using any inventory feature.':
 mode==='register'?'Register with an email address and password. Verification is required.':
 mode==='reset'?'We will send a password reset link to your email address.':
 mode==='verify'?'Check your inbox and verify your email address before opening Shop Setup.':
 mode==='wrong-account'?'This installation contains local data already linked to a different Firebase account. Sign in using that original account.':
 mode==='account'?'Signed in as '+(person?.email||''):
 mode==='loading'?'Checking your Firebase session. Please stay online.':'Firebase failed to load. Check internet and retry.';
 const inputs=mode==='signin'||mode==='register'||mode==='reset';
 form.hidden=!inputs;pw.hidden=(mode==='reset');pw.querySelector('input').required=!pw.hidden;
 button.textContent=mode==='signin'?'Sign in':mode==='register'?'Create account':'Send reset email';
 button.disabled=busy;button.setAttribute('aria-busy',String(busy));
 if(mode==='signin'){make('Forgot password?',()=>showGate('reset'));make('Create account',()=>showGate('register'));}
 else if(mode==='register'||mode==='reset')make('Back to sign in',()=>showGate('signin'));
 else if(mode==='verify'){
   make('I have verified my email',async()=>{try{busy=true;draw();await person.reload();person=auth.currentUser;if(person?.emailVerified){unlock()}else message('Email is not verified yet. Check inbox and spam.',true)}catch(e){message(errorFor(e),true)}finally{busy=false;drawIfLocked()}});
   make('Resend verification',async()=>{try{await sendEmailVerification(auth.currentUser);message('Verification email sent. Check your inbox and spam.')}catch(e){message(errorFor(e),true)}});
   make('Sign out',logout);
 }else if(mode==='wrong-account'){make('Sign out and use correct email',logout)}
 else if(mode==='failed'){make('Retry connection',()=>location.reload())}
 else if(mode==='account'){make('Back to app',()=>{$ag('akaoraEmailGate').hidden=true});make('Sign out',logout)}
}
function drawIfLocked(){if(!authorized)draw()}
function errorFor(e){let code=e?.code||'';if(code==='auth/invalid-credential'||code==='auth/wrong-password'||code==='auth/user-not-found')return 'Incorrect email or password.';if(code==='auth/email-already-in-use')return 'An account with this email already exists.';if(code==='auth/weak-password')return 'Choose a stronger password (at least 6 characters).';if(code==='auth/too-many-requests')return 'Too many attempts. Try again later.';if(code==='auth/network-request-failed')return 'Network error. Connect to the internet and try again.';if(code==='auth/operation-not-allowed')return 'Email/Password provider is not enabled in Firebase Console.';return String(e?.message||'Unable to complete authentication.').slice(0,230)}
async function logout(){try{busy=true;await signOut(auth);person=null;authorized=false;document.body.classList.add('akaora-email-locked');const root=$ag('root');if(root)root.replaceChildren();showGate('signin');message('Signed out securely. Sign in again to continue.')}catch(e){message(errorFor(e),true)}finally{busy=false;drawIfLocked()}}
$ag('agForm').addEventListener('submit',async(ev)=>{
 ev.preventDefault();if(!auth||busy)return;
 const email=$ag('agEmail').value.trim();const password=$ag('agPassword').value;
 if(!email)return message('Enter an email address.',true);
 try{
  busy=true;message('');draw();
  if(mode==='reset'){await sendPasswordResetEmail(auth,email);showGate('signin');message('If an account exists, a password reset email has been sent. Check inbox or spam.');}
  else if(mode==='register'){
   const result=await createUserWithEmailAndPassword(auth,email,password);
   person=result.user;await sendEmailVerification(result.user);showGate('verify');message('Account created. Verification link sent to '+email+'.');
  }else{
   await signInWithEmailAndPassword(auth,email,password);
   // onAuthStateChanged will verify the session before displaying Shop Setup.
  }
 }catch(e){message(errorFor(e),true)}finally{busy=false;drawIfLocked()}
});
window.AkaoraAuth={open(){if(!authorized)return showGate('signin');mode='account';$ag('akaoraEmailGate').hidden=false;draw()},close(){if(authorized)$ag('akaoraEmailGate').hidden=true},refreshUI,logout,get user(){return person},get enabled(){return true}};
showGate('loading');
try{
 const [firebaseAppSDK,firebaseAuthSDK]=await Promise.all([
   import('https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js'),
   import('https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js')
 ]);
 ({initializeApp}=firebaseAppSDK);
 ({getAuth,browserLocalPersistence,setPersistence,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendEmailVerification,sendPasswordResetEmail,signOut}=firebaseAuthSDK);
 const app=initializeApp(firebaseConfig,'akaora-email-only');auth=getAuth(app);
 await setPersistence(auth,browserLocalPersistence);
 onAuthStateChanged(auth,async (u)=>{
  authorized=false;person=u;
  if(!u){if($ag('root'))$ag('root').replaceChildren();showGate('signin');return}
  showGate('loading');
  try{await u.reload();person=auth.currentUser;if(!person){showGate('signin');return}}
  catch(e){showGate('failed');message(errorFor(e),true);return}
  if(!person.emailVerified){showGate('verify');message('Verification required for '+person.email);return}
  unlock();
 },(e)=>{showGate('failed');message(errorFor(e),true)});
}catch(e){showGate('failed');message(errorFor(e),true)}
</script>
