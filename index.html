<style id="akaora-v13-dashboard-kpi-colors">
/* V13: Semantic KPI colors, correcting v12's class mismatch. */
:root{--kpi-gain:#078454;--kpi-loss:#bc2a40;--kpi-sales:#2268c9;--kpi-neutral:#5b6b80}
body.dark-mode{--kpi-gain:#52e2a0;--kpi-loss:#ff7c91;--kpi-sales:#8dbaff;--kpi-neutral:#a6adba}
/* The labels remain theme-readable; accent is concentrated on values, left rail and icons. */
.card.metric{position:relative;overflow:hidden;transition:background-color .18s ease,border-color .18s ease}
.card.metric:is(.akaora-metric-profit,.akaora-metric-loss,.akaora-metric-expenses,.akaora-metric-sales,.akaora-metric-low)::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--kpi-accent);border-radius:12px 0 0 12px}
.card.metric.akaora-metric-profit{--kpi-accent:var(--kpi-gain)}
.card.metric:is(.akaora-metric-loss,.akaora-metric-expenses,.akaora-metric-low){--kpi-accent:var(--kpi-loss)}
.card.metric.akaora-metric-sales{--kpi-accent:var(--kpi-sales)}
.card.metric:is(.akaora-metric-profit,.akaora-metric-loss,.akaora-metric-expenses,.akaora-metric-low,.akaora-metric-sales) .metric-value{color:var(--kpi-accent)!important}
.card.metric.akaora-metric-neutral .metric-value{color:var(--kpi-neutral)!important}
.card.metric:is(.akaora-metric-profit,.akaora-metric-loss,.akaora-metric-expenses,.akaora-metric-low,.akaora-metric-sales) .metric-icon{color:var(--kpi-accent)!important;background:color-mix(in srgb,var(--kpi-accent) 13%,transparent)!important}
.card.metric .metric-label,.card.metric .metric-note{color:var(--muted)!important}
/* Current and historical net gain/loss receive the same semantic treatment. */
.profit-table .positive-profit{color:var(--kpi-gain)!important}
.profit-table .negative-profit{color:var(--kpi-loss)!important}
.profit-table .akaora-zero-profit{color:var(--kpi-neutral)!important}

.profit-method b.akaora-negative{color:var(--kpi-loss)!important}
@media(max-width:740px){.card.metric{min-width:0}.card.metric .metric-value{overflow-wrap:anywhere}}

<script id="akaora-native-android-bridge">
/* Native Android BLE bridge. Android WebView cannot be assumed to support Web Bluetooth. */
(function(global){
'use strict';
if(!global.AndroidBridge)return;
const requests=new Map();let seq=0;
function encode(data){
  const bytes=new Uint8Array(data),size=8192;let result='';
  for(let i=0;i<bytes.length;i+=size)result+=String.fromCharCode.apply(null,bytes.subarray(i,i+size));
  return btoa(result);
}
global.AkaoraAndroid={
 enabled:true,
 encode,
 request(op,arg){return new Promise((resolve,reject)=>{
   const id='r'+(++seq);requests.set(id,{resolve,reject});
   try {if(op==='connect')global.AndroidBridge.connect(id);
   else if(op==='write')global.AndroidBridge.write(id,arg);
   else throw new Error('Unknown Bluetooth operation');
   }catch(e){requests.delete(id);reject(e)}
 });}
};
global.__akaoraNativeResponse=function(result){
 try{const packet=typeof result==='string'?JSON.parse(result):result;
 const waiter=requests.get(packet.id);if(!waiter)return;
 requests.delete(packet.id);
 if(packet.ok)waiter.resolve(packet.data||{});
 else waiter.reject(new Error(packet.error||'Android Bluetooth error'));
 }catch(e){console.error('Android bridge response error',e)}
};
global.__akaoraNativeDisconnected=function(){global.dispatchEvent(new Event('akaora-android-ble-disconnected'))};
})(window);
</script>
<script id="akaora-thermal-engine">
/* Akaora BLE thermal printing engine. Browser-native Web Bluetooth; no drivers or server.

  const SERVICES = [
    {service:'49535343-fe7d-4ae5-8fa9-9fafd205e455', characteristic:'49535343-8841-43f4-a8d4-ecbe34729bb3'},
    {service:0xffe0, characteristic:0xffe1},
    {service:0x18f0, characteristic:0x2af1},
    {service:0xff00, characteristic:0xff02}
  ];
  const sleep=ms=>new Promise(ok=>setTimeout(ok,ms));
  const canonical=u=>typeof u==='number'?`0000${u.toString(16).padStart(4,'0')}-0000-1000-8000-00805f9b34fb`:u.toLowerCase();
  let device=null, characteristic=null, config={width:58,chunkSize:100,delay:12,darkness:180,command:'raster'}, running=false,cancel=false, listener=()=>{}, provenChunk=null;

    if(running)throw new Error('Cannot change printer settings while a print job is running.');
    const c={...config,...settings};
    if(![58,80,88].includes(Number(c.width)))throw new Error('Choose 58 or 80mm paper.');
    if(![20,40,60,100,180].includes(Number(c.chunkSize)))throw new Error('Unsupported BLE packet size.');

function bindPrintStudio(){
 if(!el('tpConnect'))return;
 const help=el('tpBrowserHelp');
 if(help){
  const embedded=global.self!==global.top;
  const insecure=!global.isSecureContext;
  const missing=!('bluetooth' in navigator);
  help.hidden=!(embedded||insecure||missing);
  if(embedded)el('tpBrowserHelpText').textContent='This page is running inside an embedded preview. Extract the ZIP, then right-click index.html → Open with → Chrome or Edge. Open it as a top-level tab.';
  else if(insecure)el('tpBrowserHelpText').textContent='Your current browser does not trust this page as secure. Open the extracted index.html directly in Chrome/Edge; if blocked, use VS Code Live Server or localhost.';
  else if(missing)el('tpBrowserHelpText').textContent='This browser does not expose Web Bluetooth. Right-click the extracted index.html and open with Google Chrome or Microsoft Edge.';
 }
 if(el('tpCopyLink'))el('tpCopyLink').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(global.location.href);notify('App URL copied. Paste into Chrome/Edge.');}
  catch(e){notify('Copy failed. Right-click the extracted index.html → Open with → Chrome/Edge.',true);}
 });
 el('tpConnect').addEventListener('click',connect);
 el('tpDisconnect').addEventListener('click',()=>global.AkaoraThermal.disconnect());
 el('tpPaper').addEventListener('change',()=>{try{configureFromUI()}catch(e){notify(e.message,true)}});
 el('tpSpeed').addEventListener('change',()=>{
   const preset=el('tpSpeed').value;
   const speeds={fast:[180,6],balanced:[100,12],safe:[100,40]};
   if(speeds[preset]){el('tpChunk').value=String(speeds[preset][0]);el('tpDelay').value=String(speeds[preset][1]);}
   try{configureFromUI()}catch(e){notify(e.message,true)}
  });
  for(const id of ['tpChunk','tpDelay','tpDark','tpCommand','tpNative'])el(id).addEventListener('change',()=>{
   if(id==='tpChunk'||id==='tpDelay')el('tpSpeed').value='custom';
   try{configureFromUI()}catch(e){notify(e.message,true)}
  });
 document.querySelectorAll('[data-tp-mode]').forEach(x=>x.addEventListener('click',()=>selectedMode(x.dataset.tpMode)));
 el('tpText').addEventListener('input',()=>{P.text=el('tpText').value;updatePreview()});
 el('tpPhoto').addEventListener('change',async e=>{
  const file=e.target.files?.[0];if(!file)return;
  try{
   if(!file.type.startsWith('image/'))throw new Error('Choose a supported image file.');
   if(file.size>20*1024*1024)throw new Error('Image must be under 20MB.');
   const url=URL.createObjectURL(file),img=new Image();img.src=url;await img.decode();
   if(P.imageURL)URL.revokeObjectURL(P.imageURL);P.image=img;P.imageURL=url;P.imageName=file.name;
   el('tpPhotoLabel').textContent=file.name;updatePreview();
  }catch(err){notify(`Cannot open photo: ${err.message}`,true)}
 });
 el('tpPdf').addEventListener('change',async e=>{try{notify('Opening PDF…');await readPDF(e.target.files?.[0]);updatePreview();notify('PDF ready to print.')}catch(err){P.pdf=null;P.pdfName='';if(el('tpPdfLabel'))el('tpPdfLabel').textContent='No valid PDF loaded';notify(`Cannot open PDF: ${err.message}`,true)}});
 el('tpPages').addEventListener('input',()=>{P.pageRange=el('tpPages').value;updatePreview()});
 el('tpSend').addEventListener('click',printStudio);
 el('tpCancel').addEventListener('click',()=>global.AkaoraThermal.cancel());
 el('tpRawTest').addEventListener('click',rawTest);
 el('tpTestImage').addEventListener('click',rasterTest);
 el('tpInvoice').addEventListener('change',()=>{P.selectedInvoice=el('tpInvoice').value});
 el('tpInvoicePrint').addEventListener('click',()=>{if(!P.selectedInvoice)return notify('Select an invoice first.',true);printInvoice(P.selectedInvoice)});
 el('tpOpenInvoices').addEventListener('click',()=>global.go('bills'));
 updateStatus({event:'state'});updatePreview();
}
global.printStudioPage=printStudioPage;
global.bindPrintStudio=bindPrintStudio;
global.printBluetoothBill=id=>printInvoice(id,true);

})(window);

r" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>',camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h3l2-3h6l2 3h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="4"/></svg>',plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/></svg>',stock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 8v9l9 5 9-5V8M12 13v9"/></svg>',money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="12" cy="12" r="3"/></svg>'};
const ic=(n)=>`<span style="display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center">${I[n]||I.products}</span>`,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n)||0),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function render(){if(!window.AkaoraEmailGate?.canAccess())return;save();applyPreferences();if(!profile){setupPage();return}appShell();pageRender()}
function setupPage(){if(!window.AkaoraEmailGate?.canAccess())return;document.querySelector('#root').innerHTML=`<div class="login-wrap"><section class="login-art"><div class="brand"><div class="logo">${I.logo}</div><div><strong>Akaora Inventory Basics</strong><small>Essentials edition</small></div></div><div><h1>Run your shop.<br><span style="color:#8fa0ff">Know your numbers.</span></h1><p>A simple workspace for products, stock, billing, customers and reports.</p></div><svg class="art" viewBox="0 0 500 320" fill="none"><rect x="30" y="20" width="440" height="275" rx="18" stroke="#415680" fill="#111d38"/><rect x="50" y="40" width="400" height="35" rx="8" fill="#1b2c4f"/><rect x="50" y="92" width="115" height="65" rx="10" fill="#24395f"/><rect x="178" y="92" width="115" height="65" rx="10" fill="#24395f"/><rect x="306" y="92" width="144" height="65" rx="10" fill="#24395f"/><rect x="50" y="173" width="400" height="100" rx="10" fill="#172744"/><path d="M75 250v-25m45 25v-45m45 45v-34m45 34v-55m45 55v-28m45 28v-44m45 44v-61" stroke="#7b8fff" stroke-width="11" stroke-linecap="round"/><circle cx="400" cy="214" r="23" fill="#2c426a"/><path d="m389 214 8 8 14-17" stroke="#7cf0be" stroke-width="4" stroke-linecap="round"/></svg><small class="muted">Your data stays in this browser on this device.</small></section><section class="login-panel"><div class="login-box"><div class="brand"><div class="logo">${I.logo}</div><div><strong>Set up your shop</strong><small>Verified email account required</small></div></div><div id="setupForm"></div><p class="footer-note">Shop setup is available only after email sign-in and verification. Inventory data stays local unless separately synchronized.</p></div></section></div>`;setupRender()}

function homePage(){let today=new Date().toDateString(),ti=invoices.filter(i=>new Date(i.date).toDateString()===today),low=products.filter(p=>p.qty<=p.threshold),stock=products.reduce((s,p)=>s+p.qty*p.cost,0),days=Array.from({length:7},(_,j)=>{let d=new Date();d.setDate(d.getDate()-6+j);return {l:d.toLocaleDateString('en',{weekday:'short'}),v:invoices.filter(i=>new Date(i.date).toDateString()===d.toDateString()).reduce((s,i)=>s+i.total,0)}}),max=Math.max(1,...days.map(x=>x.v));let hr=new Date().getHours(),greet=hr<12?'Ram Ram':hr<17?'Namaste':'Ram Ram';let pending=staff.filter(x=>!attendance[today+'_'+x.id]);return head(greet+' '+esc(profile.owner)+' ji 🙏',settings.language==='english'?'Here is your business overview for today.':'Chaliye aaj ka hisaab dekhte hain.',`<button class="secondary" onclick="exportData()">${ic('download')} Export .akaora</button><button class="amber" onclick="go('billing')">${ic('plus')} New bill</button>`)+`<div class="grid metrics">${metric("Today's sales",money(ti.reduce((s,i)=>s+i.total,0)),ti.length+' invoices today','reports')}${metric('Stock valuation',money(stock),'At purchase cost','stock')}${metric('Products',products.length,'In your catalogue','products')}${metric('Low stock',low.length,low.length?'Review stock levels':'No alerts','money')}</div><div class="grid cols"><section class="card"><h3>Sales · last 7 days</h3>${invoices.length?`<div class="chart">${days.map(d=>`<div class="barwrap"><span>${d.v?money(d.v):'—'}</span><div class="bar" style="height:${Math.max(3,d.v/max*120)}px"></div><span>${d.l}</span></div>`).join('')}</div>`:empty('Sales chart appears after the first invoice.')}</section><section class="card"><h3>Low-stock alerts</h3>${low.length?low.map(p=>`<div class="cartline"><span>${esc(p.name)}</span><span class="status low">${p.qty} left</span></div>`).join(''):empty('No low-stock items.')}</section></div><section class="card" style="margin-top:15px"><h3>Recent invoices</h3>${invoiceTable([...invoices].sort((a,b)=> function staffPage(){let today=new Date().toISOString().slice(0,10),list=staff.map(x=>{let a=attendance[today+'_'+x.id];return {...x,a}});return head('Staff aur Attendance','Lala ji, hazri, chhutti, advance aur salary ka hisaab ek jagah.',`<button class="secondary" onclick="attendanceCalendar()">Attendance calendar</button><button class="amber" onclick="staffModal()">+ Staff jodein</button>`)+`<div class="grid metrics">${metric('Total staff',staff.length,'Registered karamchari','parties')}${metric('Aaj present',list.filter(x=>x.a?.status==='Present').length,'Green = present','reports')}${metric('Half day',list.filter(x=>x.a?.status==='Half day').length,'Yellow = half day','reports')}${metric('Absent / pending',list.filter(x=>!x.a||x.a.status==='Absent').length,'Red = absent, blank = pending','expenses')}</div><div class="notice">Namaste lala ji! Har staff ke liye aane-jaane ka time mark karein. Salary estimate attendance, approved leave aur advance ke hisaab se banega.</div><section class="card"><h3>Aaj ki hazri · ${new Date().toLocaleDateString('en-IN')}</h3>${staff.length?`<div class="tablewrap"><table><tr><th>Staff</th><th>Phone</th><th>Status</th><th>Aaya</th><th>Gaya</th><th>Action</th></tr>${list.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td><span class="status ${x.a?.status==='Absent'?'low':x.a?.status==='Half day'?'partial':''}" style="${x.a?.status==='Present'?'background:#d7ead8;color:#28603b':x.a?.status==='Half day'?'background:#f7e7b4;color:#785a14':x.a?.status==='Absent'?'background:#f4d9d5;color:#923c37':''}">${x.a?.status||'Pending'}</span></td><td>${x.a?.in||'—'}</td><td>${x.a?.out||'—'}</td><td><div class="actions"><button onclick="markAttendance('${x.id}','Present')">Present</button><button class="secondary" onclick="markAttendance('${x.id}','Half day')">Half</button><button class="danger" onclick="markAttendance('${x.id}','Absent')">Absent</button><button class="secondary" onclick="timeEntry('${x.id}')">Time</button></div></td></tr>`).join('')}</table></div>`:empty('Abhi staff add nahi kiya. + Staff jodein se shuru karein.')}</section><section class="card" style="margin-top:14px"><h3>Recent attendance logs / हाल की हाज़िरी</h3><p class="muted">Har attendance change ka record yahan dikhega.</p>${attendanceLogs.length?`<div class="tablewrap"><table><tr><th>Date & time</th><th>Staff</th><th>Action</th><th>Status</th><th>Entry</th><th>Exit</th></tr>${[...attendanceLogs].reverse().slice(0,50).map(l=>`<tr><td>${new Date(l.timestamp).toLocaleString()}</td><td>${esc(l.staffName)}</td><td>${esc(l.action)}</td><td>${esc(l.status)}</td><td>${esc(l.in||'—')}</td><td>${esc(l.out||'—')}</td></tr>`).join('')}</table></div>`:empty('No attendance changes recorded yet.')}</section><section class="card" style="margin-top:14px"><div class="heading"><div><h3>Salary aur payslip</h3><p>Mahine ki attendance se estimated salary; advance alag se minus hoga.</p></div><button class="amber" onclick="salaryReport()">Payslip banayein</button></div>${staff.length?staff.map(x=>`<div class="cartline"><span><b>${esc(x.name)}</b><br><small class="muted">Monthly salary ${money(x.salary)} · Advance ${money(advances.filter(a=>a.staffId===x.id).reduce((n,a)=>n+a.amount,0))}</small></span><div class="actions"><button class="secondary" onclick="advanceModal('${x.id}')">Advance add</button><a target="_blank" href="https://wa.me/91${String(x.phone).replace(/\D/g,'').slice(-10)}" style="text-decoration:none"><button>WhatsApp</button></a></div></div>`).join(''):''}</section><section class="card" style="margin-top:14px"><h3>Monthly attendance calendar</h3>${calendarHTML()}</section>`}
function staffModal(){openModal('Naya staff jodein',`${field('Staff ka naam','stname','','text',true)}${field('Phone number (WhatsApp)','stphone','','tel',true)}${field('Monthly salary (₹)','stsalary','','number',true)}${field('Weekly off / paid leave days per month','stleave','4','number')}${field('Joining date','stjoin',new Date().toISOString().slice(0,10),'date')}`,'Save staff',()=>{let name=$('#stname').value.trim(),phone=$('#stphone').value.trim(),salary=Number($('#stsalary').value);if(!name||!phone||salary<0)return toast('Naam, phone aur salary check karein');staff.push({id:uid(),name,phone,salary,leaveDays:Number($('#stleave').value)||0,join:$('#stjoin').value});save();closeModal();pageRender();toast('Staff add ho gaya, lala ji')})}
function logAttendance(id,a,action){let person=staff.find(s=>s.id===id);attendanceLogs.push({staffId:id,staffName:person?.name||'Unknown staff',date:a.date||new Date().toISOString().slice(0,10),status:a.status||'Pending',in:a.in||'',out:a.out||'',action,timestamp:Date.now()});if(attendanceLogs.length>1000)attendanceLogs=attendanceLogs.slice(-1000)}
function markAttendance(id,status){let d=new Date().toISOString().slice(0,10),key=d+'_'+id;attendance[key]={staffId:id,date:d,status,in:status==='Present'?'09:00':status==='Half day'?'09:00':'',out:status==='Present'?'18:00':status==='Half day'?'13:00':'',updatedAt:Date.now()};logAttendance(id,attendance[key],'Status updated');save();pageRender();toast('Attendance saved')}
function timeEntry(id){let d=new Date().toISOString().slice(0,10),a=attendance[d+'_'+id]||{staffId:id,date:d,status:'Present',in:'',out:''};openModal('Aane-jaane ka time',`${field('Status','attstatus',a.status)}${field('Aaya kab? (HH:MM)','attin',a.in||'09:00')}${field('Gaya kab? (HH:MM)','attout',a.out||'18:00')}`,'Save time',()=>{a.status=$('#attstatus').value;a.in=$('#attin').value;a.out=$('#attout').value;a.date=d;a.staffId=id;a.updatedAt=Date.now();attendance[d+'_'+id]=a;logAttendance(id,a,'Entry/exit time updated');save();closeModal();pageRender();toast('Attendance time saved')})}
function advanceModal(id){openModal('Staff advance / beech mein liye paise',`${field('Amount (₹)','advamount','','number',true)}${field('Date','advdate',new Date().toISOString().slice(0,10),'date',true)}${field('Note','advnote','Cash advance')}`,'Save advance',()=>{let amount=Number($('#advamount').value);if(amount<=0)return toast('Amount sahi bharein');advances.push({id:uid(),staffId:id,amount,date:$('#advdate').value,note:$('#advnote').value});save();closeModal();pageRender()})}
function salaryReport(){let month=new Date().toISOString().slice(0,7),lines=staff.map(x=>{let rows=Object.values(attendance).filter(a=>a.staffId===x.id&&a.date?.startsWith(month)),present=rows.filter(a=>a.status==='Present').length,half=rows.filter(a=>a.status==='Half day').length,absent=rows.filter(a=>a.status==='Absent').length,days=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate(),earned=x.salary*(present+half*.5)/days,adv=advances.filter(a=>a.staffId===x.id&&a.date?.startsWith(month)).reduce((n,a)=>n+a.amount,0),net=Math.max(0,earned-adv);return {x,present,half,absent,earned,adv,net}});openModal('Monthly payslip · '+month,lines.map(r=>`<div class="cartline"><span><b>${esc(r.x.name)}</b><br><small>Present ${r.present} · Half ${r.half} · Absent ${r.absent}<br>Earned ${money(r.earned)} − advance ${money(r.adv)}</small></span><b>${money(r.net)}</b><button class="secondary" onclick="shareSlip('${r.x.id}','${month}')">WhatsApp</button></div>`).join('')||'Pehle staff add karein.','Close',()=>closeModal())}
function shareSlip(id,month){let x=staff.find(s=>s.id===id);let rows=Object.values(attendance).filter(a=>a.staffId===id&&a.date?.startsWith(month)),p=rows.filter(a=>a.status==='Present').length,h=rows.filter(a=>a.status==='Half day').length,adv=advances.filter(a=>a.staffId===id&&a.date?.startsWith(month)).reduce((n,a)=>n+a.amount,0),earned=x.salary*(p+h*.5)/new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();let msg=`Namaste ${x.name} ji, ${month} ki salary slip - ${profile.shopName}\nPresent: ${p}, Half day: ${h}\nEarned: ${money(earned)}\nAdvance: ${money(adv)}\nEstimated payable: ${money(Math.max(0,earned-adv))}\nAgar koi galti ho to owner se sampark karein.`;window.open('https://wa.me/91'+x.phone.replace(/\D/g,'').slice(-10)+'?text='+encodeURIComponent(msg),'_blank')}
function calendarHTML(){let d=new Date(),year=d.getFullYear(),month=d.getMonth(),days=new Date(year,month+1,0).getDate();return `<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(x=>`<div class="muted" style="text-align:center">${x}</div>`).join('')}${Array.from({length:new Date(year,month,1).getDay()},()=>'<div></div>').join('')}${Array.from({length:days},(_,i)=>{let day=i+1,key=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,arr=staff.map(s=>attendance[key+'_'+s.id]?.status).filter(Boolean),color=!arr.length?'#e8e2d5':arr.includes('Absent')?'#f4d9d5':arr.includes('Half day')?'#f7e7b4':'#d7ead8';return `<div title="${key}: ${arr.join(', ')||'No attendance'}" style="background:${color};color:#30362d;border-radius:8px;text-align:center;padding:8px 2px">${day}</div>`}).join('')}</div><p class="muted tiny">Green = present · Yellow = half day · Red = absent · Grey = no record. Calendar summary uses staff attendance entries.</p>`}
function attendanceCalendar(){go('staff');setTimeout(()=>document.querySelector('.card:last-child')?.scrollIntoView({behavior:'smooth'}),50)}
function productsPage(){let arr=products.filter(p=>(p.name+' '+p.sku+' '+p.barcode+' '+p.category).toLowerCase().includes(search.toLowerCase()));return head('Products & stock','Manage your own product catalogue, photos and stock.',`<button class="secondary" onclick="exportData()">${ic('download')} Export .akaora</button><button class="amber" onclick="productModal()">${ic('plus')} Add product</button>`)+`<div class="toolbar"><input id="search" value="${esc(search)}" placeholder="Search product, SKU, barcode…"><select id="stockFilter"><option value="all">All stock</option><option value="low">Low stock</option><option value="out">Out of stock</option></select><button class="secondary" onclick="adjustAll()">Stock adjustment</button></div>${arr.length?`<div class="grid product-grid">${arr.map(p=>`<div class="card product-card"><div class="photo">${p.image?`<img src="${p.image}" alt="${esc(p.name)}">`:I.image}</div><div class="product-body"><b>${esc(p.name)}</b><div class="muted tiny">${esc(p.sku||'No SKU')} · ${esc(p.category||'Uncategorised')}</div><div class="product-price">${money(p.price)}</div><div class="muted tiny">Cost ${money(p.cost)} · Stock ${p.qty} ${esc(p.unit)}</div><div style="margin-top:8px">${p.qty<=p.threshold?'<span class="status low">Low stock</span>':'<span class="status">In stock</span>'}</div><div class="product-actions"><button class="secondary" onclick="productModal('${p.id}')">Edit</button><button class="secondary" onclick="adjustStock('${p.id}')">Adjust</button><button class="danger" onclick="deleteProduct('${p.id}')">Delete</button></div></div></div>`).join('')}</div>`:empty(search?'No products match your search.':'No products yet. Add your first product.')}`}
function openModal(title,body,label,fn){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalFoot').innerHTML=`<button class="secondary" onclick="closeModal()">Cancel</button><button class="amber" id="modalSave">${label}</button>`;$('#modalback').style.display='flex';$('#modalSave').onclick=fn}function closeModal(){$('#modalback').style.display='none'}
function productModal(id){let p=products.find(x=>x.id===id)||{name:'',sku:'',barcode:'',category:'',unit:'piece',cost:'',price:'',qty:'',threshold:5,image:'',desc:''};imageData=p.image||'';openModal(id?'Edit product':'Add product',`<div class="fieldgrid"><div class="full"><label>Product image</label>${p.image?`<img id="imgprev" src="${p.image}" style="width:110px;height:95px;object-fit:cover;border-radius:10px">`:''}<div class="actions"><label class="secondary" style="padding:9px 12px;border-radius:10px;cursor:pointer;color:white">${ic('camera')} Camera<input id="cameraFile" type="file" accept="image/*" capture="environment" class="hide"></label><label class="secondary" style="padding:9px 12px;border-radius:10px;cursor:pointer;color:white">${ic('image')} Gallery<input id="galleryFile" type="file" accept="image/*" class="hide"></label><button class="secondary" id="removeImg" type="button">Remove</button></div><p class="muted tiny">Images are embedded in the .akaora backup. Use compressed photos for smaller files.</p></div>${field('Product name','pn',p.name,'text',true)}${field('SKU / item code','psku',p.sku)}${field('Barcode','pbar',p.barcode)}${field('Category','pcat',p.category)}<div><label>Unit</label><select id="punit">${['piece','pack','box','kg','gram','litre','metre','dozen','set'].map(x=>`<option ${p.unit===x?'selected':''}>${x}</option>`).join('')}</select></div>${field('Purchase cost (₹)','pcost',p.cost,'number')}${field('Selling price (₹)','pprice',p.price,'number',true)}${field('Current / opening stock','pqty',p.qty,'number')}${field('Low-stock threshold','pth',p.threshold,'number')}<div class="full"><label>Description</label><textarea id="pdesc">${esc(p.desc)}</textarea></div></div>`,id?'Save changes':'Add product',()=>{let name=$('#pn').value.trim(),sku=$('#psku').value.trim(),price=Number($('#pprice').value),qty=Number($('#pqty').value),cost=Number($('#pcost').value||0);if(!name||$('#pprice').value===''||price<0||qty<0||cost<0)return toast('Enter a name and valid non-negative values');if(products.some(x=>x.id!==id&&sku&&x.sku.toLowerCase()===sku.toLowerCase()))return toast('SKU already exists');let o={id:p.id||uid(),name,sku,barcode:$('#pbar').value.trim(),category:$('#pcat').value.trim(),unit:$('#punit').value,cost,price,qty,threshold:Math.max(0,Number($('#pth').value)||0),image:imageData,desc:$('#pdesc').value.trim()};if(id)products[products.findIndex(x=>x.id===id)]=o;else products.push(o);save();closeModal();pageRender();toast('Product saved')});['cameraFile','galleryFile'].forEach(x=>$('#'+x).onchange=e=>imageRead(e.target.files[0]));$('#removeImg').onclick=()=>{imageData='';$('#imgprev')?.remove();toast('Image removed')}}
function imageRead(file){if(!file)return;if(!file.type.startsWith('image/'))return toast('Choose an image');if(file.size>8*1024*1024)return toast('Choose an image under 8 MB');let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,1000/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);imageData=c.toDataURL('image/jpeg',.82);let e=$('#imgprev');if(e)e.src=imageData;else $('#modalBody .full').insertAdjacentHTML('afterbegin',`<img id="imgprev" src="${imageData}" style="width:110px;height:95px;object-fit:cover;border-radius:10px">`)};im.src=r.result};r.readAsDataURL(file)}
function adjustStock(id){let p=products.find(x=>x.id===id);openModal('Adjust stock',`<p class="muted">Current stock: <b>${p.qty} ${esc(p.unit)}</b></p>${field('Adjustment (+ receive / − reduce)','delta','0','number',true)}<div style="margin-top:10px"><label>Reason</label><select id="reason"><option>Stock received</option><option>Stock count correction</option><option>Damaged / lost</option><option>Return</option><option>Other</option></select></div>`,'Apply',()=>{let d=Number($('#delta').value);if(!d||p.qty+d<0)return toast('Invalid adjustment');p.qty+=d;moves.push({id:uid(),product:p.name,delta:d,reason:$('#reason').value,date:Date.now()});save();closeModal();pageRender()})}
function adjustAll(){if(!products.length)return toast('Add a product first');openModal('Stock adjustment',`<label>Product</label><select id="aprod">${products.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.qty})</option>`).join('')}</select>${field('Adjustment (+ / −)','delta','0','number',true)}<label>Reason</label><select id="reason"><option>Stock received</option><option>Stock count correction</option><option>Damaged / lost</option><option>Other</option></select>`,'Apply',()=>{let p=products.find(p=>p.id===$('#aprod').value),d=Number($('#delta').value);if(!d||p.qty+d<0)return toast('Invalid adjustment');p.qty+=d;moves.push({id:uid(),product:p.name,delta:d,reason:$('#reason').value,date:Date.now()});save();closeModal();pageRender()})}
function deleteProduct(id){let p=products.find(x=>x.id===id);if(confirm(`Delete ${p.name}? Historical invoices remain.`)){products=products.filter(x=>x.id!==id);save();pageRender()}}
function billingPage(){let arr=products.filter(p=>(p.name+' '+p.sku+' '+p.barcode).toLowerCase().includes(search.toLowerCase())),items=Object.entries(cart).map(([id,q])=>({p:products.find(p=>p.id===id),q})).filter(x=>x.p),sub=items.reduce((s,x)=>s+x.p.price*x.q,0),d=Math.min(sub,discount),tax=Math.max(0,sub-d)*settings.tax/100,total=sub-d+tax;return head('Fast billing','Search or scan an item, review the cart and save the invoice.',`<button class="secondary" onclick="clearCart()">Clear cart</button>`)+`<div class="billing"><section class="card"><div class="toolbar"><input id="billSearch" value="${esc(search)}" placeholder="Search product, SKU or barcode…"></div>${arr.length?`<div class="catalog">${arr.map(p=>`<button class="catalogitem" onclick="addCart('${p.id}')"><div class="catalogimg">${p.image?`<img src="${p.image}">`:I.image}</div><div class="cataloginfo"><strong>${esc(p.name)}</strong><small>${esc(p.sku||'No SKU')} · ${p.qty} in stock</small><b>${money(p.price)}</b></div></button>`).join('')}</div>`:empty('Add products first, then they appear here.')}</section><aside class="card"><h3>Current bill <span class="pill">${items.reduce((s,x)=>s+x.q,0)} items</span></h3>${items.length?items.map(x=>`<div class="cartline"><div><b>${esc(x.p.name)}</b><div class="muted tiny">${money(x.p.price)} each</div><div class="qty"><button onclick="qty('${x.p.id}',-1)">−</button><span>${x.q}</span><button onclick="qty('${x.p.id}',1)">+</button><button class="danger" onclick="removeCart('${x.p.id}')">×</button></div></div><b>${money(x.p.price*x.q)}</b></div>`).join(''):empty('Cart is empty. Tap a product to add it.')}<div class="line"></div><label>Customer</label><select id="bcustomer"><option>Walk-in customer</option>${parties.filter(p=>p.type==='Customer').map(p=>`<option>${esc(p.name)}</option>`).join('')}</select><div style="margin-top:10px"><label>Discount amount (₹)</label><input id="bdiscount" type="number" min="0" value="${discount}" oninput="discount=Number(this.value)||0;updateTotals()"></div><div style="margin-top:10px"><label>Payment received (₹)</label><input id="bpaid" type="number" min="0" step=".01" value="${total.toFixed(2)}" oninput="updateTotals()"></div><div style="margin-top:10px"><label>Payment method</label><select id="bmethod"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank transfer</option><option>Credit</option></select></div><div class="totals" id="totals"><div><span>Subtotal</span><span>${money(sub)}</span></div><div><span>Discount</span><span>−${money(d)}</span></div><div><span>Tax (${settings.tax}%)</span><span>${money(tax)}</span></div><div class="grand"><span>Total</span><span>${money(total)}</span></div><div><span>Balance due</span><span>${money(Math.max(0,total-Number($('#bpaid')?.value||total)))}</span></div></div><button class="amber" style="width:100%;margin-top:12px" onclick="finalize()" ${items.length?'':'disabled'}>Save invoice & update stock</button><p class="muted tiny">Stock is reduced only when you save the bill.</p></aside></div>`}
function calc(){let sub=Object.entries(cart).reduce((s,[id,q])=>s+(products.find(p=>p.id===id)?.price||0)*q,0),d=Math.min(sub,Math.max(0,Number($('#bdiscount')?.value||0))),tax=Math.max(0,sub-d)*settings.tax/100;return {sub,d,tax,total:sub-d+tax}}
function updateTotals(){let x=calc(),paid=Number($('#bpaid')?.value||0);$('#totals').innerHTML=`<div><span>Subtotal</span><span>${money(x.sub)}</span></div><div><span>Discount</span><span>−${money(x.d)}</span></div><div><span>Tax (${settings.tax}%)</span><span>${money(x.tax)}</span></div><div class="grand"><span>Total</span><span>${money(x.total)}</span></div><div><span>Balance due</span><span>${money(Math.max(0,x.total-paid))}</span></div>`}
function addCart(id){let p=products.find(p=>p.id===id);if((cart[id]||0)+1>p.qty)return toast('Not enough stock');cart[id]=(cart[id]||0)+1;pageRender()}function qty(id,d){let p=products.find(p=>p.id===id),n=(cart[id]||0)+d;if(n<=0)delete cart[id];else if(n>p.qty)return toast('Not enough stock');else cart[id]=n;pageRender()}function removeCart(id){delete cart[id];pageRender()}function clearCart(){cart={};discount=0;pageRender()}
function finalize(){let items=Object.entries(cart).map(([id,q])=>({p:products.find(p=>p.id===id),q})).filter(x=>x.p);if(!items.length)return toast('Add items first');if(items.some(x=>x.q>x.p.qty))return toast('Insufficient stock');let x=calc(),paid=Math.max(0,Number($('#bpaid').value||0));if(x.total<=0||paid>x.total)return toast('Check invoice total and payment');let inv={id:uid(),no:`${settings.prefix}-${String(invoices.length+1).padStart(5,'0')}`,date:Date.now(),customer:$('#bcustomer').value,method:$('#bmethod').value,items:items.map(x=>({id:x.p.id,name:x.p.name,qty:x.q,price:x.p.price,cost:x.p.cost,line:x.p.price*x.q})),subtotal:x.sub,discount:x.d,tax:x.tax,total:x.total,paid};items.forEach(x=>x.p.qty-=x.q);invoices.push(inv);cart={};discount=0;save();page='bills';render();toast('Invoice saved');viewInvoice(inv.id)}
function billsPage(){let total=invoices.reduce((s,i)=>s+i.total,0),paid=invoices.reduce((s,i)=>s+i.paid,0);return head('Bills & payments','Invoice register, payment collection and outstanding balances.',`<button class="secondary" onclick="exportCSV('invoices')">${ic('download')} Export CSV</button><button class="amber" onclick="go('billing')">${ic('plus')} New bill</button>`)+`<div class="grid metrics">${metric('Invoices',invoices.length,'All bills','bills')}${metric('Sales',money(total),'Invoice totals','reports')}${metric('Received',money(paid),'Payments collected','money')}${metric('Outstanding',money(total-paid),'Unpaid balance','billing')}</div><div class="toolbar"><input id="billFilter" placeholder="Search invoice or customer…"><button class="secondary" onclick="pageRender()">Clear</button></div><section class="card"><h3>Invoice register</h3><div id="invoiceTable">${invoiceTable([...invoices].sort((a,b)=>b.date-a.date))}</div></section>`}
function viewInvoice(id){let i=invoices.find(x=>x.id===id);openModal('Invoice '+i.no,`<div id="printInvoice"><center>${settings.billLogoEnabled===false?'':'<img alt="Business logo" src="'+esc(settings.shopLogo || window.AKAORA_BRAND_LOGO_DATA || '')+'" style="display:block;width:85px;height:85px;object-fit:contain;margin:0 auto 10px">'}<h2>${esc(profile.shopName)}</h2><div>${esc(profile.address)}, ${esc(profile.city)} ${esc(profile.pin)}</div><div>${esc(profile.phone)} ${profile.gstin?'· GSTIN '+esc(profile.gstin):''}</div><h3>INVOICE ${esc(i.no)}</h3></center><p><b>Customer:</b> ${esc(i.customer)}<br><b>Date:</b> ${new Date(i.date).toLocaleString()}<br><b>Payment:</b> ${esc(i.method)} · ${status(i)}</p><div class="tablewrap"><table style="min-width:0"><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>${i.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.line)}</td></tr>`).join('')}</table></div><div class="totals"><div><span>Subtotal</span><span>${money(i.subtotal)}</span></div><div><span>Discount</span><span>−${money(i.discount)}</span></div><div><span>Tax</span><span>${money(i.tax)}</span></div><div class="grand"><span>Total</span><span>${money(i.total)}</span></div><div><span>Paid</span><span>${money(i.paid)}</span></div><div><span>Due</span><span>${money(due(i))}</span></div></div><center>${esc(settings.footer)}</center></div>`,'Close',closeModal);$('#modalFoot').insertAdjacentHTML('afterbegin',`<button class="secondary" onclick="printBill()">Browser print / PDF</button><button class="amber" onclick="printBluetoothBill('${i.id}')">Bluetooth receipt</button><button class="secondary" onclick="payment('${i.id}')">Record payment</button><button class="secondary" onclick="shareBill('${i.id}')">Share</button>`)}
function printBill(){let w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print');const paper=settings.paper||'A4',theme=settings.billTheme||'classic',size=paper==='58mm thermal'?'58mm auto':paper==='80mm thermal'?'88mm auto':paper==='A5'?'148mm 210mm':'210mm 297mm',border=theme==='minimal'?'0':theme==='modern'?'1px solid #1684ff':theme==='elegant'?'1px solid #b79b63':theme==='thermal'?'1px dashed #777':'1px solid #cbd5e1',logo='',sig=settings.shopSignature?'<div style="text-align:right;margin-top:24px"><img style="max-width:120px;max-height:60px" src="'+settings.shopSignature+'"><div>Authorised signature</div></div>':'',wm=settings.watermark?'<div class="wm">'+esc(settings.watermark)+'</div>':'',wi=settings.watermarkImage?'<img class="wmi" src="'+settings.watermarkImage+'">':'';w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Invoice</title><style>@page{size:'+size+';margin:'+(paper.includes('thermal')?'3mm':'10mm')+'}body{font:13px -apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#111;padding:6px}.brand{text-align:center}table{width:100%;border-collapse:collapse;min-width:0!important}td,th{border:'+border+';padding:'+(paper.includes('thermal')?'3px':'7px')+';text-align:left}th{background:'+(theme==='modern'?'#e8f3ff':theme==='elegant'?'#f7f0e3':'#f3f4f6')+'}.wm{position:fixed;top:45%;left:5%;font-size:36px;opacity:.1;transform:rotate(-25deg)}.wmi{position:fixed;top:30%;left:25%;width:50%;opacity:.1}.theme-minimal th{background:white}.theme-elegant{font-family:Georgia,serif}.theme-modern h2{color:#0875e1}.footer{text-align:center;margin-top:16px;font-size:11px}</style></head><body class="theme-'+theme+'"><div class="brand">'+logo+'<h2>'+esc(profile.shopName)+'</h2></div>'+wm+wi+$('#printInvoice').innerHTML+sig+'<div class="footer">'+esc(settings.printFooter||settings.footer||'Thank you for shopping with us')+'</div></body></html>');w.document.close();w.onload=()=>{w.focus();w.print()};return true}
function shareBill(id){let i=invoices.find(x=>x.id===id),s=`${profile.shopName}\\nInvoice ${i.no}\\nCustomer: ${i.customer}\\nTotal: ${money(i.total)}\\nPaid: ${money(i.paid)}\\nDue: ${money(due(i))}`;if(navigator.share)navigator.share({title:i.no,text:s}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(s),'_blank')}
function payment(id){let i=invoices.find(x=>x.id===id);openModal('Record payment',`<p>Current due: <b>${money(due(i))}</b></p>${field('Payment amount (₹)','payamount',due(i),'number',true)}<label>Method</label><select id="paymethod"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank transfer</option></select>`,'Save payment',()=>{let a=Number($('#payamount').value);if(a<=0||a>due(i)+.009)return toast('Invalid payment amount');i.paid+=a;i.payments=i.payments||[];i.payments.push({amount:a,method:$('#paymethod').value,date:Date.now()});save();closeModal();pageRender();toast('Payment recorded')})}
function partiesPage(){let a=parties.filter(p=>(p.name+' '+p.phone+' '+p.type).toLowerCase().includes(search.toLowerCase()));return head('Parties','Customer and supplier records, contact details and balances.',`<button class="amber" onclick="partyModal()">${ic('plus')} Add party</button>`)+`<div class="toolbar"><input id="search" value="${esc(search)}" placeholder="Search name or phone…"></div>${a.length?`<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${a.map(p=>`<div class="card"><div class="party"><div class="party-avatar">${esc(p.name.slice(0,1).toUpperCase())}</div><div class="party-info"><b>${esc(p.name)}</b><small>${esc(p.type)} · ${esc(p.phone||'No phone')}</small></div><span class="pill">${esc(p.type)}</span></div><div class="line"></div><div class="muted tiny">${esc(p.email||'No email')}<br>${esc(p.address||'No address')}</div><p>Outstanding: <b>${money(invoices.filter(i=>i.customer===p.name).reduce((s,i)=>s+due(i),0))}</b></p><div class="actions"><button class="secondary" onclick="partyModal('${p.id}')">Edit</button><button class="danger" onclick="delParty('${p.id}')">Delete</button></div></div>`).join('')}</div>`:empty('No parties yet. Add a customer or supplier.')}`}
function partyModal(id){let p=parties.find(x=>x.id===id)||{name:'',type:'Customer',phone:'',email:'',address:'',gstin:'',notes:''};openModal(id?'Edit party':'Add party',`<div class="fieldgrid">${field('Name','partyname',p.name,'text',true)}<div><label>Type</label><select id="partytype"><option ${p.type==='Customer'?'selected':''}>Customer</option><option ${p.type==='Supplier'?'selected':''}>Supplier</option></select></div>${field('Phone','partyphone',p.phone,'tel')}${field('Email','partyemail',p.email,'email')}${field('GSTIN (optional)','partygst',p.gstin||'')}${field('Address','partyaddress',p.address)}<div class="full"><label>Notes</label><textarea id="partynotes">${esc(p.notes)}</textarea></div></div>`,'Save party',()=>{let name=$('#partyname').value.trim();if(!name)return toast('Name required');let o={id:p.id||uid(),name,type:$('#partytype').value,phone:$('#partyphone').value.trim(),email:$('#partyemail').value.trim(),gstin:$('#partygst').value.trim(),address:$('#partyaddress').value.trim(),notes:$('#partynotes').value.trim()};if(id)parties[parties.findIndex(x=>x.id===id)]=o;else parties.push(o);save();closeModal();pageRender()})}
function delParty(id){if(confirm('Delete party?')){parties=parties.filter(x=>x.id!==id);save();pageRender()}}
function purchasesPage(){return head('Purchases','Record supplier purchases and receive stock.',`<button class="amber" onclick="purchaseModal()">${ic('plus')} Record purchase</button>`)+`<div class="grid metrics">${metric('Purchase entries',purchases.length,'Saved records','purchases')}${metric('Purchase value',money(purchases.reduce((s,p)=>s+p.total,0)),'Total cost','money')}${metric('Stock movements',moves.length,'Adjustments and receipts','reports')}${metric('Suppliers',parties.filter(p=>p.type==='Supplier').length,'Saved suppliers','parties')}</div><section class="card"><h3>Purchase history</h3>${purchases.length?`<div class="tablewrap"><table><tr><th>Reference</th><th>Supplier</th><th>Date</th><th>Product</th><th>Qty</th><th>Total</th></tr>${[...purchases].reverse().map(p=>`<tr><td>${esc(p.no)}</td><td>${esc(p.supplier)}</td><td>${new Date(p.date).toLocaleDateString()}</td><td>${esc(p.product)}</td><td>${p.qty}</td><td>${money(p.total)}</td></tr>`).join('')}</table></div>`:empty('No purchases recorded yet.')}</section>`}
function purchaseModal(){if(!products.length)return toast('Add products first');openModal('Record purchase',`<label>Supplier</label><select id="sup">${parties.filter(p=>p.type==='Supplier').map(p=>`<option>${esc(p.name)}</option>`).join('')}<option>Unspecified supplier</option></select><label>Product</label><select id="purprod">${products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>${field('Reference','purref','')}${field('Quantity received','purqty','1','number',true)}${field('Unit cost (₹)','purcost',products[0].cost,'number',true)}${field('Date','purdate',new Date().toISOString().slice(0,10),'date',true)}`,'Save purchase',()=>{let p=products.find(x=>x.id===$('#purprod').value),q=Number($('#purqty').value),cost=Number($('#purcost').value);if(q<=0||cost<0)return toast('Enter valid quantity and cost');p.qty+=q;p.cost=cost;let o={id:uid(),no:$('#purref').value||`PUR-${purchases.length+1}`,supplier:$('#sup').value,product:p.name,qty:q,total:q*cost,date:new Date($('#purdate').value).getTime()||Date.now()};purchases.push(o);moves.push({id:uid(),product:p.name,delta:q,reason:'Purchase received',date:Date.now()});save();closeModal();pageRender();toast('Stock received')})}
function expensesPage(){return head('Expenses','Record and review everyday business expenses.',`<button class="amber" onclick="expenseModal()">${ic('plus')} Add expense</button>`)+`<div class="grid metrics">${metric('Total expenses',money(expenses.reduce((s,e)=>s+e.amount,0)),'Recorded expenses','money')}${metric('Entries',expenses.length,'Saved records','reports')}${metric('Sales',money(invoices.reduce((s,i)=>s+i.total,0)),'Before expenses','billing')}${metric('This month',money(expenses.filter(e=>new Date(e.date).getMonth()===new Date().getMonth()).reduce((s,e)=>s+e.amount,0)),'Calendar month','purchases')}</div><section class="card"><h3>Expense register</h3>${expenses.length?`<div class="tablewrap"><table><tr><th>Date</th><th>Category</th><th>Description</th><th>Method</th><th>Amount</th><th></th></tr>${[...expenses].reverse().map(e=>`<tr><td>${new Date(e.date).toLocaleDateString()}</td><td>${esc(e.category)}</td><td>${esc(e.desc)}</td><td>${esc(e.method)}</td><td>${money(e.amount)}</td><td><button class="danger" onclick="delExpense('${e.id}')">Delete</button></td></tr>`).join('')}</table></div>`:empty('No expenses recorded yet.')}</section>`}
function expenseModal(){openModal('Add expense',`${field('Description','exdesc','','text',true)}<label>Category</label><select id="excat">${['Rent','Utilities','Transport','Packaging','Salary','Maintenance','Marketing','Other'].map(x=>`<option>${x}</option>`)}</select>${field('Amount (₹)','examount','','number',true)}${field('Date','exdate',new Date().toISOString().slice(0,10),'date',true)}<label>Payment method</label><select id="exmethod"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank transfer</option></select>`,'Save expense',()=>{let amount=Number($('#examount').value),desc=$('#exdesc').value.trim();if(!desc||amount<=0)return toast('Enter description and positive amount');expenses.push({id:uid(),desc,category:$('#excat').value,amount,date:new Date($('#exdate').value).getTime(),method:$('#exmethod').value});save();closeModal();pageRender()})}
function delExpense(id){expenses=expenses.filter(e=>e.id!==id);save();pageRender()}
function reportsPage(){let sales=invoices.reduce((s,i)=>s+i.total,0),cost=invoices.reduce((s,i)=>s+i.items.reduce((a,x)=>a+x.cost*x.qty,0),0),ex=expenses.reduce((s,e)=>s+e.amount,0);return head('Reports & analytics','Sales, estimated gross profit, expenses and stock valuation.',`<button class="secondary" onclick="exportCSV('products')">${ic('download')} Stock CSV</button><button class="secondary" onclick="exportCSV('invoices')">${ic('download')} Sales CSV</button>`)+`<div class="grid metrics">${metric('Gross sales',money(sales),'Invoice totals','reports')}${metric('Estimated gross profit',money(sales-cost),'Before expenses','money')}${metric('Expenses',money(ex),'Recorded expenses','purchases')}${metric('After expenses',money(sales-cost-ex),'Simplified estimate','stock')}</div><div class="grid cols"><section class="card"><h3>Stock valuation</h3><div class="metric-value">${money(products.reduce((s,p)=>s+p.qty*p.cost,0))}</div><p class="muted">${products.length} products · ${products.reduce((s,p)=>s+p.qty,0)} units</p></section><section class="card"><h3>Stock movements</h3>${moves.length?`<div class="tablewrap"><table><tr><th>Date</th><th>Product</th><th>Change</th><th>Reason</th></tr>${[...moves].reverse().slice(0,20).map(m=>`<tr><td>${new Date(m.date).toLocaleDateString()}</td><td>${esc(m.product)}</td><td>${m.delta>0?'+':''}${m.delta}</td><td>${esc(m.reason)}</td></tr>`).join('')}</table></div>`:empty('Adjustments and purchases appear here.')}</section></div><section class="card" style="margin-top:14px"><h3>Sales register</h3>${invoiceTable([...invoices].reverse())}</section><p class="muted tiny">Profit is an estimate, not statutory accounting or GST reporting.</p>`}
function settingsPage(){return head('Settings','Business profile, invoice defaults and full workspace backup.',`<button class="amber" onclick="saveSettings()">${ic('check')} Save settings</button>`)+`<div class="grid cols settings-grid"><section class="card"><h3>${ic('settings')} Appearance & language</h3><div class="fieldgrid"><div><label>Theme</label><select id="sTheme"><option value="light" ${settings.theme!=='dark'?'selected':''}>Light mode</option><option value="dark" ${settings.theme==='dark'?'selected':''}>Dark mode</option></select></div><div><label>App language / भाषा</label><select id="sLanguage"><option value="english" ${settings.language==='english'?'selected':''}>English</option><option value="hinglish" ${settings.language!=='english'?'selected':''}>Hinglish</option></select></div></div><p class="muted tiny">Choose your preferred appearance and language. Your choices are saved on this device.</p></section><section class="card"><h3>${ic('store')} Business profile</h3><div class="fieldgrid">${field('Shop name','sShop',profile.shopName,'text',true)}${field('Owner name','sOwner',profile.owner,'text',true)}${field('Phone','sPhone',profile.phone,'tel',true)}${field('Email','sEmail',profile.email,'email')}<div class="full"><label>Address</label><textarea id="sAddress">${esc(profile.address)}</textarea></div>${field('City','sCity',profile.city,'text',true)}${field('State','sState',profile.state,'text',true)}${field('PIN','sPin',profile.pin,'text',true)}${field('GSTIN optional','sGst',profile.gstin||'')}</div><div class="line"></div><h3>Invoice defaults</h3><div class="fieldgrid">${field('Invoice prefix','sPrefix',settings.prefix)}${field('Default tax (%)','sTax',settings.tax,'number')}<div class="full"><label>Invoice footer</label><input id="sFooter" value="${esc(settings.footer)}"></div></div><p class="muted tiny">Tax setting is a generic calculation, not a guarantee of GST compliance.</p><div class="line"></div><h3>${ic('printer')} Printing & bill design</h3><div class="print-options"><div><label>Default paper size</label><select id="sPaper"><option>58mm thermal</option><option>80mm thermal</option><option>A4</option><option>A5</option></select></div><div><label>Bill format (5 themes)</label><select id="sBillTheme"><option value="classic">Classic</option><option value="minimal">Minimal</option><option value="modern">Modern blue</option><option value="thermal">Thermal compact</option><option value="elegant">Elegant</option></select></div><div><label>Watermark text</label><input id="sWatermark" placeholder="PAID / ORIGINAL"></div><div><label>UPI ID</label><input id="sUpi" placeholder="shop@upi"></div><div class="full"><label>Shop logo (.png/.jpg)</label><input id="sLogoFile" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="full"><label>Signature image (.png)</label><input id="sSignatureFile" type="file" accept="image/png"></div><div class="full"><label>Watermark image</label><input id="sWatermarkFile" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="full"><label>Print footer</label><input id="sPrintFooter" placeholder="Thank you for shopping with us"></div></div><div class="line"></div><h3>${ic('qr-code')} UPI QR prototype</h3><div class="print-options"><div><label>QR timer</label><select id="sUpiExpiry"><option value="1">1 minute</option><option value="3">3 minutes</option><option value="5">5 minutes</option></select></div><div><label>Amount (₹)</label><input id="sUpiAmount" type="number" min="1" step=".01" placeholder="Enter amount"></div></div><button class="secondary" onclick="generateUpiQr()">Generate UPI QR</button><div id="upiQrPreview" style="display:none;margin-top:12px;padding:14px;border:1px solid var(--glass-border);border-radius:16px"></div><p class="muted tiny">Prototype limitation: expiry only hides the QR in this app. A static UPI QR cannot be remotely disabled after scanning, and payment success requires a payment gateway integration.</p></section><section class="card"><h3>${ic('database')} Data backup & portability</h3><p class="muted">One .akaora file backs up shop details, product photos, prices, stock, bills, parties, purchases, expenses, stock history, attendance logs, appearance/language preferences and settings.</p><div class="actions"><button class="amber" onclick="exportData()">${ic('download')} Export .akaora</button><button class="secondary" onclick="$('#importFile').click()">${ic('upload')} Import .akaora</button><input id="importFile" type="file" accept=".akaora,.apora,application/json" class="hide"></div><div class="line"></div><p class="muted tiny">Stored only in this browser on this device. No cloud sync or secure password login in this build. Keep regular backups.</p><button class="danger" onclick="resetData()">Reset workspace</button></section></div>`}
async function readPrintAssets(){const pairs=[['sLogoFile','shopLogo'],['sSignatureFile','shopSignature'],['sWatermarkFile','watermarkImage']];for(const [id,key] of pairs){const f=document.getElementById(id)?.files?.[0];if(f){if(f.size>2097152){toast('Image must be under 2 MB');continue}settings[key]=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}}}
let upiTimer=null;function generateUpiQr(){const id=(document.getElementById('sUpi')?.value||settings.upiId||'').trim(),amount=Number(document.getElementById('sUpiAmount')?.value||settings.upiAmount||0),minutes=Number(document.getElementById('sUpiExpiry')?.value||settings.upiExpiry||3);if(!id||!id.includes('@'))return toast('Enter a valid UPI ID first');if(!(amount>0))return toast('Enter a payment amount');const ref='AK'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase(),uri='upi://pay?pa='+encodeURIComponent(id)+'&pn='+encodeURIComponent(profile?.shopName||'Akaora Shop')+'&am='+amount.toFixed(2)+'&cu=INR&tn='+encodeURIComponent('Payment '+ref),expires=Date.now()+minutes*60000,p=document.getElementById('upiQrPreview');p.style.display='block';p.innerHTML='<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><img alt="UPI QR code" style="width:180px;height:180px;background:white;padding:7px;border-radius:12px" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(uri)+'"><div><b>UPI payment request</b><p>₹'+amount.toFixed(2)+'</p><p>Ref: '+ref+'</p><b id="upiCountdown"></b><p class="muted tiny">Timer is local-only; it cannot revoke a UPI request already scanned.</p><button class="secondary" onclick="generateUpiQr()">Generate new QR</button></div></div>';if(upiTimer)clearInterval(upiTimer);const tick=()=>{const el=document.getElementById('upiCountdown'),left=expires-Date.now();if(!el)return;if(left<=0){clearInterval(upiTimer);el.textContent='QR EXPIRED — generate a new QR';const img=p.querySelector('img');if(img){img.style.opacity='.12';img.style.filter='grayscale(1)'}return}el.textContent='Expires in '+Math.floor(left/60000)+':'+String(Math.floor(left%60000/1000)).padStart(2,'0')};tick();upiTimer=setInterval(tick,1000)}

function dayKey(date){const d=new Date(date);if(!Number.isFinite(d.getTime()))return '';return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function profitTotals(invs,exps){
 const sales=invs.reduce((n,i)=>n+Math.max(0,Number(i.subtotal||0)-Number(i.discount||0)),0);
 const cogs=invs.reduce((n,i)=>n+(i.items||[]).reduce((v,x)=>v+Math.max(0,Number(x.cost||0))*Number(x.qty||0),0),0);
 const spending=exps.reduce((n,e)=>n+Number(e.amount||0),0);

function dailyProfit(day){return profitTotals(invoices.filter(i=>dayKey(i.date)===day),expenses.filter(e=>dayKey(e.date)===day));}

 const inv={id:uid(),no:`${prefix}-${String(seq).padStart(5,'0')}`,date:Date.now(),customer:billDraft.customerName.trim()||'Walk-in customer',customerPhone:billDraft.customerPhone.trim(),customerEmail:email,method:billDraft.method,orderType:isRestaurant()?billDraft.orderType:null,tableNo:isRestaurant()?billDraft.tableNo.trim():'',orderNote:isRestaurant()?billDraft.orderNote.trim():'',restaurantOrder:isRestaurant(),kotPrintedAt:null,billPrintRequestedAt:null,items:items.map(x=>({id:x.p.quick?null:x.p.id,name:x.p.name,qty:x.q,price:x.p.price,cost:Number(x.p.cost)||0,line:x.p.price*x.q,quick:!!x.p.quick})),subtotal:x.sub,discount:x.d,tax:x.tax,total:x.total,paid};

async function sendBillBluetooth(id){
 const inv=invoices.find(i=>i.id===id);if(!inv)return toast('Invoice not found');
 const cfg=settings||{};
 try{

function kotCanvas(invoice){
 const w=window.AkaoraThermal.dimensions(),margin=16,items=invoice.items||[];const scratch=document.createElement('canvas').getContext('2d');
 const segments=[];const add=(str,size=22,bold=false,center=false)=>{scratch.font=`${bold?'700':'400'} ${size}px Arial`;const width=w-margin*2;const words=String(str).split(/\s+/);let line='';for(const word of words){const probe=line?line+' '+word:word;if(scratch.measureText(probe).width>width&&line){segments.push({text:line,size,bold,center});line=word}else line=probe;}segments.push({text:line,size,bold,center});};
 add('KITCHEN ORDER TICKET',26,true,true);add(invoice.no,20,true,true);add(new Date(invoice.date).toLocaleString('en-IN'),18,false,true);add('--------------------------------',19);
 add('ORDER: '+(invoice.orderType||'Dine-in'),23,true);if(invoice.tableNo)add('TABLE: '+invoice.tableNo,28,true);
 add('--------------------------------',19);
 items.forEach(x=>{add(`${x.qty} x ${x.name}`,25,true);});
 if(invoice.orderNote){add('--------------------------------',19);add('KITCHEN NOTE:',20,true);add(invoice.orderNote,23,true);}
 add('--------------------------------',19);add('NO PRICES - KITCHEN COPY',16,false,true);
 const h=Math.max(180,segments.reduce((n,x)=>n+Math.round(x.size*1.52),32)+55);if(h>12000)throw new Error('KOT too long');const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
 const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.fillStyle='#000';ctx.textBaseline='top';let y=20;
 for(const x of segments){ctx.font=`${x.bold?'bold':'normal'} ${x.size}px Arial`;ctx.textAlign=x.center?'center':'left';ctx.fillText(x.text,x.center?w/2:margin,y);y+=Math.round(x.size*1.52);}
 return canvas;
}

function akaoraEncode128(input){
 const val=String(input||'').trim();
 if(!val || val.length>44 || !/^[\x20-\x7e]+$/.test(val))throw Error('Code 128 requires 1–44 printable ASCII characters. Shorten the barcode or replace special characters.');
 const symbols=[104,...[...val].map(c=>c.charCodeAt(0)-32)];
 let checksum=104;
 for(let i=1;i<symbols.length;i++)checksum+=symbols[i]*i;
 symbols.push(checksum%103,106);
 const widths=symbols.map(n=>AKAORA_CODE128_PATTERNS[n]).join('');
 const unitCount=[...widths].reduce((a,x)=>a+Number(x),0);
 return {value:val,widths,unitCount};
}
function akaoraCode128Svg(val,{height=70,caption=false}={}){
 const p=akaoraEncode128(val);let x=10,rects='',bar=true;
 for(const token of p.widths){const width=Number(token);if(bar)rects+=`<rect x="${x}" y="0" width="${width}" height="${height}"/>`;x+=width;bar=!bar}
 return `<svg class="bcs-barcode" role="img" aria-label="Code 128 barcode ${esc(p.value)}" viewBox="0 0 ${p.unitCount+20} ${height+(caption?17:0)}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><rect width="100%" height="100%" fill="#fff"/><g fill="#000">${rects}</g>${caption?`<text x="50%" y="${height+14}" fill="#000" font-size="12" font-family="Arial,sans-serif" text-anchor="middle">${esc(p.value)}</text>`:''}</svg>`;
}
function generateUniqueBarcode(){
 const used=new Set(products.map(x=>String(x.barcode||'').toUpperCase()).filter(Boolean));
 let next=Math.max(100000,Number(settings.nextBarcodeCounter||100000));
 while(next<1000000){const code='AK'+String(next).padStart(6,'0');next++;if(!used.has(code)){settings.nextBarcodeCounter=next;return code}}
 throw Error('Internal barcode range exhausted; enter a different unique barcode manually.');
}
function barcodeStudioPage(){
 const visible=products.filter(p=>(p.name+' '+(p.sku||'')+' '+(p.barcode||'')).toLowerCase().includes(BCS.filter.toLowerCase()));
 const selected=[...BCS.selected].map(id=>products.find(p=>p.id===id)).filter(Boolean);
 const missing=products.filter(p=>!p.barcode).length;
 return head('Barcode Studio','Generate product codes, print thermal stickers and prepare 48-label A4 sheets.',`<button class="secondary" onclick="go('products')">Products</button><button class="amber" onclick="barcodeGenerateMissing()">Generate missing (${missing})</button>`)+

 `<div class="bcs-layout"><section class="card bcs-card"><div class="bcs-header"><div><h3 style="margin:0">Products & label quantities</h3><p class="muted tiny" style="margin:4px 0 0">Select products, then choose copies per product.</p></div><span class="pill">${selected.length} selected</span></div><div class="bcs-tools"><input type="search" id="bcsSearch" value="${esc(BCS.filter)}" placeholder="Search name, SKU or barcode" oninput="barcodeSearch(this.value)"><button class="secondary" onclick="barcodeSelectAll(true)">Select all</button><button class="secondary" onclick="barcodeSelectAll(false)">Clear</button></div><div class="bcs-product-list">${visible.length?visible.map(p=>`<div class="bcs-product"><input aria-label="Select ${esc(p.name)}" type="checkbox" ${BCS.selected.has(p.id)?'checked':''} onchange="barcodeSelect('${esc(p.id)}',this.checked)"><div><div class="bcs-name">${esc(p.name)}</div><div class="bcs-meta">${p.barcode?esc(p.barcode):'<b style="color:#c65b34">No barcode</b>'} · ${money(p.price)}</div></div><input class="bcs-qty" type="number" min="1" max="500" aria-label="Label copies" value="${Number(BCS.quantities[p.id]||1)}" oninput="barcodeQuantity('${esc(p.id)}',this.value)"></div>`).join(''):'<p class="empty">No matching products. Add a product first.</p>'}</div><p class="bcs-count">Codes are stored with your products and included in .akaora backups. Generated codes are internal Code 128 IDs, not registered GS1/EAN product numbers.</p><div class="actions"><button onclick="barcodeGenerateSelected()">Generate selected missing barcodes</button><button class="secondary" onclick="barcodeOpenEditor()">Edit selected barcode</button></div></section>
 <section class="card bcs-card"><h3>Label preview</h3><div class="bcs-preview" id="bcsPreview"></div><div class="bcs-config"><div><label>Thermal roll width</label><select id="bcsWidth" onchange="BCS.thermalWidth=Number(this.value)"><option value="58" ${BCS.thermalWidth===58?'selected':''}>58mm</option><option value="80" ${BCS.thermalWidth===80?'selected':''}>80mm</option><option value="88" ${BCS.thermalWidth===88?'selected':''}>88mm roll (576-dot profile)</option></select></div><div><label>Label contents</label><select onchange="BCS.showPrice=this.value!=='name';BCS.showName=this.value!=='price';barcodeUpdatePreview()"><option value="both">Name + price</option><option value="name" ${BCS.showName&&!BCS.showPrice?'selected':''}>Name only</option><option value="price" ${!BCS.showName&&BCS.showPrice?'selected':''}>Price only</option></select></div></div><div class="actions bcs-actions" style="margin-top:12px"><button class="amber" id="bcsPrintThermal" onclick="barcodePrintThermal()">Print thermal labels</button><button class="secondary" onclick="barcodePrintA4()">Print A4 · 48 / page</button></div><div class="line"></div><h3>A4 label sheet · 4 columns × 12 rows</h3><p class="muted tiny">Adjust margins/gaps to match your adhesive sheet. Each page holds up to 48 stickers.</p><div class="bcs-config"><div><label>Sheet margin (mm)</label><input type="number" min="0" max="15" step="0.5" value="${BCS.a4Margin}" oninput="BCS.a4Margin=Number(this.value)"></div><div><label>Column gap (mm)</label><input type="number" min="0" max="6" step="0.5" value="${BCS.gapX}" oninput="BCS.gapX=Number(this.value)"></div><div><label>Row gap (mm)</label><input type="number" min="0" max="4" step="0.2" value="${BCS.gapY}" oninput="BCS.gapY=Number(this.value)"></div><div><label>Print cut guides</label><select onchange="BCS.includeGrid=this.value==='yes'"><option value="no">No — sticker sheet</option><option value="yes" ${BCS.includeGrid?'selected':''}>Yes — plain A4</option></select></div></div><div class="bcs-hint">A4 printing uses your browser's print dialog. Choose A4, 100% scale and turn off headers/footers. For PSF588 use 58mm, not 80mm.</div><div class="bcs-muted-box">Bluetooth labels use the existing PSF588-compatible BLE raster pipeline. Chrome/Edge Web Bluetooth permission and compatible hardware are required. Printer paper output cannot be confirmed by software alone.</div></section></div>`;

/* Fast native ESC/POS receipt mode. Falls back to raster to preserve Unicode glyphs.

 for(let t of tokens){
  while(t.length>cols){if(line){result.push(line);line=''}result.push(t.slice(0,cols));t=t.slice(cols)}

 }

}
function lines(s,cols){return clean(s).split('\n').flatMap(s=>foldedLine(s,cols));}
function alignRight(left,right,cols){

function centered(s,cols){return lines(s,cols).map(t=>' '.repeat(Math.max(0,Math.floor((cols-t.length)/2)))+t).join('\n')}

 const cols=global.AkaoraThermal.dimensions()===384?32:48;
 const line='-'.repeat(cols),o=[];
 o.push(centered(p.shopName||'Akaora Inventory',cols));
 const address=[p.address,p.city,p.state,p.pin].filter(Boolean).join(', ');
 if(address)o.push(...lines(address,cols));
 if(p.phone)o.push('Phone: '+p.phone);
 if(p.gstin)o.push('GSTIN: '+p.gstin);
 o.push(line,centered('INVOICE '+invoice.no,cols));
 o.push(...lines(new Date(invoice.date).toLocaleString('en-IN'),cols));
 o.push(...lines('Customer: '+(invoice.customer||'Walk-in customer'),cols));
 if(invoice.customerPhone)o.push('Phone: '+invoice.customerPhone);
 if(invoice.customerEmail)o.push('Email: '+invoice.customerEmail);

  o.push(...lines(item.name||'Product',cols));

 if(invoice.discount)o.push(alignRight('Discount','- '+rs(invoice.discount),cols));
 if(invoice.tax)o.push(alignRight('Tax',rs(invoice.tax),cols));
 o.push(alignRight('TOTAL',rs(invoice.total),cols));
 o.push(alignRight('Paid',rs(invoice.paid),cols));

 if(due>.009)o.push(alignRight('Balance due',rs(due),cols));

/* v9 — Reorganize Settings DOM while retaining original input IDs and handlers. */
(function(){
  const previousSettingsPage = settingsPage;
  settingsPage = function(){
    const wrapper=document.createElement('div');
    wrapper.innerHTML=previousSettingsPage();
    const oldGrid=wrapper.querySelector('.settings-grid');
    if(!oldGrid) return previousSettingsPage();
    const cards=Array.from(oldGrid.children).filter(x=>x.classList.contains('card'));
    if(cards.length<3) return wrapper.innerHTML;
    const appearance=cards[0], business=cards[1], backup=cards[2];
    const makeCard=(className)=>{const el=document.createElement('section');el.className='card settings-card '+className;return el};
    appearance.classList.add('settings-card','settings-appearance');
    backup.classList.add('settings-card','settings-backup');
    const sections=[];let current=null;
    for(const node of Array.from(business.children)){
      // Every H3 starts its own fully independent card. No settings controls are dropped.
      if(node.tagName==='H3'){
        const title=(node.textContent||'').toLowerCase();
        let tag='settings-other';
        if(title.includes('business profile'))tag='settings-business';
        else if(title.includes('workflow'))tag='settings-workflow';
        else if(title.includes('invoice defaults'))tag='settings-invoice';
        else if(title.includes('printing'))tag='settings-print';
        else if(title.includes('upi'))tag='settings-upi';
        current=makeCard(tag);sections.push(current);
      }
      if(!current){current=makeCard('settings-other');sections.push(current)}
      if(node.classList?.contains('line')){node.remove();continue}
      current.appendChild(node);
    }
    // Logo checkbox is introduced by v6 before invoice defaults; move it to Printing.
    const checkbox=sections.find(x=>x.querySelector('#sBillLogoEnabled'))?.querySelector('#sBillLogoEnabled');
    const printCard=sections.find(x=>x.classList.contains('settings-print'));
    if(checkbox&&printCard){
      const block=checkbox.closest('.bcs-muted-box')||checkbox.parentElement;
      if(block)printCard.insertBefore(block,printCard.querySelector('.print-options'));
    }
    const left=document.createElement('div');left.className='settings-stack settings-left';
    const right=document.createElement('div');right.className='settings-stack settings-right';
    left.appendChild(appearance);
    for(const section of sections){
      if(section.classList.contains('settings-business')||section.classList.contains('settings-workflow')||section.classList.contains('settings-invoice')) right.appendChild(section);
      else left.appendChild(section);
    }
    left.appendChild(backup);
    const layout=document.createElement('div');layout.className='settings-layout';
    layout.append(left,right);oldGrid.replaceWith(layout);
    const heading=wrapper.querySelector('.heading');
    if(heading){heading.classList.add('settings-heading');const intro=heading.querySelector('p');if(intro)intro.textContent='Appearance, business profile, billing, printing and secure backups — organized in one place.';}
    return wrapper.innerHTML;
  };
  const existingBind=bind;
  bind=function(){
    existingBind();
    if(page!=='settings')return;
    const theme=document.getElementById('sTheme');
    if(theme) theme.addEventListener('change',()=>{
      settings.theme=theme.value==='dark'?'dark':'light';
      applyPreferences();
      save();
    });
    const lang=document.getElementById('sLanguage');
    if(lang) lang.addEventListener('change',()=>{
      settings.language=lang.value;document.documentElement.lang=lang.value==='english'?'en':'hi';save();
    });
  };
  const existingSaveSettings=saveSettings;
  saveSettings=async function(){
    const required=['sShop','sOwner','sPhone'];
    if(required.some(id=>!document.getElementById(id)?.value.trim())){toast('Please fill shop name, owner name and phone');return;}
    const pin=document.getElementById('sPin')?.value.trim()||'';
    if(pin&&!/^\d{6}$/.test(pin)){toast('PIN must contain exactly six digits');return;}
    const b=document.querySelector('.settings-heading button.amber');
    if(b){b.disabled=true;b.dataset.originalLabel=b.innerHTML;b.textContent='Saving…'}
    try{
      await existingSaveSettings();
      // v5/v6 wrappers save product settings and extra checkbox after async image reads.
      const stored=JSON.parse(localStorage.getItem('akaora_basics_settings')||'{}');
      if(stored.theme!==settings.theme || stored.billLogoEnabled!==settings.billLogoEnabled){
        // Retain the older UI on quota failures rather than claiming persistence.
        toast('Could not verify saved settings. Export a backup and check browser storage.');
      }
    }catch(e){console.error('Settings error',e);toast('Could not save settings: '+(e?.message||String(e)));}
    finally{if(b&&b.isConnected){b.disabled=false;b.innerHTML=b.dataset.originalLabel||'Save settings'}}
  };
})();
