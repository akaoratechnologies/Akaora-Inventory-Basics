<script id="akaora-v10-features">
/* Akaora Inventory v10: per-product detail pages, barcode scanning & magic generation.
 * BarcodeDecoder is browser-native where available. ZXing fallback loads only if camera/image decode is requested.
 * USB scanners that type barcodes and press Enter work without any extra software.
 */
(function(){
'use strict';
const productEsc=(value)=>esc(value);
const codeSafe=(id)=>String(id??'').replace(/[^a-zA-Z0-9_-]/g,'');
let stockView='all';
let scanState={mode:null,stream:null,reader:null,active:false,timer:null,decoder:null,accepted:false};
function isDuplicateCode(code,withoutId){
 const val=String(code||'').trim().toLowerCase();
 return val?products.find(p=>p.id!==withoutId&&String(p.barcode||'').trim().toLowerCase()===val):null;
}
function safeBarcodeMarkup(p){
 if(!p.barcode)return '<div class="muted tiny">No barcode assigned</div>';
 try{return akaoraCode128Svg(p.barcode,{height:72,caption:true})}
 catch(e){return `<strong>${productEsc(p.barcode)}</strong><p class="muted tiny">This product code cannot be rendered using Code 128: ${productEsc(e.message)}</p>`}
}
function renderCard(p){
 const low=Number(p.qty||0)<=Number(p.threshold||0),has=!!String(p.barcode||'').trim();
 return `<article class="card product-card" data-id="${productEsc(p.id)}" data-stock="${Number(p.qty)||0}" data-threshold="${Number(p.threshold)||0}">
  <div class="photo" data-paction="open" data-id="${productEsc(p.id)}" role="button" tabindex="0" aria-label="Open ${productEsc(p.name)} details">${p.image?`<img src="${productEsc(p.image)}" alt="${productEsc(p.name)}" loading="lazy">`:I.image}</div>
  <div class="product-body">
   <div class="product-title" role="button" tabindex="0" data-paction="open" data-id="${productEsc(p.id)}">${productEsc(p.name)}</div>
   <div class="product-meta">${productEsc(p.category||'Uncategorised')} · ${productEsc(p.sku||'No SKU')}</div>
   <div class="product-price">${money(p.price)}</div>
   <div class="product-meta">Cost ${money(p.cost)} · ${Number(p.qty)||0} ${productEsc(p.unit||'piece')}</div>
   <div class="stock-label"><span class="status ${low?'low':''}">${Number(p.qty)<=0?'Out of stock':low?'Low stock':'In stock'}</span></div>
   <div class="barcode-row">${has?`<span class="code-chip" title="${productEsc(p.barcode)}">▥ ${productEsc(p.barcode)}</span>`:`<button type="button" class="magic-btn" data-paction="magic" data-id="${productEsc(p.id)}">✨ Generate barcode</button>`}
    ${has?`<button type="button" class="secondary" style="padding:5px 8px;font-size:11px" data-paction="labels" data-id="${productEsc(p.id)}">Print label</button>`:''}
   </div>
   <div class="product-actions"><button type="button" class="secondary product-open" data-paction="open" data-id="${productEsc(p.id)}">Open details →</button><button type="button" class="secondary product-edit" data-paction="edit" data-id="${productEsc(p.id)}">Edit</button></div>
  </div>
 </article>`;
}
productsPage=function(){
 const visible=products.filter(p=>(String(p.name||'')+' '+String(p.sku||'')+' '+String(p.barcode||'')+' '+String(p.category||'')).toLowerCase().includes(search.toLowerCase())).filter(p=>stockView==='all'||(stockView==='low'&&Number(p.qty)<=Number(p.threshold))||(stockView==='out'&&Number(p.qty)<=0));
 return head('Products & stock','Manage your catalogue, scan existing barcodes or generate new ones.',`<button class="secondary" onclick="exportData()">${ic('download')} Export .akaora</button><button class="amber" onclick="productModal()">${ic('plus')} Add product</button>`)+
 `<div class="product-toolbar"><div class="search-wrap"><input id="search" type="search" value="${productEsc(search)}" placeholder="Search products, SKU, barcode…" aria-label="Search products"></div><select id="stockFilter" aria-label="Filter stock"><option value="all" ${stockView==='all'?'selected':''}>All stock</option><option value="low" ${stockView==='low'?'selected':''}>Low stock</option><option value="out" ${stockView==='out'?'selected':''}>Out of stock</option></select><button class="secondary" type="button" data-paction="scan" title="Camera, image or USB barcode scanner">▣ Scan barcode</button><button class="secondary" type="button" onclick="adjustAll()">Stock adjustment</button></div>
 ${visible.length?`<div class="grid product-grid">${visible.map(renderCard).join('')}</div>`:empty(products.length?'No products match your search/filter.':'No products yet. Add your first product.')}`;
};
const originalProductModal=productModal;
productModal=function(id){
 originalProductModal(id);
 const input=document.getElementById('pbar');
 if(!input)return;
 input.setAttribute('autocomplete','off');input.placeholder='Scan, type, or generate a barcode';
 const parent=input.parentElement;
 const section=document.createElement('div');section.className='product-code-controls';
 section.innerHTML=`<b style="display:block;font-size:13px">▥ Product barcode</b><div class="muted tiny">Existing barcode? Scan or type its EAN/UPC/Code 128 value. No barcode? Generate an internal Code 128 ID.</div><div class="buttons"><button type="button" class="secondary" id="akaoraEditScan">▣ Scan existing</button><button type="button" class="magic-btn" id="akaoraEditMagic">✨ Generate new</button></div><div class="muted tiny" style="margin-top:7px">USB barcode scanner: click Barcode field, then scan. Most scanners enter the number automatically.</div>`;
 parent.insertAdjacentElement('afterend',section);
 document.getElementById('akaoraEditScan').onclick=()=>openScanner('assign');
 document.getElementById('akaoraEditMagic').onclick=()=>{
   if(input.value.trim()&&!confirm('Replace the entered barcode with a newly generated internal code?'))return;
   input.value=generateUniqueBarcode();input.dispatchEvent(new Event('input',{bubbles:true}));toast('✨ New unique barcode generated. Save product to keep it.');
 };
 const saveButton=document.getElementById('modalSave');
 saveButton?.addEventListener('click',function(e){
   const barcode=input.value.trim(),dupe=isDuplicateCode(barcode,id);
   if(dupe){e.preventDefault();e.stopImmediatePropagation();toast(`Barcode already belongs to ${dupe.name}`);input.focus()}
 },true);
 const preview=document.getElementById('imgprev');if(preview){preview.style.width='110px';preview.style.height='110px';preview.style.objectFit='cover'}
};
function openProductDetails(id){
 const p=products.find(x=>String(x.id)===String(id));if(!p)return toast('Product not found');
 const rows=[['SKU',p.sku||'Not assigned'],['Category',p.category||'Uncategorised'],['Unit',p.unit||'piece'],['Available stock',`${Number(p.qty)||0} ${p.unit||'piece'}`],['Purchase cost',money(p.cost)],['Low-stock alert',`${p.threshold||0} ${p.unit||'piece'}`]];
 const body=`<div class="pd-layout"><div class="pd-image">${p.image?`<img src="${productEsc(p.image)}" alt="${productEsc(p.name)}">`:I.image}</div><div class="pd-info"><h3 class="pd-name">${productEsc(p.name)}</h3><p class="muted tiny">Product ID: ${productEsc(p.id)}</p><div class="pd-price">${money(p.price)}</div><div class="pd-rows">${rows.map(([l,v])=>`<div class="pd-row"><small>${l}</small><strong>${productEsc(v)}</strong></div>`).join('')}</div><div class="pd-code" id="akaoraDetailCode">${safeBarcodeMarkup(p)}</div>${p.desc?`<p class="muted">${productEsc(p.desc)}</p>`:''}<div class="pd-actions"><button class="amber pd-bill-btn" id="pdBill">Bill this product</button><button class="secondary pd-bag-btn" id="pdBag">Add to Bag</button><button class="secondary" id="pdAdjust">Adjust stock</button><button class="secondary" id="pdEdit">Edit product</button><button id="pdBarcode" class="${p.barcode?'secondary':'magic-btn'}">${p.barcode?'Print barcode label':'✨ Generate barcode'}</button></div></div></div>`;
 openModal('Product details',body,'Close',closeModal);
 document.getElementById('modalFoot').innerHTML=`<button class="secondary" id="pdClose">Close</button>`;
 document.getElementById('pdClose').onclick=closeModal;
 document.getElementById('pdBill').onclick=()=>window.AkaoraProductCheckout(p.id,'bill');
 document.getElementById('pdBag').onclick=()=>window.AkaoraProductCheckout(p.id,'bag');
 document.getElementById('pdEdit').onclick=()=>productModal(p.id);
 document.getElementById('pdAdjust').onclick=()=>adjustStock(p.id);
 document.getElementById('pdBarcode').onclick=()=>p.barcode?openBarcodeLabels(p.id):magicGenerate(p.id,true);
}
function magicGenerate(id,openDetails=false){
 const p=products.find(x=>String(x.id)===String(id));if(!p)return toast('Product not found');
 if(p.barcode)return toast('This product already has a barcode. Open its details to view it.');
 const value=generateUniqueBarcode();if(isDuplicateCode(value,p.id))return toast('Barcode collision detected. Try again.');
 p.barcode=value;
 if(save()===false){p.barcode='';return toast('Could not save barcode. Free up browser storage and retry.')}
 if(openDetails)openProductDetails(id);else pageRender();
 toast('✨ Unique barcode generated and saved: '+value);
}
function openBarcodeLabels(id){
 const p=products.find(x=>String(x.id)===String(id));if(!p||!p.barcode)return toast('Generate a barcode first');
 BCS.selected=new Set([p.id]);BCS.quantities[p.id]=BCS.quantities[p.id]||1;closeModal();go('barcodes');
}
function bindProductActions(){
 const content=document.getElementById('content');if(!content||page!=='products')return;
 content.querySelectorAll('[data-paction]').forEach(el=>{
   const action=()=>{const id=el.dataset.id;switch(el.dataset.paction){case'open':return openProductDetails(id);case'edit':return productModal(id);case'magic':return magicGenerate(id);case'labels':return openBarcodeLabels(id);case'remove':return window.AkaoraV12?.deleteProduct(id);case'scan':return openScanner('lookup')}};
   el.addEventListener('click',action);
   if(el.getAttribute('role')==='button')el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action()}});
 });
 const filt=content.querySelector('#stockFilter');if(filt)filt.onchange=e=>{stockView=e.target.value;pageRender()};
}
const previousPageRenderV10=pageRender;
pageRender=function(){previousPageRenderV10();bindProductActions()};
function scanStatus(message,error=false){const el=document.getElementById('akaoraScanStatus');if(el){el.textContent=message;el.style.color=error?'#f78a94':'var(--text)'}}
function stopCamera(){
 scanState.active=false;
 if(scanState.timer){cancelAnimationFrame(scanState.timer);scanState.timer=null}
 try{scanState.reader?.reset?.()}catch(_){}
 scanState.reader=null;
 if(scanState.stream){scanState.stream.getTracks().forEach(t=>t.stop());scanState.stream=null}
 const video=document.getElementById('akaoraScanVideo');if(video){try{video.pause();video.srcObject=null}catch(_){}}
}
function closeScanner(){stopCamera();document.getElementById('akaoraScanOverlay')?.remove();scanState.mode=null;scanState.accepted=false}
function receiveScan(raw){
  if(scanState.mode==='billing'&&typeof window.AkaoraBillingScanReceive==='function')return window.AkaoraBillingScanReceive(raw,{accepted:scanState.accepted,close:closeScanner,status:scanStatus});
 if(scanState.accepted)return;
 const code=String(raw||'').trim();if(!code)return scanStatus('No barcode was detected. Scan again.',true);
 scanState.accepted=true;
 const mode=scanState.mode;
 closeScanner();
 if(mode==='assign'){
   const input=document.getElementById('pbar');if(!input)return toast('Open Add/Edit Product before scanning');
   const duplicate=isDuplicateCode(code,undefined);
   input.value=code;input.dispatchEvent(new Event('input',{bubbles:true}));
   input.focus();
   toast(duplicate?`Scanned ${code} — check: this code may already belong to ${duplicate.name}`:`Barcode scanned: ${code}. Save the product to keep it.`);
 }else{
   const found=products.find(p=>String(p.barcode||'').trim().toLowerCase()===code.toLowerCase());
   if(found)openProductDetails(found.id);
   else{
     productModal();const input=document.getElementById('pbar');if(input){input.value=code;input.focus()}
     toast(`New barcode ${code}. Enter product details and save.`)
   }
 }
}
function openScanner(mode){
 closeScanner();scanState.mode=mode||'lookup';scanState.accepted=false;
 const overlay=document.createElement('div');overlay.id='akaoraScanOverlay';overlay.className='akaora-scan-overlay';
 overlay.innerHTML=`<div class="akaora-scan-dialog" role="dialog" aria-modal="true" aria-labelledby="akaoraScanTitle">
 <div class="akaora-scan-header"><h2 id="akaoraScanTitle">▣ ${mode==='assign'?'Scan product barcode':'Find or add by barcode'}</h2><button class="secondary" id="akaoraScanClose" aria-label="Close">✕</button></div>
 <p class="muted tiny">Read an existing Code 128, EAN-13, EAN-8 or UPC barcode. The number is saved as-is, not replaced with an internal code.</p>
 <div class="akaora-scan-camera"><video id="akaoraScanVideo" autoplay muted playsinline></video><span id="akaoraCameraHint" style="position:absolute">Click Start camera to scan a product.</span></div>
 <div class="akaora-scan-actions"><button type="button" id="akaoraScanCamera">◉ Start camera</button><label class="akaora-scan-file">▧ Scan photo<input type="file" id="akaoraScanPhoto" accept="image/*" capture="environment"></label></div>
 <div class="akaora-scan-status" id="akaoraScanStatus" role="status">USB scanner is also supported: focus the field below and scan.</div>
 <div class="akaora-scan-divider">USB scanner or manual barcode</div>
 <label for="akaoraScanInput">Barcode number</label><input id="akaoraScanInput" type="text" inputmode="text" autocomplete="off" placeholder="Scan here (scanner presses Enter)">
 <div class="akaora-scan-actions"><button type="button" id="akaoraScanUse">Use barcode</button><button class="secondary" id="akaoraScanCancel">Cancel</button></div>
 <p class="muted tiny">Camera scanning needs permission and a supported browser on localhost/HTTPS (or a supported file origin). ZXing fallback requires internet if built-in BarcodeDetector is unavailable.</p>
 </div>`;
 document.body.appendChild(overlay);
 document.getElementById('akaoraScanClose').onclick=closeScanner;
 document.getElementById('akaoraScanCancel').onclick=closeScanner;
 document.getElementById('akaoraScanCamera').onclick=startCamera;
 document.getElementById('akaoraScanUse').onclick=()=>receiveScan(document.getElementById('akaoraScanInput').value);
 document.getElementById('akaoraScanInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();receiveScan(e.target.value)}};
 document.getElementById('akaoraScanPhoto').onchange=e=>scanPhoto(e.target.files?.[0]);
 overlay.addEventListener('click',e=>{if(e.target===overlay)closeScanner()});
 document.getElementById('akaoraScanInput').focus();
}
async function createNativeDetector(){
 if(!('BarcodeDetector' in window))return null;
 try{
   const fmts=await window.BarcodeDetector.getSupportedFormats();
   const wanted=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar'];
   const selected=wanted.filter(x=>fmts.includes(x));
   return selected.length?new BarcodeDetector({formats:selected}):null;
 }catch(err){return null}
}
let zxingLoadPromise=null;
function loadZXing(){
 if(window.ZXing?.BrowserMultiFormatReader)return Promise.resolve(window.ZXing);
 if(zxingLoadPromise)return zxingLoadPromise;
 zxingLoadPromise=new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
  script.async=true;
  script.onload=()=>window.ZXing?.BrowserMultiFormatReader?resolve(window.ZXing):reject(Error('Barcode decoder could not initialize'));
  script.onerror=()=>reject(Error('ZXing library could not download. Check internet connection or use USB barcode scanner.'));
  document.head.appendChild(script);
 }).catch(err=>{zxingLoadPromise=null;throw err});
 return zxingLoadPromise;
}
async function startCamera(){
 const btn=document.getElementById('akaoraScanCamera');if(!btn)return;
 stopCamera();scanState.active=true;scanStatus('Starting camera…');
 btn.disabled=true;const vid=document.getElementById('akaoraScanVideo');
 try{
   if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera access unavailable. Use localhost/HTTPS in Chrome/Edge, or connect a USB scanner.');
   const native=await createNativeDetector();
   if(native){
     scanState.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
     if(!scanState.active){scanState.stream.getTracks().forEach(t=>t.stop());return}
     vid.srcObject=scanState.stream;await vid.play();scanState.decoder=native;
     document.getElementById('akaoraCameraHint').style.display='none';scanStatus('Camera ready. Hold barcode within the frame.');
     let last=0;const tick=async(time)=>{
      if(!scanState.active)return;
      if(time-last>=150&&vid.readyState>=2){last=time;try{const codes=await native.detect(vid);if(codes.length)receiveScan(codes[0].rawValue)}catch(e){}}
      if(scanState.active)scanState.timer=requestAnimationFrame(tick);
     };scanState.timer=requestAnimationFrame(tick);
   }else{
     scanStatus('Loading ZXing camera decoder…');const ZXing=await loadZXing();
     if(!scanState.active)return;
     const reader=new ZXing.BrowserMultiFormatReader();scanState.reader=reader;
     await reader.decodeFromVideoDevice(undefined,vid,(result,error)=>{if(result&&scanState.active)receiveScan(result.getText())});
     if(!scanState.active)return;
     document.getElementById('akaoraCameraHint').style.display='none';scanStatus('Camera ready. Hold barcode within the frame.');
   }
 }catch(e){scanStatus(e.message||String(e),true);stopCamera()}
 finally{if(btn.isConnected)btn.disabled=false}
}
async function scanPhoto(file){
 if(!file)return;scanStatus('Reading barcode from photo…');
 try{
  if(!file.type.startsWith('image/'))throw Error('Select a JPG, PNG or WEBP image');
  const detector=await createNativeDetector();
  if(detector){const bmp=await createImageBitmap(file);try{const codes=await detector.detect(bmp);if(codes.length)receiveScan(codes[0].rawValue)}finally{bmp.close?.()}}
  const ZXing=await loadZXing();
  const reader=new ZXing.BrowserMultiFormatReader();const url=URL.createObjectURL(file);
  try{const result=await reader.decodeFromImageUrl(url);return receiveScan(result.getText())}
  finally{reader.reset?.();URL.revokeObjectURL(url)}
 }catch(e){scanStatus('Barcode not found in photo: '+(e.message||String(e)),true)}
}
window.AkaoraProductTools={open:openProductDetails,generate:magicGenerate,labels:openBarcodeLabels,scan:openScanner,closeScan:closeScanner,decode:receiveScan};
// Ensure first page redraw (no database migration; all barcodes remain in product records).
if(profile&&page==='products'&&document.getElementById('content'))pageRender();
})();

<script id="akaora-staff-v11-script">
/* Akaora Inventory v11 — staff, attendance, payroll, encrypted local ID attachments */
(function(){
'use strict';
const monthLocal=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
const dayLocal=()=>{const d=new Date();return `${monthLocal()}-${String(d.getDate()).padStart(2,'0')}`};
const H=s=>esc(s??'');
const cash=n=>money(Math.round((Number(n)||0)*100)/100);
let chosenMonth=monthLocal();
let salaryPayments=load('salaryPayments',[]);
const getStaff=id=>staff.find(p=>String(p.id)===String(id));
const daysIn=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
const monthDate=(m,d)=>`${m}-${String(d).padStart(2,'0')}`;
const paidMonth=(id,m)=>salaryPayments.filter(p=>p.staffId===id&&p.month===m).reduce((s,p)=>s+Number(p.amount||0),0);
const monthAttendance=(id,m)=>Object.values(attendance).filter(x=>String(x.staffId)===String(id)&&x.date?.startsWith(m));
const zero=(n)=>Number((Math.round((Number(n)+Number.EPSILON)*100)/100).toFixed(2));
function compute(id,m=chosenMonth){
 const x=getStaff(id);if(!x)return null;
 const all=daysIn(m),monthStart=monthDate(m,1),monthEnd=monthDate(m,all);
 const join=x.join&&/^\d{4}-\d{2}-\d{2}$/.test(x.join)?x.join:monthStart;
 const eligible=join>monthEnd?0:Math.max(0,all-(join>monthStart?Number(join.slice(-2))-1:0));
 const monthlyOffs=Math.min(Math.max(0,Math.floor(Number(x.leaveDays)||0)),Math.max(0,all-1));
 // A mid-month joiner must not earn a FULL monthly salary for a partial calendar month.
 const offs=eligible===all?monthlyOffs:Math.min(eligible,Math.round(monthlyOffs*eligible/all));
 const baseWorking=Math.max(1,all-monthlyOffs);
 const working=Math.max(0,eligible-offs);
 const rows=monthAttendance(id,m).filter(a=>a.date>=join);
 const present=rows.filter(a=>a.status==='Present').length;
 const half=rows.filter(a=>a.status==='Half day').length;
 const absent=rows.filter(a=>a.status==='Absent').length;
 const leave=rows.filter(a=>a.status==='Paid leave').length;
 const marked=present+half+absent+leave;
 // Allowable paid offs are EXCLUDED from the divisor, not counted twice as attendance.
 const credit=Math.min(working,present+half*.5+leave);
 const perDay=Number(x.salary||0)/baseWorking;
 const gross=zero(credit*perDay);
 const adv=zero(advances.filter(a=>a.staffId===id&&String(a.date||'').startsWith(m)).reduce((n,a)=>n+Number(a.amount||0),0));
 const net=zero(Math.max(0,gross-adv));
 const paid=zero(paidMonth(id,m));
 const due=zero(Math.max(0,net-paid));
 return {x,month:m,all,eligible,offs,monthlyOffs,baseWorking,working,present,half,absent,leave,marked,unmarked:Math.max(0,eligible-marked),credit,perDay,gross,adv,net,paid,due};
}
function selectedMonth(m){if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(m))return;chosenMonth=m;pageRender()}
function staffAvatar(x,classes='ap-employee-photo'){
 return x.photo?`<img class="${classes}" src="${H(x.photo)}" alt="Photo of ${H(x.name)}">`:`<span class="ap-initials" aria-hidden="true">${H(String(x.name||'S').trim()[0]||'S').toUpperCase()}</span>`;
}
function statusClass(s){return {'Present':'p','Absent':'a','Half day':'h','Paid leave':'o'}[s]||'n'}
function staffPageNew(){
 const today=dayLocal(),active=staff.map(x=>({x,a:attendance[today+'_'+x.id]}));
 let totalDue=0;staff.forEach(x=>totalDue+=compute(x.id)?.due||0);
 return `<div class="ap-staff-page">${head('Staff & attendance','Employee profiles, attendance, exact monthly payroll and printable payslips.',`<button class="amber" onclick="staffModal()">+ Add employee</button>`)}
 <div class="grid metrics">
 ${metric('Employees',staff.length,'Active employee profiles','parties')}
 ${metric('Present today',active.filter(i=>i.a?.status==='Present').length,'Green attendance','reports')}
 ${metric('Half day today',active.filter(i=>i.a?.status==='Half day').length,'Yellow attendance','reports')}
 ${metric('Salary outstanding',cash(totalDue),`Selected month ${chosenMonth}`,'money')}</div>
 <section class="card" style="margin-top:15px"><div class="ap-topline"><div><h3 style="margin:0">Monthly attendance & payroll</h3><p class="muted" style="margin:4px 0 0">Click an employee to view their personal calendar, in/out times and salary details.</p></div><div class="ap-month"><button type="button" class="secondary" onclick="AkaoraStaffPayroll.stepMonth(-1)" aria-label="Previous month">←</button><input type="month" aria-label="Choose month" value="${chosenMonth}" onchange="AkaoraStaffPayroll.month(this.value)"><button type="button" class="secondary" onclick="AkaoraStaffPayroll.stepMonth(1)" aria-label="Next month">→</button><button class="amber" onclick="salaryReport()">Create payslips</button></div></div>
 <div class="ap-secure-note">Salary policy: <b>Monthly salary ÷ (full-month calendar days − monthly off days)</b> × (Present + ½ Half day + approved Paid leave), minus this month's advances. Unmarked days are pending, not automatically called absent. Payment records reduce the balance separately.</div>
 <div class="ap-employee-grid">${staff.length?staff.map(x=>{const r=compute(x.id),a=attendance[today+'_'+x.id];return `<article class="card ap-employee-card" style="padding:14px"><div class="ap-employee">${staffAvatar(x)}<div class="ap-person-text"><h3><button type="button" class="ap-name-button" style="all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:transparent" onclick="AkaoraStaffPayroll.open('${H(x.id)}')">${H(x.name)} ↗</button></h3><p>${H(x.phone||'No phone')} · ${cash(x.salary)} / month</p><span class="ap-badge ${statusClass(a?.status)}">${H(a?.status||'Not marked today')}</span></div></div><div class="ap-salaryline"><div><small>Earned</small><strong>${cash(r.gross)}</strong></div><div><small>Advances</small><strong>${cash(r.adv)}</strong></div><div><small>Balance</small><strong>${cash(r.due)}</strong></div></div><div class="ap-person-actions"><button class="secondary" onclick="AkaoraStaffPayroll.open('${H(x.id)}')">Calendar & profile</button><button class="secondary" onclick="AkaoraStaffPayroll.payslip('${H(x.id)}')">Payslip</button><button onclick="AkaoraStaffPayroll.printChoice('${H(x.id)}')">Print</button><button class="secondary" onclick="AkaoraStaffPayroll.pay('${H(x.id)}')">Mark salary paid</button></div></article>`}).join(''):`<div class="empty" style="grid-column:1/-1">No staff added yet. Choose <b>Add employee</b> to start.</div>`}</div>
 </section><section class="card" style="margin-top:14px"><h3>Attendance legend</h3><div class="ap-legend"><span class="ap-badge p">● Present</span><span class="ap-badge a">● Absent</span><span class="ap-badge h">● Half day</span><span class="ap-badge o">● Approved paid leave</span><span class="ap-badge n">○ Unmarked</span></div><p class="ap-policy">Use real entry and exit times—marking attendance does not invent a 9:00 AM arrival. Salary is a configurable calculation, not statutory payroll or tax compliance.</p></section>
 <section class="card" style="margin-top:14px"><h3>Recent salary payments</h3>${salaryPayments.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Employee</th><th>Salary month</th><th>Method</th><th>Amount</th></tr></thead><tbody>${[...salaryPayments].reverse().slice(0,30).map(p=>`<tr><td>${H(p.date)}</td><td>${H(p.employeeName)}</td><td>${H(p.month)}</td><td>${H(p.method)}</td><td>${cash(p.amount)}</td></tr>`).join('')}</tbody></table></div>`:empty('No salary payment recorded yet.')}</section></div>`;
}
function employeeCalendar(id,m=chosenMonth){
 const x=getStaff(id),start=new Date(Number(m.slice(0,4)),Number(m.slice(5,7))-1,1).getDay(),days=daysIn(m);
 return `<div class="ap-calendar-head">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<span>${x}</span>`).join('')}</div><div class="ap-calendar">${Array.from({length:start},()=>'<span></span>').join('')}${Array.from({length:days},(_,i)=>{let date=monthDate(m,i+1),a=attendance[date+'_'+id],type=statusClass(a?.status);return `<button type="button" class="ap-day ${type} ${date===dayLocal()?'today':''}" title="${date} ${H(a?.status||'Unmarked')}: ${H(a?.in||'--')} - ${H(a?.out||'--')}" onclick="AkaoraStaffPayroll.day('${H(id)}','${date}')"><strong>${i+1}</strong><small>${a?H(a.status):'Not marked'}</small><small>${a?.in?H(a.in):''}${a?.out?'–'+H(a.out):''}</small></button>`}).join('')}</div>`;
}
function staffProfile(id){
 const x=getStaff(id);if(!x)return toast('Employee not found');const r=compute(id);
 const image=x.photo?`<img src="${H(x.photo)}" alt="${H(x.name)}"/>`:`<div class="ap-profile-empty">${H(x.name[0]||'?')}</div>`;
 const body=`<div class="ap-profile"><figure>${image}<div style="margin-top:8px"><button class="secondary" onclick="AkaoraStaffPayroll.photo('${H(id)}')">Upload / change photo</button></div></figure><div><h3 style="margin:0 0 10px">${H(x.name)}</h3><dl><div><dt>Phone</dt><dd>${H(x.phone||'—')}</dd></div><div><dt>Joining</dt><dd>${H(x.join||'—')}</dd></div><div><dt>Monthly salary</dt><dd>${cash(x.salary)}</dd></div><div><dt>Paid off days / month</dt><dd>${Number(x.leaveDays)||0}</dd></div><div><dt>ID attachment</dt><dd>${x.idDoc?'Encrypted · '+H(x.idDoc.name):'None uploaded'}</dd></div><div><dt>Salary balance (${chosenMonth})</dt><dd>${cash(r.due)}</dd></div></dl><div class="ap-action-row" style="margin-top:14px"><button class="secondary" onclick="staffModal('${H(id)}')">Edit employee</button><button class="secondary" onclick="AkaoraStaffPayroll.uploadDoc('${H(id)}')">Upload ID document</button>${x.idDoc?`<button class="secondary" onclick="AkaoraStaffPayroll.viewDoc('${H(id)}')">View secure ID</button>`:''}<button class="danger" onclick="AkaoraStaffPayroll.remove('${H(id)}')">Delete employee</button></div></div></div>
 <div class="ap-detail-stats"><div><strong>${r.present}</strong><small>Present days</small></div><div><strong>${r.half}</strong><small>Half days</small></div><div><strong>${r.absent}</strong><small>Absent days</small></div><div><strong>${r.offs}</strong><small>Paid off allowance</small></div></div><div class="ap-topline"><h3 style="margin:0">Attendance · ${chosenMonth}</h3><div class="ap-month"><button class="secondary" onclick="AkaoraStaffPayroll.profileStep('${H(id)}',-1)">←</button><input type="month" value="${chosenMonth}" aria-label="Attendance month" onchange="AkaoraStaffPayroll.profileMonth('${H(id)}',this.value)"><button class="secondary" onclick="AkaoraStaffPayroll.profileStep('${H(id)}',1)">→</button></div></div>
 ${employeeCalendar(id)}<div class="ap-legend"><span class="ap-badge p">Present</span><span class="ap-badge a">Absent</span><span class="ap-badge h">Half day</span><span class="ap-badge o">Paid leave</span><span class="ap-badge n">Unmarked</span></div>
 <div class="ap-pay-preview">${salaryBreakdown(r)}</div><div class="ap-action-row" style="margin-top:12px"><button onclick="AkaoraStaffPayroll.payslip('${H(id)}')">View payslip</button><button class="secondary" onclick="AkaoraStaffPayroll.printChoice('${H(id)}')">Print payslip</button><button class="secondary" onclick="AkaoraStaffPayroll.pay('${H(id)}')">Mark salary paid</button><button class="secondary" onclick="advanceModal('${H(id)}')">Record advance</button></div>`;
 openModal('Employee · '+x.name,body,'Close',()=>closeModal());

  if(fingerprint&&seen.has(sig))return;
  if(!fingerprint){const newest=list[0];if(newest?.message===text&&Date.now()-newest.at<6000)return;}
  if(fingerprint)seen.add(sig);
  list.unshift({id:'n_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),message:text,type,at:Date.now(),read:false,destination,fingerprint:sig});

 }

 const oldAppShell=appShell;

  const button=document.createElement('button');button.id='akaoraNotifyButton';button.className='notify-bell';button.type='button';button.setAttribute('title','Notifications');button.setAttribute('aria-haspopup','dialog');button.setAttribute('aria-expanded','false');button.innerHTML='<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span class="notify-count" hidden></span>';

function customerStats(p){const history=invoices.filter(i=>i.customerId===p.id||(!i.customerId&&(normPhone(p.phone).length===10&&normPhone(i.customerPhone)===normPhone(p.phone))));return {history,total:round(history.reduce((n,i)=>n+Number(i.total||0),0)),unpaid:round(history.reduce((n,i)=>n+Math.max(0,Number(i.total||0)-Number(i.paid||0)),0))}}
function customerPage(){let all=customers(),query=(window.akaoraCustomerSearch||'').toLowerCase(),shown=all.filter(p=>(p.name+' '+p.phone+' '+p.email+' '+p.customerCode).toLowerCase().includes(query));return head('Customers','Customer records, purchase history and assigned loyalty coupons.',`<button class="amber" onclick="AkaoraV15.customerEditor()">+ Add customer</button>`)+`<div class="grid metrics">${metric('Customers',all.length,'Saved customer IDs','parties')}${metric('Repeat customers',all.filter(p=>customerStats(p).history.length>1).length,'More than one purchase','bills')}${metric('Available coupons',coupons.filter(c=>!c.redeemedInvoiceId&&c.status!=='disabled'&&(!c.expires||c.expires>=dateLocal())).length,'Linked to customer IDs','reports')}</div><section class="card v15-customer-shell"><div class="toolbar"><input aria-label="Search customers" placeholder="Search name, phone or Customer ID..." value="${safe(window.akaoraCustomerSearch||'')}" oninput="AkaoraV15.searchCustomer(this.value)"></div>${shown.length?`<div class="v15-customer-grid">${shown.map(p=>{const s=customerStats(p);return `<article class="v15-customer-card"><span class="v15-avatar">${safe(p.name.charAt(0).toUpperCase())}</span><div><b>${safe(p.name)}</b><small>${safe(p.customerCode)} · ${safe(p.phone||'No phone')}</small><small>${s.history.length} orders · ${money(s.total)} spent</small></div><button class="secondary" onclick="AkaoraV15.customerDetail('${safe(p.id)}')">Open →</button></article>`}).join('')}</div>`:empty('No customers saved yet. Create one here, or save a bill with customer contact details.')}</section>`}
function customerEditor(id){const p=parties.find(x=>x.id===id&&x.type==='Customer')||{name:'',phone:'',email:'',address:'',notes:'',customerCode:''};openModal(id?'Edit customer':'New customer',`<p class="muted tiny">Customer ID is automatically assigned and never changes. Coupon codes are tied to this record.</p><div class="fieldgrid">${field('Customer name','v15CustName',p.name,'text',true)}${field('Phone / WhatsApp','v15CustPhone',p.phone,'tel')}${field('Email','v15CustEmail',p.email,'email')}${field('Address','v15CustAddress',p.address)}<div class="full"><label>Notes</label><textarea id="v15CustNotes">${safe(p.notes)}</textarea></div></div>`,id?'Save customer':'Create customer',()=>{const name=$('#v15CustName').value.trim(),phone=$('#v15CustPhone').value.trim(),email=$('#v15CustEmail').value.trim();if(!name)return toast('Enter customer name');if(phone&&normPhone(phone).length!==10)return toast('Enter a valid 10-digit Indian phone number');if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Enter a valid email');if(phone&&customers().some(x=>x.id!==id&&normPhone(x.phone)===normPhone(phone)))return toast('This phone already belongs to a saved customer');const rec={...p,id:p.id||uid(),customerCode:p.customerCode||newCode('CUS'),type:'Customer',name,phone,email,address:$('#v15CustAddress').value.trim(),notes:$('#v15CustNotes').value.trim()};if(id)parties[parties.findIndex(x=>x.id===id)]=rec;else parties.push(rec);save();closeModal();pageRender();toast('Customer saved')})}
function customerDetail(id){const p=customers().find(x=>x.id===id);if(!p)return;const stats=customerStats(p),items=couponsFor(id);openModal('Customer · '+p.name,`<div class="v15-profile"><span class="v15-avatar">${safe(p.name.charAt(0).toUpperCase())}</span><div><b>${safe(p.name)}</b><div class="muted tiny">${safe(p.customerCode)} · ${safe(p.phone||'No phone')}<br>${safe(p.email||'No email')}</div></div></div><div class="v15-mini-stats"><span>Orders <b>${stats.history.length}</b></span><span>Spent <b>${money(stats.total)}</b></span><span>Due <b>${money(stats.unpaid)}</b></span></div><h3>Customer coupons</h3>${items.map(c=>`<p class="v15-coupon-line"><b>${safe(c.code)}</b> · ${c.redeemedInvoiceId?'Redeemed':c.status==='disabled'?'Disabled':'Available'} · ${c.kind==='percent'?c.value+'%':money(c.value)} off</p>`).join('')||'<p class="muted tiny">No coupons issued</p>'}<h3>Latest purchases</h3>${stats.history.slice(-8).reverse().map(i=>`<p class="v15-coupon-line">${safe(i.no)} · ${money(i.total)} · ${new Date(i.date).toLocaleDateString('en-IN')}</p>`).join('')||'<p class="muted tiny">No purchases yet</p>'}<div class="actions"><button type="button" class="secondary" onclick="closeModal();AkaoraV15.customerEditor('${safe(p.id)}')">Edit profile</button><button type="button" class="amber" onclick="closeModal();go('coupons');AkaoraV15.couponEditor('', '${safe(p.id)}')">Create coupon</button></div>`,'Close',closeModal)}
function couponPage(){ensureCustomerIds();return head('Coupons','Issue unique, one-time coupons linked to a customer. Redeem on their next bill.',`<button class="amber" onclick="AkaoraV15.couponEditor()">+ Issue coupon</button>`)+`<div class="grid metrics">${metric('Issued',coupons.length,'Customer-linked codes','bills')}${metric('Redeemed',coupons.filter(c=>c.redeemedInvoiceId).length,'One-time usage','reports')}${metric('Available',coupons.filter(c=>!c.redeemedInvoiceId&&c.status!=='disabled'&&(!c.expires||c.expires>=dateLocal())).length,'Unused & active','products')}</div><section class="card"><h3>Unique customer coupons</h3><p class="muted tiny">Select a customer before using a coupon at checkout. No coupon can be redeemed twice or by another customer. No automatic WhatsApp message is sent.</p><div class="v15-coupon-grid">${coupons.length?coupons.slice().reverse().map(c=>{const p=parties.find(x=>x.id===c.customerId),used=!!c.redeemedInvoiceId,expired=!!(c.expires&&c.expires<dateLocal()),status=used?'Redeemed':c.status==='disabled'?'Disabled':expired?'Expired':'Ready';return `<article class="v15-coupon-card"><span class="v15-coupon-badge">${status}</span><h3>${safe(c.code)}</h3><b>${c.kind==='percent'?Number(c.value)+'% OFF':money(c.value)+' OFF'}</b><p>${safe(p?.name||'Deleted customer')} · ${safe(p?.customerCode||'Unknown ID')}</p><small>Min bill ${money(c.minSpend)} · Expiry ${safe(c.expires||'No expiry')}</small>${used?`<small>Used on ${safe(c.redeemedInvoiceNo||'an invoice')}</small>`:''}<div class="actions"><button class="secondary" onclick="AkaoraV15.copyCoupon('${safe(c.code)}')">Copy code</button>${!used?`<button class="secondary" onclick="AkaoraV15.toggleCoupon('${safe(c.id)}')">${c.status==='disabled'?'Enable':'Disable'}</button>`:''}${!used&&p?.phone?`<button class="secondary" onclick="AkaoraV15.shareCoupon('${safe(c.id)}')">WhatsApp</button>`:''}</div></article>`}).join(''):empty('No coupons yet. Add a customer and issue a coupon.')}</div></section>`}
function couponEditor(id,preselected){const c=coupons.find(x=>x.id===id)||{customerId:preselected||'',kind:'amount',value:100,minSpend:500,expires:'',status:'active'};const all=customers();if(!all.length)return toast('Add a customer before issuing a coupon');openModal('Issue one-time customer coupon',`<p class="muted tiny">The unique coupon belongs only to the selected customer and can be redeemed once on an eligible future bill.</p><div class="fieldgrid"><div class="full"><label>Registered customer</label><select id="v15CouponCustomer">${all.map(p=>`<option value="${safe(p.id)}" ${p.id===c.customerId?'selected':''}>${safe(p.name)} · ${safe(p.customerCode)}</option>`).join('')}</select></div><div><label>Discount type</label><select id="v15CouponKind"><option value="amount" ${c.kind==='amount'?'selected':''}>Flat amount (₹)</option><option value="percent" ${c.kind==='percent'?'selected':''}>Percentage (%)</option></select></div>${field('Discount value','v15CouponValue',c.value,'number',true)}${field('Minimum bill (₹)','v15CouponMin',c.minSpend,'number')}${field('Valid through (optional)','v15CouponExpiry',c.expires,'date')}</div>`,'Generate unique coupon',()=>{const customerId=$('#v15CouponCustomer').value,kind=$('#v15CouponKind').value,value=Number($('#v15CouponValue').value),minSpend=Number($('#v15CouponMin').value||0),expires=$('#v15CouponExpiry').value;if(!customerId||!Number.isFinite(value)||value<=0||(kind==='percent'&&value>100)||!Number.isFinite(minSpend)||minSpend<0)return toast('Enter a valid discount and minimum bill');if(expires&&expires<dateLocal())return toast('Expiry must not be in the past');let code;do{code=newCode('AKA')}while(coupons.some(x=>x.code===code));const coupon={id:uid(),code,customerId,kind,value:round(value),minSpend:round(minSpend),expires,status:'active',issuedAt:Date.now(),redeemedInvoiceId:null,redeemedInvoiceNo:null};coupons.push(coupon);if(!storeCoupons()){coupons.pop();return}closeModal();pageRender();toast('Coupon '+coupon.code+' function shareCoupon(id){const c=coupons.find(x=>x.id===id),p=parties.find(x=>x.id===c?.customerId);if(!c||!p?.phone)return toast('Customer phone missing');const text=`${profile.shopName}: Your personal coupon ${c.code} offers ${c.kind==='percent'?c.value+'%':money(c.value)} off on an eligible bill above ${money(c.minSpend)}. Valid until ${c.expires||'further notice'}. Show this code at checkout.`;window.open('https://wa.me/91'+normPhone(p.phone)+'?text='+encodeURIComponent(text),'_blank','noopener,noreferrer')}
function restructureSettings(){const content=document.querySelector('#content');if(!content)return;const originalGrid=content.querySelector('.settings-layout')||content.querySelector('.settings-grid');if(!originalGrid)return;const cards=[...originalGrid.querySelectorAll('section.card'),...content.querySelectorAll(':scope > section.card')];const host=document.createElement('div');host.className='v15-settings-accordions';for(const card of cards){let group=null;for(const child of [...card.children]){if(child.tagName==='H3'){if(group)host.appendChild(group);group=document.createElement('details');group.className='v15-settings-group';const label=child.innerHTML;const summary=document.createElement('summary');summary.innerHTML='<span>'+label+'</span><span class="v15-chevron">⌄</span>';group.appendChild(summary);const inner=document.createElement('div');inner.className='v15-settings-inner';group.appendChild(inner);const clean=child.textContent.toLowerCase().replace(/[^a-z ]/g,'').trim().replace(/\s+/g,'-').slice(0,36);group.dataset.section=clean;group.open=(sessionStorage.getItem('akaora_basics_settings_section')||'appearance-language')===clean;continue;}if(!group){group=document.createElement('details');group.className='v15-settings-group';group.innerHTML='<summary>Additional settings</summary><div class="v15-settings-inner"></div>'}if(child.classList?.contains('line')&&group.querySelector('.v15-settings-inner').children.length===0){child.remove();continue;}group.querySelector('.v15-settings-inner').appendChild(child)}if(group)host.appendChild(group);card.remove()}const rank=['appearance','business profile','business workflow','invoice defaults','printing','upi','admin','data backup'];const order=el=>{const name=el.querySelector('summary')?.textContent.toLowerCase()||'';const i=rank.findIndex(x=>name.includes(x));return i<0?99:i};[...host.children].sort((a,b)=>order(a)-order(b)).forEach(x=>host.appendChild(x));originalGrid.replaceWith(host);if(!host.querySelector('details[open]'))host.querySelector('details')?.setAttribute('open','');host.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{if(!d.open)return;sessionStorage.setItem('akaora_basics_settings_section',d.dataset.section||'appearance-language');host.querySelectorAll('details').forEach(other=>{if(other!==d)other.open=false})}));}

window.AkaoraV15={customerEditor,customerDetail,couponEditor,copyCoupon:code=>{navigator.clipboard?.writeText(code).then(()=>toast('Coupon code copied')).catch(()=>toast('Copy: '+code))},toggleCoupon:id=>{const c=coupons.find(x=>x.id===id);if(!c||c.redeemedInvoiceId)return;c.status=c.status==='disabled'?'active':'disabled';storeCoupons();pageRender()},shareCoupon,searchCustomer:value=>{window.akaoraCustomerSearch=value;clearTimeout(customerSearchTimer);customerSearchTimer=setTimeout(()=>{if(page==='customers'){const active=document.activeElement;pageRender();const inp=document.querySelector('.v15-customer-shell .toolbar input');inp?.focus();inp?.setSelectionRange(value.length,value.length)}},160)},applyCoupon:()=>{const code=String(document.getElementById('v15BillingCoupon')?.value||'').trim().toUpperCase();if(!code){billDraft.couponCode='';billDraft.paid=null;pageRender();return}const customer=resolveCustomer(),base=oldCalc();const info=checkCoupon(code,customer,Math.max(0,base.sub-base.d));if(info.error)return toast(info.error);billDraft.couponCode=code;billDraft.paid=null;pageRender();toast('Coupon applied: '+code)},removeCoupon:()=>{billDraft.couponCode='';billDraft.paid=null;pageRender()},getCoupons:()=>coupons.map(c=>({...c})),test:{checkCoupon,round,dateLocal,resolveCustomer}};
I.customers='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M18 8a3 3 0 0 1 0 6M17 16a4 4 0 0 1 4 4"/></svg>';I.coupons='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h18v5a3 3 0 0 0 0 6v5H3v-5a3 3 0 0 0 0-6V4Z"/><path d="M12 4v16" stroke-dasharray="2 2"/></svg>';navs.splice(navs.findIndex(x=>x[0]==='parties'),0,['customers','Customers']);/* Coupons not available in Basics */
const oldCalc=calc;
calc=function(){const v=oldCalc();if(!billDraft.couponCode)return v;const info=checkCoupon(billDraft.couponCode,resolveCustomer(),Math.max(0,v.sub-v.d));if(info.error)return v;const d=round(v.d+info.discount),tax=round(Math.max(0,v.sub-d)*Number(settings.tax||0)/100);return {...v,d,tax,total:round(v.sub-d+tax),couponDiscount:info.discount,couponCode:info.coupon.code}};
const oldBill=billingPage;
billingPage=function(){let html=oldBill();const coupon=String(billDraft.couponCode||'');const info=coupon?checkCoupon(coupon,resolveCustomer(),Math.max(0,oldCalc().sub-oldCalc().d)):null;const section=`<div class="v15-coupon-checkout"><label><b>Customer coupon</b> · one-time discount</label><div class="v15-coupon-input"><input id="v15BillingCoupon" value="${safe(coupon)}" placeholder="e.g. AKA-AB12CD34" autocomplete="off" aria-label="Coupon code"><button type="button" class="secondary" onclick="AkaoraV15.applyCoupon()">Apply</button>${coupon?'<button class="secondary" type="button" onclick="AkaoraV15.removeCoupon()">Remove</button>':''}</div><p class="muted tiny">Choose a saved customer first. Coupons only work for the customer they were issued to.</p>${info&&!info.error?`<p class="v15-coupon-success">✓ ${safe(coupon)} applied · ${money(info.discount)} off</p>`:info?.error?`<p class="v15-coupon-error">${safe(info.error)}</p>`:''}</div>`;return html.replace('<div id="akaoraInstantUPI"></div>',section+'<div id="akaoraInstantUPI"></div>')};
const previousDraftChange=changeBillDraft;
changeBillDraft=function(key,value){previousDraftChange(key,value);if((key==='customerPhone'||key==='customerName')&&billDraft.partyId){const selected=parties.find(p=>p.id===billDraft.partyId);const changed=key==='customerPhone'&&normPhone(selected?.phone)!==normPhone(value)||key==='customerName'&&String(selected?.name||'').trim().toLowerCase()!==String(value||'').trim().toLowerCase();if(changed){billDraft.partyId='';billDraft.couponCode='';billDraft.paid=null;updateTotals()}}};
const oldChoose=chooseCustomer;
chooseCustomer=function(id){oldChoose(id);if(billDraft.couponCode&&!checkCoupon(billDraft.couponCode,resolveCustomer(),Math.max(0,oldCalc().sub-oldCalc().d)).coupon)billDraft.couponCode='';billDraft.paid=null;pageRender()};
const oldFinalize=finalize;
finalize=function(){const code=billDraft.couponCode||'',cust=resolveCustomer(),base=oldCalc(),info=code?checkCoupon(code,cust,Math.max(0,base.sub-base.d)):null;if(code&&info.error)return toast(info.error);const before=invoices.length,customerSnapshot={id:cust?.id||'',name:String(billDraft.customerName||'').trim(),phone:String(billDraft.customerPhone||'').trim(),email:String(billDraft.customerEmail||'').trim()};oldFinalize();if(invoices.length!==before+1)return;const inv=invoices[invoices.length-1];let customer=parties.find(p=>p.id===customerSnapshot.id&&p.type==='Customer');if(!customer&&(customerSnapshot.name||customerSnapshot.phone)){customer=findCustomerByPhone(customerSnapshot.phone);if(!customer&&customerSnapshot.email)customer=customers().find(p=>p.email&&p.email.toLowerCase()===customerSnapshot.email.toLowerCase());if(!customer){customer={id:uid(),customerCode:newCode('CUS'),type:'Customer',name:customerSnapshot.name||'Customer',phone:customerSnapshot.phone,email:customerSnapshot.email,address:'',notes:'',createdAt:Date.now()};parties.push(customer)}}if(customer){inv.customerId=customer.id;inv.customerCode=customer.customerCode;if(!customer.phone&&customerSnapshot.phone)customer.phone=customerSnapshot.phone;if(!customer.email&&customerSnapshot.email)customer.email=customerSnapshot.email;}if(info?.coupon){const target=coupons.find(c=>c.id===info.coupon.id);if(target&&!target.redeemedInvoiceId){target.redeemedInvoiceId=inv.id;target.redeemedInvoiceNo=inv.no;target.redeemedAt=Date.now();inv.couponCode=target.code;inv.couponDiscount=info.discount;storeCoupons()}}save()};
const oldV15PageRender=pageRender;
pageRender=function(){if(page==='customers'||page==='coupons'){save();applyPreferences();const container=document.getElementById('content');if(container)container.innerHTML=page==='customers'?customerPage():couponPage();window.AkaoraNotifications?.refresh();return}oldV15PageRender();if(page==='settings')restructureSettings()};
const oldOffers=window.akaoraOffersPage;
window.akaoraOffersPage=function(){let html=oldOffers();const all=window.AkaoraOffers.get();let j=0;return html.replace(/<article class="card">/g,()=>{const o=all[j++];return `<article class="card v15-offer-card">${o?.image?`<div class="v15-offer-img"><img alt="Offer photo" src="${safe(o.image)}"></div>`:''}`})};
function resizeImage(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');if(!file.type.startsWith('image/'))return reject(new Error('Please choose an image.'));if(file.size>5*1024*1024)return reject(new Error('Choose an image under 5 MB.'));const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,760/img.width,440/img.height);c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.72))};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Cannot read image'))};img.src=url})}
window.AkaoraV15.offerEditor=function(id){if(!products.length)return toast('Add a product first');const all=window.AkaoraOffers.get(),o=all.find(x=>x.id===id)||{productId:products[0].id,freeProductId:products[0].id,buy:3,get:1,active:true},list=(selected)=>products.map(p=>`<option value="${safe(p.id)}" ${p.id===selected?'selected':''}>${safe(p.name)} · ${Number(p.qty)||0} stock</option>`).join('');openModal(id?'Edit offer':'Create offer',`<div class="fieldgrid"><div class="full"><label>Customer buys</label><select id="oProduct">${list(o.productId)}</select></div><div class="full"><label>Customer receives free</label><select id="oFreeProduct">${list(o.freeProductId||o.productId)}</select></div>${field('Buy quantity','oBuy',o.buy,'number',true)}${field('Free quantity','oFree',o.get,'number',true)}<div class="full"><label>Offer image (optional · up to 5 MB)</label><input type="file" id="v15OfferImage" accept="image/*"><div class="v15-offer-image-preview" id="v15OfferImagePreview">${o.image?`<img src="${safe(o.image)}" alt="Saved offer photo">`:'No image selected'}</div><label class="v15-remove-image"><input id="v15RemoveImage" type="checkbox" style="width:auto"> Remove existing image</label></div></div><p class="muted tiny">Images are compressed and stored locally. Promotions repeat per paid quantity; the gift product is deducted from stock.</p>`,'Save offer',async()=>{const productId=$('#oProduct').value,freeProductId=$('#oFreeProduct').value,buy=Number($('#oBuy').value),get=Number($('#oFree').value);if(!Number.isInteger(buy)||buy<1||buy>999||!Number.isInteger(get)||get<1||get>99)return toast('Enter positive whole-number quantities');if(all.some(x=>x.productId===productId&&x.id!==id&&x.active!==false))return toast('Another active offer exists for this product');const file=$('#v15OfferImage').files[0];let image=$('#v15RemoveImage').checked?'':o.image||'';try{if(file)image=await resizeImage(file)}catch(e){return toast(e.message)}const newOffer={...o,id:id||uid(),productId,freeProductId,buy,get,active:o.active!==false,image};if(id){all[all.findIndex(x=>x.id===id)]=newOffer}else all.push(newOffer);window.AkaoraOffers.restore(all);closeModal();pageRender();toast('Offer saved')});$('#v15OfferImage').onchange=async e=>{try{const b=await resizeImage(e.target.files[0]);$('#v15OfferImagePreview').innerHTML=`<img alt="Offer preview" src="${b}">`}catch(err){toast(err.message)}}};

const oldExport=exportData;

const oldImport=importData;

 const choices=navs.filter(([name])=>!['home','products','billing','printer','bills','settings'].includes(name));const panel=document.createElement('div');panel.id='v15MobileMoreMenu';panel.className='v15-mobile-more-panel';panel.hidden=true;panel.innerHTML='<h3>All sections</h3>'+choices.map(([p,label])=>'<button type="button" data-v15-mobile="'+safe(p)+'">'+ic(p)+'<span>'+safe(label)+'</span></button>').join('');document.body.appendChild(panel);document.querySelectorAll('body > .v15-mobile-more-panel').forEach(el=>{if(el!==panel)el.remove()});panel.querySelectorAll('[data-v15-mobile]').forEach(x=>x.addEventListener('click',()=>go(x.dataset.v15Mobile)));
};

.v16-tabstrip{display:flex;align-items:center;gap:8px;overflow-x:auto;max-width:100%;padding:3px 0 9px;scrollbar-width:thin}
.v16-tab{flex:0 0 auto!important;background:var(--card,#fff)!important;border:1px solid var(--line,#ccc)!important;color:var(--text)!important;border-radius:14px!important;padding:12px 16px!important;display:flex;align-items:center;gap:9px}
.v16-tab.selected{background:color-mix(in srgb,var(--amber) 13%,var(--card))!important;border-color:var(--amber)!important;color:var(--text)!important}
.v16-tab span{font-size:12px;padding:2px 7px;background:color-mix(in srgb,var(--muted) 15%,transparent);border-radius:999px}
.v16-party-toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.v16-party-toolbar h3{margin:0 0 4px}.v16-party-toolbar p{margin:0}.v16-party-toolbar input{max-width:360px;min-width:min(100%,270px)}.v16-count{font-size:12px;font-weight:500;color:var(--muted);padding-left:8px}
.v16-party-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.v16-person-card{display:flex;gap:13px;align-items:center;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.03);min-width:0}
.v16-person-photo,.v16-photo-preview{width:70px;height:70px;flex:0 0 70px;overflow:hidden;border-radius:18px;background:linear-gradient(135deg,#2953b7,#8d6ee7);color:white;display:grid;place-items:center;font-size:26px;font-weight:800}
.v16-person-photo img,.v16-photo-preview img{width:100%;height:100%;object-fit:cover;display:block}
.v16-person-data{min-width:0;flex:1}.v16-person-data h3{margin:2px 0 4px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v16-person-category{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:800;color:var(--amber)}
.v16-person-id{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.v16-person-sub{font-size:12px;color:var(--muted);margin-top:3px}.v16-open{flex:0 0 auto;font-size:12px!important;padding:9px!important}
.v16-empty-party{text-align:center;max-width:100%;padding:38px!important}.v16-empty-party h3{margin-bottom:5px}.v16-empty-icon{font-size:32px}.v16-photo-form{display:flex;align-items:center;gap:15px;padding:14px;border:1px dashed var(--line);border-radius:16px;margin-bottom:15px}.v16-photo-form p{margin:4px 0 10px}.v16-photo-form .v16-photo-preview{width:96px;height:96px;flex-basis:96px}
.v16-upload-label{display:inline-block;padding:9px 12px;cursor:pointer;border-radius:10px;background:var(--blue);color:white;font-weight:600;margin:0 8px 7px 0}.v16-upload-label input{display:none}.v16-category-list>div{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:9px 0}.v16-category-list{margin-top:18px}
.v16-profile{display:flex;align-items:center;gap:18px}.v16-profile h2{margin:4px 0}.v16-profile-photo{width:95px;height:95px;flex-basis:95px}.v16-info-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}.v16-info-list>div{padding:12px;background:color-mix(in srgb,var(--card) 80%,var(--line));border-radius:12px;min-width:0}.v16-info-list span{display:block;color:var(--muted);font-size:12px}.v16-info-list b{overflow-wrap:anywhere}.v16-linked-coupons{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.v16-linked-coupons>span{border:1px solid var(--line);border-radius:8px;padding:6px}
.v16-templates{margin:22px 0 25px}.v16-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.v16-section-head h2{margin:4px 0;font-size:23px}.v16-section-head p{color:var(--muted);margin:0}.v16-eyebrow{color:var(--amber);font-size:11px;font-weight:850;letter-spacing:1.4px}.v16-template-count{padding:7px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.v16-template-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px}
.v16-template-card{min-height:205px;padding:17px;border-radius:19px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;border:1px solid var(--line);background:var(--card);overflow:hidden;position:relative}
.v16-template-card:before{content:'';position:absolute;inset:0 0 auto;height:66px;background:linear-gradient(110deg,var(--tone),transparent);opacity:.15;pointer-events:none}
.v16-template-card h3{margin:0 0 5px;font-size:16px}.v16-template-card p{margin:0;color:var(--muted);font-size:12px}.v16-template-top{display:flex;justify-content:space-between;align-items:center;position:relative}.v16-symbol{font-size:30px}.v16-tag{font-size:9px;font-weight:800;letter-spacing:.6px;border-radius:999px;padding:5px 8px;color:var(--tone);background:color-mix(in srgb,var(--tone) 13%,transparent)}
.v16-template-use{background:color-mix(in srgb,var(--tone) 13%,var(--card))!important;color:var(--text)!important;border:1px solid color-mix(in srgb,var(--tone) 40%,var(--line))!important;width:100%;padding:10px!important;text-align:center}
.v16-tone-violet{--tone:#9170fb}.v16-tone-blue{--tone:#478ff5}.v16-tone-amber{--tone:#f1b34d}.v16-tone-rose{--tone:#ed729d}.v16-tone-teal{--tone:#31b8af}.v16-tone-mint{--tone:#43bb84}
.v16-coupon-template{min-height:240px}.v16-coupon-ticket{display:grid;gap:4px;padding:13px;border-radius:13px;border:1px dashed color-mix(in srgb,var(--tone) 60%,var(--line));background:color-mix(in srgb,var(--tone) 12%,var(--card))}.v16-coupon-ticket>span{font-size:11px;font-weight:800;color:var(--tone)}.v16-coupon-ticket strong{font-size:25px}.v16-coupon-ticket small{font-size:11px;color:var(--muted)}.v16-coupon-template h3{font-size:13px}.v16-coupon-chooser{padding:12px 14px;border:1px dashed var(--line);border-radius:12px;margin-bottom:18px}.v16-coupon-chooser label{display:block;margin-bottom:8px}.v16-coupon-chooser p{margin:8px 0 0}.v16-modal-preset{padding:12px;border-radius:12px;background:color-mix(in srgb,var(--tone) 15%,var(--card));margin-bottom:15px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.v16-modal-preset span{color:var(--muted);font-size:12px}
.v16-issued-brand{display:inline-flex;padding:5px 9px;margin-bottom:10px;background:color-mix(in srgb,var(--v16-issued) 16%,transparent);border-radius:9px;color:var(--v16-issued);font-size:11px;letter-spacing:1px;font-weight:850}
.v16-issued-violet{--v16-issued:#9170fb}.v16-issued-blue{--v16-issued:#478ff5}.v16-issued-amber{--v16-issued:#c18b31}.v16-issued-rose{--v16-issued:#ed729d}.v16-issued-teal{--v16-issued:#31b8af}.v16-issued-mint{--v16-issued:#43bb84}
body.dark-mode .v16-template-card{box-shadow:0 15px 30px rgba(0,0,0,.12)}
@media(max-width:700px){.v16-party-toolbar input{max-width:none;width:100%}.v16-template-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.v16-template-card{min-height:200px;padding:12px}.v16-section-head h2{font-size:20px}.v16-person-card{padding:12px}.v16-photo-form{flex-wrap:wrap}.v16-info-list{grid-template-columns:1fr}}
@media(max-width:430px){.v16-template-grid{grid-template-columns:1fr}.v16-template-card{min-height:174px}.v16-section-head{flex-wrap:wrap}}

<script id="akaora-v18-features">

/* v18 — Customer discovery, coupon eligibility and visible auto-offer feedback. */
(function(){
'use strict';
const E=v=>esc(String(v??''));
const INR=n=>money(Math.max(0,Number(n)||0));
let customerQuery='',pickerOpen=false,couponsExpanded=false;
function allCustomers(){return parties.filter(p=>p.type==='Customer');}
function linkedCustomer(){return allCustomers().find(p=>p.id===billDraft.partyId)||null;}
function currentEligibleAmount(){
 const subtotal=cartItems().reduce((s,x)=>s+Number(x.p.price||0)*Number(x.q||0),0);
 const manual=Math.min(subtotal,Math.max(0,Number(billDraft.discount)||0));
 const offerAmount=Math.min(Math.max(0,subtotal-manual),window.AkaoraOfferEngine?.discounts?.().reduce((n,d)=>n+Number(d.amount||0),0)||0);
 return Math.round(Math.max(0,subtotal-manual-offerAmount)*100)/100;
}
function availableCoupons(){
 const c=linkedCustomer();if(!c)return [];
 const currentDate=new Date(),date=[currentDate.getFullYear(),String(currentDate.getMonth()+1).padStart(2,'0'),String(currentDate.getDate()).padStart(2,'0')].join('-');
 return (window.AkaoraV15?.getCoupons?.()||[]).filter(x=>x.customerId===c.id&&x.status!=='disabled'&&x.status!=='used'&&!x.redeemedInvoiceId&&!(x.expires&&x.expires<date)&&!invoices.some(i=>i.couponCode===x.code));
}
function searchResults(query){const q=String(query||'').trim().toLowerCase();const list=allCustomers();return (q?list.filter(p=>[p.name,p.phone,p.email,p.customerCode].some(x=>String(x||'').toLowerCase().includes(q))):list).slice(0,20)}
function resultsMarkup(list){return list.length?list.map(p=>`<button type="button" class="v18-customer-option" onclick="AkaoraV18.selectCustomer('${E(p.id)}')"><span class="v18-customer-avatar">${E((p.name||'C').charAt(0).toUpperCase())}</span><span class="v18-customer-info"><strong>${E(p.name)}</strong><small>${E(p.phone||'No phone')} · ${E(p.email||'No email')}</small></span><span aria-hidden="true">↗</span></button>`).join(''):'<div class="v18-match-hint">No matching customers. Try another name, phone or email.</div>'}
function searchChange(value){customerQuery=value;pickerOpen=true;const host=document.getElementById('v18CustomerResults');if(host){host.innerHTML=resultsMarkup(searchResults(customerQuery));host.hidden=false}}
function openSearch(){pickerOpen=!pickerOpen;const host=document.getElementById('v18CustomerResults');if(host){host.hidden=!pickerOpen;if(pickerOpen){host.innerHTML=resultsMarkup(searchResults(customerQuery));document.getElementById('v18CustomerSearch')?.focus()}}}
function selectCustomer(id){const p=allCustomers().find(x=>x.id===id);if(!p)return;customerQuery=p.name||'';pickerOpen=false;couponsExpanded=true;chooseCustomer(id);/* existing code saves customer name, phone and email and re-renders */}
function clearSelection(){customerQuery='';pickerOpen=false;couponsExpanded=false;chooseCustomer('');billDraft.couponCode='';billDraft.paid=null;pageRender()}
function customerPicker(){const selected=linkedCustomer();return `<div class="v18-customer-search"><div class="v18-picker-heading"><strong>Find registered customer</strong><span>Search name · phone · email</span></div><div class="v18-search-wrap"><span class="v18-search-icon">⌕</span><input id="v18CustomerSearch" type="search" autocomplete="off" placeholder="Search customer name, mobile or email" value="${E(customerQuery||(selected?.name||''))}" oninput="AkaoraV18.search(this.value)" onfocus="AkaoraV18.focusSearch()" aria-label="Search saved customers"></div><div class="v18-results" id="v18CustomerResults" ${pickerOpen?'':'hidden'}>${pickerOpen?resultsMarkup(searchResults(customerQuery)):''}</div><div class="v18-saved-choice">${selected?`Selected: <b>${E(selected.name)}</b> · ${E(selected.customerCode||'Customer ID')}`:'Select a saved customer, or continue as walk-in.'}</div></div>`}
function couponArea(){const selected=linkedCustomer(),list=availableCoupons(),sum=currentEligibleAmount();const count=list.length;
 const cards=list.map(c=>{const required=Math.max(0,Number(c.minSpend||0)),short=Math.max(0,Math.round((required-sum)*100)/100),qualifies=short<.005&&sum>.005;const saving=c.kind==='percent'?Number(c.value)+'% OFF':INR(c.value)+' OFF';return `<article class="v18-coupon-ticket ${qualifies?'eligible':''}"><div class="v18-ticket-top"><strong>${E(c.code)}</strong><span class="v18-ticket-value">${E(saving)}</span></div><div class="v18-criteria">Minimum shopping: ${INR(required)} · Current eligible bill: ${INR(sum)}${c.expires?` · Valid until ${E(c.expires)}`:''}</div>${qualifies?`<div class="v18-eligible">✓ Eligible — coupon ready to apply</div><button type="button" class="amber" onclick="AkaoraV18.apply('${E(c.code)}')">Apply coupon</button>`:`<div class="v18-more">₹${(short).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})} की और shopping करनी पड़ेगी।</div><button type="button" class="secondary" disabled title="Minimum spend not reached">Not eligible yet</button>`}</article>`}).join('');
 return `<section class="v18-coupon-panel" id="v18CouponPanel"><button class="v18-coupon-trigger" type="button" aria-expanded="${couponsExpanded}" onclick="AkaoraV18.toggleCoupons()"><span><strong>🎟 Available coupons</strong><small>${selected?`For ${E(selected.name)} · ${INR(sum)} eligible cart amount`:'Select a registered customer to view their coupons'}</small></span><span class="v18-coupon-pill">${count} ${couponsExpanded?'▴':'▾'}</span></button><div class="v18-coupon-body" id="v18CouponList" ${couponsExpanded?'':'hidden'}>${!selected?'<p class="v18-empty">Select a customer to see assigned coupons.</p>':count?cards:'<p class="v18-empty">No coupons available</p>'}</div></section>`;
}
function liveOffers(){const gifts=window.AkaoraOfferEngine?.gifts?.()||[], discounts=window.AkaoraOfferEngine?.discounts?.()||[];if(!gifts.length&&!discounts.length)return '';
 const giftHtml=gifts.map(x=>{const p=products.find(p=>p.id===x.productId);return `<div class="v18-offer-row">🎁 <b>${E(p?.name||'Gift')} × ${Number(x.qty)||0} FREE</b> — automatically added with this bill. Stock will be reduced on saving.</div>`}).join('');
 const discountHtml=discounts.map(x=>{const p=products.find(p=>p.id===x.productId);return `<div class="v18-offer-row">✓ <b>${E(p?.name||'Product')} · Automatic discount ${INR(x.amount)}</b> (${Number(x.times)||0} qualifying set${Number(x.times)===1?'':'s'})</div>`}).join('');
 return `<div class="v18-live-offers" aria-live="polite">${giftHtml}${discountHtml}</div>`;
}
const previousBilling=billingPage;
billingPage=function(){let html=previousBilling();
 // Leave the original select available as a dropdown (users may search or pick from it).
 const selector=/(<select\s+id="bparty"[^>]*>[\s\S]*?<\/select>)/;
 if(selector.test(html))html=html.replace(selector,(match)=>customerPicker()+match);
 // Provide a reliable, independent coupon panel even when the old manual-code block is present.
 const block='<div class="v15-coupon-checkout">';
 if(html.includes(block))html=html.replace(block,couponArea()+block);
 else html=html.replace('<div id="akaoraInstantUPI"></div>',couponArea()+'<div id="akaoraInstantUPI"></div>');
 const offer=liveOffers();if(offer)html=html.replace('<div class="cart-list">',offer+'<div class="cart-list">');

};
// Any selector, manual input or new bill can rerender the checkout. Keep its current scroll location.
const previousPageRender=pageRender;
pageRender=function(){const prior=document.querySelector('.bill-checkout')?.scrollTop||0,side=document.querySelector('.sidebar')?.scrollTop||0,bodyY=window.scrollY;previousPageRender();const next=document.querySelector('.bill-checkout');if(page==='billing'&&next)next.scrollTop=prior;const sidebar=document.querySelector('.sidebar');if(sidebar)sidebar.scrollTop=side;if(window.scrollY!==bodyY)window.scrollTo(0,bodyY)};
// Previous versions scroll to the top after navigation; preserve position (including sidebar).
const previousGo=go;
go=function(target){const side=document.querySelector('.sidebar')?.scrollTop||0,bodyY=window.scrollY;previousGo(target);const sidebar=document.querySelector('.sidebar');if(sidebar)sidebar.scrollTop=side;window.scrollTo(0,bodyY);requestAnimationFrame(()=>{const sb=document.querySelector('.sidebar');if(sb)sb.scrollTop=side;window.scrollTo(0,bodyY)})};
const previousChoose=chooseCustomer;
chooseCustomer=function(id){const previousId=billDraft.partyId;previousChoose(id);if(id!==previousId){if(id){const p=linkedCustomer();customerQuery=p?.name||'';couponsExpanded=true;}else{customerQuery='';couponsExpanded=false;}pickerOpen=false;billDraft.paid=null;pageRender();}};
window.AkaoraV18={
 search:searchChange,
 focusSearch:()=>{pickerOpen=true;const host=document.getElementById('v18CustomerResults');if(host){host.innerHTML=resultsMarkup(searchResults(customerQuery));host.hidden=false}},
 toggleSearch:openSearch,
 selectCustomer,
 clearSelection,
 toggleCoupons:()=>{couponsExpanded=!couponsExpanded;const el=document.getElementById('v18CouponPanel');if(!el)return;const list=document.getElementById('v18CouponList');if(list)list.hidden=!couponsExpanded;el.querySelector('.v18-coupon-trigger')?.setAttribute('aria-expanded',String(couponsExpanded));const pill=el.querySelector('.v18-coupon-pill');if(pill)pill.textContent=availableCoupons().length+(couponsExpanded?' ▴':' ▾')},
 apply:code=>{if(!linkedCustomer())return toast('Select a saved customer first');const value=document.getElementById('v15BillingCoupon');if(!value)return toast('Coupon input not found');value.value=code;window.AkaoraV15.applyCoupon()},
 test:{availableCoupons,currentEligibleAmount,searchResults,liveOffers}
};
})();

</script>

 */
(function(){
